name: v188 Phase13 Current Model Scope Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v188-phase13-current-model-scope-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1

      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit test scope correction
        working-directory: runtime
        run: |
          python -m pytest -q tests/test_oos_calibration_scope_v4.py

      - name: Rehydrate persisted OOS report with ledger rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('state/soccer_edge_state/analysis')
          report = json.loads((base/'oos_calibration_v4_report.json').read_text(encoding='utf-8'))
          rows = []
          for line in (base/'oos_prediction_ledger_v4.jsonl').read_text(encoding='utf-8').splitlines():
              if line.strip():
                  rows.append(json.loads(line))
          report['rows'] = rows
          Path('/tmp/oos_full.json').write_text(json.dumps(report), encoding='utf-8')
          print(json.dumps({'rehydrated_rows': len(rows), 'model_version_counts': report.get('model_version_counts')}, indent=2))
          PY

      - name: Apply current-model calibration scope in dry-run
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=runtime python -m mcp_gateway.oos_calibration_scope_v4 \
            --input /tmp/oos_full.json \
            --output /tmp/oos_scoped.json

          jq '{
            calibration_scope_model_version,
            canonical_target_scope,
            current_source_model_version,
            all_model_rows,
            current_model_rows,
            ready_target_count,
            targets_improving_brier_and_log_loss,
            btts_current: .targets.btts,
            btts_historical_mixed: .historical_all_models_targets.btts,
            provider_requests_added,
            production_promotion_allowed,
            runtime_prediction_weight,
            canonical_bet_logic_changed
          }' /tmp/oos_scoped.json

      - name: Validate dry-run invariants
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .canonical_target_scope == "CURRENT_SOURCE_MODEL_VERSION_ONLY"
            and .current_source_model_version != null
            and .all_model_rows >= .current_model_rows
            and .current_model_rows > 0
            and .targets.btts.rows == .current_model_rows
            and .historical_all_models_targets.btts.rows >= .targets.btts.rows
            and .provider_requests_added == 0
            and .production_promotion_allowed == false
            and .runtime_prediction_weight == 0
            and .canonical_bet_logic_changed == false
          ' /tmp/oos_scoped.json >/dev/null

      - name: Persist compact v188 audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state/soccer_edge_state/analysis
          jq '{
            schema_version: "1.0.0",
            status: "PHASE13_CURRENT_MODEL_SCOPE_DRY_RUN_VALIDATED",
            calibration_scope_model_version,
            canonical_target_scope,
            current_source_model_version,
            all_model_rows,
            current_model_rows,
            ready_target_count,
            targets_improving_brier_and_log_loss,
            btts_current: .targets.btts,
            btts_historical_mixed: .historical_all_models_targets.btts,
            provider_requests_added,
            production_promotion_allowed,
            runtime_prediction_weight,
            canonical_bet_logic_changed
          }' /tmp/oos_scoped.json > state/soccer_edge_state/analysis/phase13_current_model_scope_audit_v4.json

          cd state
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/phase13_current_model_scope_audit_v4.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "v188 persist Phase13 current-model scope audit"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
