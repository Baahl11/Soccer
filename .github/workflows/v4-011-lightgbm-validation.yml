# V4-011 Draw challenger live audit: 2026-09-24
name: V4-011 LightGBM Goals Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/v4-011-lightgbm-validation.yml"]

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout runtime research code
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          fetch-depth: 1

      - name: Checkout state for formation audit
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install offline challenger dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "lightgbm>=4,<5" "scikit-learn>=1.5,<2" pytest

      - name: Warm Render
        run: |
          curl -sS --max-time 360 --retry 2 --retry-delay 5 --retry-all-errors \
            https://soccer-edge-api.onrender.com/health >/tmp/health.json || true
          cat /tmp/health.json || true

      - name: Export point-in-time training dataset
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          token=$(echo "$response" | jq -r '.value // empty')
          test -n "$token"
          echo "::add-mask::$token"

          cutoff=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          http_code=$(curl -sS --max-time 430 -o /tmp/v4_011_dataset.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg cutoff "$cutoff" '{cutoff:$cutoff,row_limit:20000}')" \
            https://soccer-edge-api.onrender.com/internal/training-dataset/export)

          test "$http_code" = "200"
          jq -e '.status == "OK"' /tmp/v4_011_dataset.json >/dev/null
          jq -e '.market_fields_included == false' /tmp/v4_011_dataset.json >/dev/null

      - name: Validate Draw challenger unit tests
        run: |
          PYTHONPATH=. pytest -q tests/test_draw_challenger_v4.py

      - name: Audit missing formations against persisted pre-kickoff feature snapshots
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          baseline = json.loads(
              Path("state/soccer_edge_state/analysis/corners_baseline.json").read_text(encoding="utf-8")
          )
          dataset = json.loads(Path("/tmp/v4_011_dataset.json").read_text(encoding="utf-8"))

          audit_rows = ((baseline.get("formation_eligibility_audit") or {}).get("rows") or [])
          missing = {
              int(row["fixture_id"]): row
              for row in audit_rows
              if row.get("fixture_id") is not None and not row.get("matchup")
          }
          dataset_by_fixture = {
              int(row["fixture_id"]): row
              for row in (dataset.get("rows") or [])
              if row.get("fixture_id") is not None
          }

          reasons = Counter()
          recovered = []
          details = []

          for fixture_id, source in sorted(missing.items()):
              row = dataset_by_fixture.get(fixture_id)
              if not row:
                  reason = "NO_TRAINING_DATASET_ROW"
                  details.append({"fixture_id": fixture_id, "reason": reason})
                  reasons[reason] += 1
                  continue

              features = row.get("features") or {}
              home = features.get("availability.home_formation")
              away = features.get("availability.away_formation")
              both = features.get("availability.both_xi_confirmed")
              captured = row.get("feature_captured_at")
              kickoff = row.get("kickoff")

              if home and away and both is True:
                  reason = "RECOVERABLE_PREKICKOFF_BOTH_FORMATIONS"
                  recovered.append({
                      "fixture_id": fixture_id,
                      "feature_captured_at": captured,
                      "kickoff": kickoff,
                      "home_formation": home,
                      "away_formation": away,
                  })
              elif bool(home) ^ bool(away):
                  reason = "ONE_TEAM_FORMATION_IN_FEATURE_SNAPSHOT"
              elif both is True:
                  reason = "CONFIRMED_XI_WITHOUT_BOTH_FORMATIONS"
              else:
                  reason = "NO_VERIFIED_BOTH_FORMATIONS_IN_LATEST_PREKICKOFF_SNAPSHOT"

              reasons[reason] += 1
              details.append({
                  "fixture_id": fixture_id,
                  "reason": reason,
                  "feature_captured_at": captured,
                  "kickoff": kickoff,
                  "home_formation": home,
                  "away_formation": away,
                  "both_xi_confirmed": both,
              })

          output = {
              "status": "FORMATION_FEATURE_SNAPSHOT_RECONCILIATION_AUDIT",
              "policy": "POSTGRES_DERIVED_FEATURE_SNAPSHOTS_STRICTLY_BEFORE_KICKOFF_ONLY",
              "missing_matchup_targets": len(missing),
              "training_dataset_rows": dataset.get("row_count"),
              "targets_with_dataset_row": sum(1 for fid in missing if fid in dataset_by_fixture),
              "recoverable_prekickoff_both_formations": len(recovered),
              "reason_counts": dict(sorted(reasons.items())),
              "recovered_rows": recovered,
              "rows": details,
          }
          Path("/tmp/formation_feature_snapshot_audit.json").write_text(
              json.dumps(output, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(output, indent=2, sort_keys=True))
          PY

      - name: Upload formation reconciliation audit
        uses: actions/upload-artifact@v4
        with:
          name: formation-feature-snapshot-audit
          path: /tmp/formation_feature_snapshot_audit.json
          retention-days: 30

      - name: Run chronological LightGBM challenger
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from mcp_gateway import lightgbm_goals_v4

          data = json.loads(Path("/tmp/v4_011_dataset.json").read_text())
          report = lightgbm_goals_v4.walk_forward(
              data.get("rows") or [],
              min_train_rows=lightgbm_goals_v4.MIN_TRAIN_ROWS,
              min_oos_rows=lightgbm_goals_v4.MIN_OOS_ROWS,
          )
          output = {
              "dataset_version": data.get("dataset_version"),
              "feature_schema_version": data.get("feature_schema_version"),
              "dataset_fingerprint": data.get("dataset_fingerprint"),
              "dataset_row_count": data.get("row_count"),
              "report": report,
          }
          Path("/tmp/v4_011_report.json").write_text(
              json.dumps(output, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(json.dumps(output, indent=2, sort_keys=True))

          assert report["market_fields_used"] is False
          assert report["post_kickoff_features_used"] is False
          assert report["silent_imputation_used"] is False
          assert report["promotion_allowed"] is False
          assert report["status"] in {
              "INSUFFICIENT_TRAINING_SAMPLE",
              "RESEARCH_ONLY",
              "LIGHTGBM_DEPENDENCY_UNAVAILABLE",
          }
          PY

      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: v4-011-lightgbm-report
          path: /tmp/v4_011_report.json
          retention-days: 30

      - name: Run Draw-specific chronological challenger
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m mcp_gateway.draw_challenger_v4 \
            --dataset /tmp/v4_011_dataset.json \
            --output /tmp/draw_challenger_v4.json

          jq '{
            model_version,
            status,
            dataset_row_count,
            eligible_rows,
            walk_forward_evaluated,
            baseline_metrics,
            challenger_metrics,
            comparison,
            research_followup_candidate,
            production_promotion_allowed
          }' /tmp/draw_challenger_v4.json

          jq -e '
            .model_version == "LIGHTGBM_DRAW_V4_CHALLENGER_1.2.0"
            and .market_fields_used == false
            and .post_kickoff_features_used == false
            and .provider_requests_added == 0
            and .production_promotion_allowed == false
            and (.status == "RESEARCH_ONLY" or .status == "INSUFFICIENT_TRAINING_SAMPLE" or .status == "INSUFFICIENT_CLASS_SUPPORT")
          ' /tmp/draw_challenger_v4.json >/dev/null

      - name: Upload Draw challenger report
        uses: actions/upload-artifact@v4
        with:
          name: draw-challenger-v4-report
          path: /tmp/draw_challenger_v4.json
          retention-days: 30

      - name: Persist Draw challenger research checkpoint
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p soccer_edge_state/analysis
          cp /tmp/draw_challenger_v4.json soccer_edge_state/analysis/draw_challenger_v4.json
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/draw_challenger_v4.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Draw challenger OOS research report"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase --autostash origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

