name: Soccer Edge V4 Runtime Tests

on:
  push:
    branches:
      - soccer-edge-mcp-v1
    paths:
      - "mcp_gateway/**"
      - "tests/test_v4_*.py"
      - "tests/test_clv_postgres_v4.py"
      - "tests/test_oos_prediction_ledger_v4.py"
      - "tests/test_one_x_two_multiclass_oos_v4.py"
      - ".github/workflows/v4-runtime-tests.yml"

jobs:
  v4-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_gateway/requirements.txt pytest
      - name: Run V4 scheduler regression tests
        run: |
          PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider \
            tests/test_v4_006_fair_scheduler.py \
            tests/test_v4_007_feature_snapshot.py \
            tests/test_v4_008_training_dataset.py \
            tests/test_v4_009_dixon_coles.py \
            tests/test_v4_010_bivariate_poisson.py \
            tests/test_v4_011_lightgbm_goals.py \
            tests/test_v4_012_ensemble.py \
            tests/test_clv_postgres_v4.py \
            tests/test_oos_prediction_ledger_v4.py \
            tests/test_team_totals_intelligence.py \
            tests/test_league_stage_stability_v4.py \
            tests/test_phase19_promotion_framework_v4.py \
            tests/test_oos_history_backfill_v4.py \
            tests/test_clv_history_merge_v4.py \
            tests/test_shadow_settlement_v4.py \
            tests/test_v4_017_one_x_two_validation.py \
            tests/test_v4_018_btts_validation.py \
            tests/test_one_x_two_multiclass_oos_v4.py
