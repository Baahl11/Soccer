name: Soccer Edge V210 Frozen Calibration Audit

on:
  workflow_dispatch:
  push:
    branches:
      - soccer-edge-mcp-v1
    paths:
      - "mcp_gateway/frozen_calibration_audit_v4.py"
      - "mcp_gateway/automation_v127.py"
      - "mcp_gateway/tick_worker.py"
      - "mcp_gateway/build_signal_ledger.py"
      - "tests/test_frozen_calibration_audit_v4.py"
      - "tests/test_automation_v127.py"
      - "tests/test_build_signal_ledger_provenance.py"
      - ".github/workflows/v210-frozen-calibration-audit.yml"

permissions:
  contents: read

jobs:
  frozen-calibration-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install -r mcp_gateway/requirements.txt
          python -m pip install pytest

      - name: Run v210 unit tests
        run: |
          PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider \
            tests/test_frozen_calibration_audit_v4.py \
            tests/test_automation_v127.py \
            tests/test_build_signal_ledger_provenance.py

      - name: Checkout immutable state snapshot
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1

      - name: Rebuild point-in-time ledger with v210 schema
        run: |
          mkdir -p artifacts
          python mcp_gateway/build_signal_ledger.py \
            --history-dir state/soccer_edge_state/history \
            --output artifacts/signal_ledger_v210.jsonl \
            --summary-output artifacts/signal_ledger_summary_v210.json
          cat artifacts/signal_ledger_summary_v210.json

      - name: Audit rebuilt historical signal ledger
        run: |
          python -m mcp_gateway.frozen_calibration_audit_v4 \
            --input artifacts/signal_ledger_v210.jsonl \
            --output artifacts/frozen_calibration_audit_v4.json
          cat artifacts/frozen_calibration_audit_v4.json

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: v210-frozen-calibration-audit
          path: |
            artifacts/frozen_calibration_audit_v4.json
            artifacts/signal_ledger_summary_v210.json
          if-no-files-found: error
          retention-days: 14
