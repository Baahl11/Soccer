name: Soccer Edge V210 Frozen Calibration Audit

on:
  workflow_dispatch:
  push:
    branches:
      - soccer-edge-mcp-v1
    paths:
      - "mcp_gateway/frozen_calibration_audit_v4.py"
      - "tests/test_frozen_calibration_audit_v4.py"
      - ".github/workflows/v210-frozen-calibration-audit.yml"

permissions:
  contents: read

jobs:
  frozen-calibration-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Run v210 unit tests
        run: PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider tests/test_frozen_calibration_audit_v4.py

      - name: Checkout immutable state snapshot
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1

      - name: Audit historical signal ledger
        run: |
          mkdir -p artifacts
          python -m mcp_gateway.frozen_calibration_audit_v4 \
            --input state/soccer_edge_state/analysis/signal_ledger.jsonl \
            --output artifacts/frozen_calibration_audit_v4.json
          cat artifacts/frozen_calibration_audit_v4.json

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: v210-frozen-calibration-audit
          path: artifacts/frozen_calibration_audit_v4.json
          if-no-files-found: error
          retention-days: 14
