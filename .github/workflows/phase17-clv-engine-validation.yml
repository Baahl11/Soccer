name: Phase 17 CLV Engine Validation - Confidence Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/phase17-clv-engine-validation.yml"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 17 unit tests
        working-directory: runtime
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          PYTHONPATH=. pytest -q tests/test_phase17_clv_engine_v4.py

      - name: Build current CLV engine report
        working-directory: runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m mcp_gateway.clv_engine_v4             --tracking ../state/soccer_edge_state/analysis/true_clv_tracking.jsonl             --output ../state/soccer_edge_state/analysis/phase17_clv_engine_report.json

      - name: Validate safety gates
        run: |
          set -euo pipefail
          jq -e '.phase == "FASE_17_CLV_ENGINE"' state/soccer_edge_state/analysis/phase17_clv_engine_report.json >/dev/null
          jq -e '.production_promotion_allowed == false' state/soccer_edge_state/analysis/phase17_clv_engine_report.json >/dev/null

      - name: Persist report to state branch
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/phase17_clv_engine_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Phase 17 CLV engine report"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
