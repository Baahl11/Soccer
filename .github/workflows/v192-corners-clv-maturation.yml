name: v192 Corners CLV Maturation Patch

on:
  push:
    branches: [soccer-edge-mcp-v1]
    paths:
      - .github/workflows/v192-corners-clv-maturation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          fetch-depth: 0

      - name: Apply exact Corners maturation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('mcp_gateway/price_resolver_v4.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'MODEL_VERSION = "SOCCER_PRICE_RESOLVER_V4_1.19.0"',
              'MODEL_VERSION = "SOCCER_PRICE_RESOLVER_V4_1.19.1"',
              'model-version',
          )

          replace_once(
              '''    if family == "1H":\n        return bool(expected_market) and _norm(market.get("market")) == expected_market\n    if family not in {"1X2", "FT_TOTALS", "BTTS"}:''',
              '''    if family in {"1H", "FT_CORNERS", "TEAM_CORNERS"}:\n        return bool(expected_market) and _norm(market.get("market")) == expected_market\n    if family not in {"1X2", "FT_TOTALS", "BTTS"}:''',
              'exact-derivative-market-matcher',
          )

          replace_once(
              '        if family not in {"1X2", "FT_TOTALS", "BTTS", "1H"} or not raw_signal_at:',
              '        if family not in {"1X2", "FT_TOTALS", "BTTS", "1H", "FT_CORNERS", "TEAM_CORNERS"} or not raw_signal_at:',
              'later-quote-family-allowlist',
          )

          replace_once(
              '            if family == "1H":\n                desired_selection = str(signal.get("selection") or "")',
              '            if family in {"1H", "FT_CORNERS", "TEAM_CORNERS"}:\n                desired_selection = str(signal.get("selection") or "")',
              'exact-selection-line-check',
          )

          replace_once(
              '        if str(signal.get("market_family") or "").upper() in {"1X2", "FT_TOTALS", "BTTS", "1H"}',
              '        if str(signal.get("market_family") or "").upper() in {"1X2", "FT_TOTALS", "BTTS", "1H", "FT_CORNERS", "TEAM_CORNERS"}',
              'family-accounting',
          )

          loader = dedent(r'''
          def _load_corners_clv_maturation_backlog(
              *,
              lookback_days: int = TEAM_TOTALS_DIVERSITY_LOOKBACK_DAYS,
              lookahead_minutes: int = PRIMARY_CLV_MATURATION_LOOKAHEAD_MINUTES,
              limit: int = PRIMARY_CLV_MATURATION_BACKLOG_LIMIT,
          ) -> dict[str, Any]:
              """Load priced FT/Team Corners signals still missing an exact later quote.

              Provider-call free. Signals come from the same persisted derivative
              intelligence rows consumed by Phase17. The resolver may later reuse an
              already-paid /odds payload or spend only from the existing primary CLV
              maturation cap; this loader itself never calls the provider.
              """
              empty = {
                  "candidate_events": [],
                  "candidate_count": 0,
                  "candidate_family_counts": {},
                  "candidate_source_counts": {},
                  "source": "POSTGRES_NOT_CONFIGURED",
              }
              if not persistence.persistence_configured():
                  return empty

              persistence.ensure_schema()
              now = datetime.now(timezone.utc)
              cutoff = now - timedelta(days=max(1, int(lookback_days)))
              lookahead = now + timedelta(minutes=max(20, int(lookahead_minutes)))

              with persistence._connect() as conn:
                  with conn.cursor() as cur:
                      cur.execute(
                          """
                          WITH base_events AS (
                              SELECT
                                  e.fixture_id,
                                  e.generated_at AS signal_generated_at,
                                  e.payload,
                                  f.league_id,
                                  f.league,
                                  f.country,
                                  f.season,
                                  f.round,
                                  f.kickoff,
                                  f.status,
                                  f.status_long,
                                  f.home_team_id,
                                  f.home_team,
                                  f.away_team_id,
                                  f.away_team,
                                  f.venue,
                                  f.city
                              FROM soccer_refresh_events e
                              JOIN soccer_fixtures f ON f.fixture_id = e.fixture_id
                              WHERE e.generated_at >= %s
                                AND e.generated_at < f.kickoff
                                AND f.kickoff > %s
                                AND f.kickoff <= %s
                                AND COALESCE(f.status, 'NS') NOT IN ('FT','AET','PEN','CANC','PST','ABD','AWD','WO')
                          ),
                          candidate_rows AS (
                              SELECT
                                  be.*,
                                  'FT_CORNERS'::TEXT AS market_family,
                                  'DERIVATIVE_INTELLIGENCE:corners_intelligence'::TEXT AS candidate_source,
                                  sig.row AS signal_row
                              FROM base_events be
                              CROSS JOIN LATERAL jsonb_array_elements(
                                  CASE
                                      WHEN jsonb_typeof(COALESCE(be.payload -> 'corners_intelligence' -> 'observed_market_rows', '[]'::jsonb)) = 'array'
                                      THEN COALESCE(be.payload -> 'corners_intelligence' -> 'observed_market_rows', '[]'::jsonb)
                                      ELSE '[]'::jsonb
                                  END
                              ) AS sig(row)

                              UNION ALL

                              SELECT
                                  be.*,
                                  'TEAM_CORNERS'::TEXT AS market_family,
                                  'DERIVATIVE_INTELLIGENCE:team_corners_intelligence'::TEXT AS candidate_source,
                                  sig.row AS signal_row
                              FROM base_events be
                              CROSS JOIN LATERAL jsonb_array_elements(
                                  CASE
                                      WHEN jsonb_typeof(COALESCE(be.payload -> 'team_corners_intelligence' -> 'observed_market_rows', '[]'::jsonb)) = 'array'
                                      THEN COALESCE(be.payload -> 'team_corners_intelligence' -> 'observed_market_rows', '[]'::jsonb)
                                      ELSE '[]'::jsonb
                                  END
                              ) AS sig(row)
                          ),
                          ranked AS (
                              SELECT
                                  cr.*,
                                  ROW_NUMBER() OVER (
                                      PARTITION BY
                                          cr.fixture_id,
                                          cr.market_family,
                                          LOWER(TRIM(COALESCE(cr.signal_row ->> 'market', ''))),
                                          LOWER(TRIM(COALESCE(cr.signal_row ->> 'selection', ''))),
                                          COALESCE(cr.signal_row ->> 'line', '')
                                      ORDER BY cr.signal_generated_at DESC
                                  ) AS signal_rank
                              FROM candidate_rows cr
                          )
                          SELECT
                              s.fixture_id,
                              s.market_family,
                              s.signal_row ->> 'market' AS market,
                              s.signal_row ->> 'selection' AS selection,
                              s.signal_row ->> 'line' AS line,
                              s.signal_generated_at,
                              s.candidate_source,
                              s.league_id,
                              s.league,
                              s.country,
                              s.season,
                              s.round,
                              s.kickoff,
                              s.status,
                              s.status_long,
                              s.home_team_id,
                              s.home_team,
                              s.away_team_id,
                              s.away_team,
                              s.venue,
                              s.city
                          FROM ranked s
                          WHERE s.signal_rank = 1
                            AND NULLIF(s.signal_row ->> 'market', '') IS NOT NULL
                            AND NULLIF(s.signal_row ->> 'selection', '') IS NOT NULL
                            AND COALESCE(s.signal_row ->> 'line', '') ~ '^[0-9]+([.][0-9]+)?$'
                            AND COALESCE(s.signal_row ->> 'decimal_price', s.signal_row ->> 'price', '') ~ '^[0-9]+([.][0-9]+)?$'
                            AND COALESCE(s.signal_row ->> 'decimal_price', s.signal_row ->> 'price')::DOUBLE PRECISION > 1.0
                            AND NOT EXISTS (
                                SELECT 1
                                FROM soccer_market_snapshots m
                                CROSS JOIN LATERAL jsonb_array_elements(
                                    CASE
                                        WHEN jsonb_typeof(COALESCE(m.values, '[]'::jsonb)) = 'array'
                                        THEN COALESCE(m.values, '[]'::jsonb)
                                        ELSE '[]'::jsonb
                                    END
                                ) AS q(value)
                                WHERE m.fixture_id = s.fixture_id
                                  AND m.captured_at > s.signal_generated_at
                                  AND m.captured_at < s.kickoff
                                  AND m.provider_update IS NOT NULL
                                  AND m.provider_update > s.signal_generated_at
                                  AND LOWER(TRIM(COALESCE(m.market, ''))) = LOWER(TRIM(COALESCE(s.signal_row ->> 'market', '')))
                                  AND (
                                        CASE
                                            WHEN LOWER(TRIM(COALESCE(q.value ->> 'selection', ''))) LIKE 'over%%' THEN 'over'
                                            WHEN LOWER(TRIM(COALESCE(q.value ->> 'selection', ''))) LIKE 'under%%' THEN 'under'
                                            ELSE LOWER(TRIM(COALESCE(q.value ->> 'selection', '')))
                                        END
                                      ) = (
                                        CASE
                                            WHEN LOWER(TRIM(COALESCE(s.signal_row ->> 'selection', ''))) LIKE 'over%%' THEN 'over'
                                            WHEN LOWER(TRIM(COALESCE(s.signal_row ->> 'selection', ''))) LIKE 'under%%' THEN 'under'
                                            ELSE LOWER(TRIM(COALESCE(s.signal_row ->> 'selection', '')))
                                        END
                                      )
                                  AND COALESCE(q.value ->> 'line', '') ~ '^[0-9]+([.][0-9]+)?$'
                                  AND ABS((q.value ->> 'line')::NUMERIC - (s.signal_row ->> 'line')::NUMERIC) < 0.000001
                            )
                          ORDER BY s.kickoff ASC, s.fixture_id ASC, s.market_family ASC, market ASC, selection ASC, line ASC
                          LIMIT %s
                          """,
                          (cutoff, now, lookahead, max(1, int(limit))),
                      )
                      rows = cur.fetchall()
                      columns = [desc.name for desc in cur.description]

              grouped: dict[int, dict[str, Any]] = {}
              family_counts: dict[str, int] = defaultdict(int)
              source_counts: dict[str, int] = defaultdict(int)
              for raw_row in rows:
                  row = dict(zip(columns, raw_row))
                  try:
                      fixture_id = int(row.get("fixture_id"))
                  except (TypeError, ValueError):
                      continue
                  line = _num(row.get("line"))
                  if line is None:
                      continue
                  family = str(row.get("market_family") or "").upper()
                  if family not in {"FT_CORNERS", "TEAM_CORNERS"}:
                      continue
                  source = str(row.get("candidate_source") or "")
                  kickoff = row.get("kickoff")
                  record = grouped.setdefault(fixture_id, {
                      "fixture": {
                          "fixture_id": fixture_id,
                          "league_id": row.get("league_id"),
                          "league": row.get("league"),
                          "country": row.get("country"),
                          "season": row.get("season"),
                          "round": row.get("round"),
                          "kickoff": kickoff.isoformat() if isinstance(kickoff, datetime) else kickoff,
                          "status": row.get("status"),
                          "status_long": row.get("status_long"),
                          "home_team_id": row.get("home_team_id"),
                          "home_team": row.get("home_team"),
                          "away_team_id": row.get("away_team_id"),
                          "away_team": row.get("away_team"),
                          "venue": row.get("venue"),
                          "city": row.get("city"),
                      },
                      "kickoff": kickoff,
                      "signals": [],
                  })
                  signal_at = row.get("signal_generated_at")
                  record["signals"].append({
                      "market_family": family,
                      "market": row.get("market"),
                      "selection": row.get("selection"),
                      "line": line,
                      "signal_generated_at": signal_at.isoformat() if isinstance(signal_at, datetime) else signal_at,
                      "candidate_source": source,
                  })
                  family_counts[family] += 1
                  if source:
                      source_counts[source] += 1

              events: list[dict[str, Any]] = []
              for record in grouped.values():
                  events.append({
                      "event_type": PRIMARY_CLV_MATURATION_EVENT_TYPE,
                      "stage": _maturation_stage(record.get("kickoff"), now),
                      "fixture": record["fixture"],
                      "classification": "RESEARCH_ONLY",
                      "bet_eligible": False,
                      "research_only": True,
                      "decision_weight": 0.0,
                      "primary_clv_maturation": {
                          "candidate_source": "POSTGRES_CORNERS_DERIVATIVE_SIGNAL_NO_LATER_EXACT_QUOTE",
                          "signals": list(record["signals"]),
                          "provider_requests_before_price_resolver": 0,
                          "primary_markets_preempted": False,
                          "requires_provider_update_after_signal": True,
                          "requires_same_selection_and_line": True,
                      },
                  })

              events.sort(key=lambda event: (
                  str(((event.get("fixture") or {}).get("kickoff") or "")),
                  int(((event.get("fixture") or {}).get("fixture_id") or 0)),
              ))
              return {
                  "candidate_events": events,
                  "candidate_count": len(events),
                  "candidate_family_counts": dict(sorted(family_counts.items())),
                  "candidate_source_counts": dict(sorted(source_counts.items())),
                  "source": "POSTGRES_CORNERS_DERIVATIVE_CLV_MATURATION_BACKLOG_V1",
              }
          ''').strip('\n') + '\n\n\n'

          marker = '\n\ndef _load_primary_clv_maturation_backlog('
          if text.count(marker) != 1:
              raise SystemExit(f'corners-loader insertion anchor count={text.count(marker)}')
          text = text.replace(marker, '\n\n' + loader + 'def _load_primary_clv_maturation_backlog(', 1)

          replace_once(
              '    primary_maturation = await asyncio.to_thread(_load_primary_clv_maturation_backlog)\n    one_h_maturation = await asyncio.to_thread(_load_one_h_clv_maturation_backlog)',
              '    primary_maturation = await asyncio.to_thread(_load_primary_clv_maturation_backlog)\n    one_h_maturation = await asyncio.to_thread(_load_one_h_clv_maturation_backlog)\n    corners_maturation = await asyncio.to_thread(_load_corners_clv_maturation_backlog)',
              'load-corners-backlog',
          )

          corners_merge = dedent(r'''
              for event in (corners_maturation.get("candidate_events") or []):
                  if not isinstance(event, dict):
                      continue
                  fixture = event.get("fixture") if isinstance(event.get("fixture"), dict) else {}
                  try:
                      fixture_id = int(fixture.get("fixture_id"))
                  except (TypeError, ValueError):
                      continue
                  existing = primary_by_fixture.get(fixture_id)
                  if existing is None:
                      primary_maturation_events.append(event)
                      primary_by_fixture[fixture_id] = event
                      continue
                  existing_meta = existing.get("primary_clv_maturation") if isinstance(existing.get("primary_clv_maturation"), dict) else {}
                  incoming_meta = event.get("primary_clv_maturation") if isinstance(event.get("primary_clv_maturation"), dict) else {}
                  existing_signals = [row for row in (existing_meta.get("signals") or []) if isinstance(row, dict)]
                  existing_signals.extend(row for row in (incoming_meta.get("signals") or []) if isinstance(row, dict))
                  existing_meta["signals"] = existing_signals
                  existing["primary_clv_maturation"] = existing_meta
          ''').strip('\n') + '\n\n'

          marker = '    family_counts = defaultdict(int, primary_maturation.get("candidate_family_counts") or {})\n'
          if text.count(marker) != 1:
              raise SystemExit(f'corners-merge insertion anchor count={text.count(marker)}')
          text = text.replace(marker, corners_merge + marker, 1)

          old_counts = '''    family_counts = defaultdict(int, primary_maturation.get("candidate_family_counts") or {})\n    for family, count in (one_h_maturation.get("candidate_family_counts") or {}).items():\n        family_counts[str(family)] += int(count or 0)\n    source_counts = defaultdict(int, primary_maturation.get("candidate_source_counts") or {})\n    for source, count in (one_h_maturation.get("candidate_source_counts") or {}).items():\n        source_counts[str(source)] += int(count or 0)\n    primary_maturation["candidate_family_counts"] = dict(sorted(family_counts.items()))\n    primary_maturation["candidate_source_counts"] = dict(sorted(source_counts.items()))\n    if one_h_maturation.get("candidate_count"):\n        primary_maturation["source"] = "POSTGRES_PRIMARY_PLUS_1H_DERIVATIVE_CLV_MATURATION_BACKLOG_V3"'''
          new_counts = '''    family_counts = defaultdict(int, primary_maturation.get("candidate_family_counts") or {})\n    for derivative_maturation in (one_h_maturation, corners_maturation):\n        for family, count in (derivative_maturation.get("candidate_family_counts") or {}).items():\n            family_counts[str(family)] += int(count or 0)\n    source_counts = defaultdict(int, primary_maturation.get("candidate_source_counts") or {})\n    for derivative_maturation in (one_h_maturation, corners_maturation):\n        for source, count in (derivative_maturation.get("candidate_source_counts") or {}).items():\n            source_counts[str(source)] += int(count or 0)\n    primary_maturation["candidate_family_counts"] = dict(sorted(family_counts.items()))\n    primary_maturation["candidate_source_counts"] = dict(sorted(source_counts.items()))\n    if one_h_maturation.get("candidate_count") or corners_maturation.get("candidate_count"):\n        primary_maturation["source"] = "POSTGRES_PRIMARY_PLUS_DERIVATIVE_CLV_MATURATION_BACKLOG_V4"'''
          replace_once(old_counts, new_counts, 'merge-family-source-counts')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          python -m py_compile mcp_gateway/price_resolver_v4.py
          python - <<'PY'
          from pathlib import Path
          import ast
          src = Path('mcp_gateway/price_resolver_v4.py').read_text(encoding='utf-8')
          ast.parse(src)
          required = [
              'SOCCER_PRICE_RESOLVER_V4_1.19.1',
              'def _load_corners_clv_maturation_backlog(',
              '"FT_CORNERS", "TEAM_CORNERS"',
              'corners_maturation = await asyncio.to_thread(_load_corners_clv_maturation_backlog)',
              'POSTGRES_PRIMARY_PLUS_DERIVATIVE_CLV_MATURATION_BACKLOG_V4',
          ]
          missing = [needle for needle in required if needle not in src]
          if missing:
              raise SystemExit(f'missing invariants: {missing}')
          if 'PRIMARY_CLV_MATURATION_MAX_CALLS_PER_TICK = max(' not in src:
              raise SystemExit('primary maturation call cap missing')
          print('v192 source invariants OK')
          PY
          git diff --check
          git diff -- mcp_gateway/price_resolver_v4.py

      - name: Commit production patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mcp_gateway/price_resolver_v4.py
          git commit -m 'v192: add exact Corners true-CLV maturation'
          git push origin HEAD:soccer-edge-mcp-v1
