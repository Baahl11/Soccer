# v160 refresh OOS calibration after v159
# Phase13 stage discrimination audit: 2026-09-24
name: Phase 13 OOS Calibration Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6,18 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/phase13-oos-calibration-validation.yml"]

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          fetch-depth: 1

      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Warm Render
        run: |
          curl -sS --max-time 180 --retry 2 --retry-delay 5 --retry-all-errors \
            https://soccer-edge-api.onrender.com/health >/tmp/health.json || true
          cat /tmp/health.json || true

      - name: Build OOS calibration ledger
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          TOKEN=$(echo "$RESPONSE" | jq -r '.value // empty')
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          HTTP_CODE=$(curl -sS --max-time 420 -o /tmp/oos_calibration_v4.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"lookback_days":180,"max_fixtures":10000}' \
            https://soccer-edge-api.onrender.com/internal/oos-calibration-v4/build)

          cat /tmp/oos_calibration_v4.json | jq '{status,fixture_rows,minimum_rows_per_target,ready_target_count,targets_improving_brier_and_log_loss,model_version_counts,run_type_counts,error,detail}'
          test "$HTTP_CODE" = "200"
          jq -e '.schema_version == "1.0.0" and (.rows | type == "array") and (.targets | type == "object") and (.provider_requests_added == 0)' /tmp/oos_calibration_v4.json >/dev/null

      - name: Merge strict historical OOS backfill
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=runtime python -m mcp_gateway.oos_history_backfill_v4 \
            --signal-ledger soccer_edge_state/analysis/signal_ledger.jsonl \
            --postgres-report /tmp/oos_calibration_v4.json \
            --output /tmp/oos_calibration_v4_merged.json
          mv /tmp/oos_calibration_v4_merged.json /tmp/oos_calibration_v4.json

          jq '{
            model_version,
            status,
            fixture_rows,
            postgres_fixture_rows,
            historical_fixture_rows,
            minimum_rows_per_target,
            ready_target_count,
            targets_improving_brier_and_log_loss,
            source_counts,
            model_version_counts,
            run_type_counts,
            provider_requests_added
          }' /tmp/oos_calibration_v4.json
          jq -e '.schema_version == "1.0.0" and (.rows | type == "array") and (.targets | type == "object") and (.provider_requests_added == 0)' /tmp/oos_calibration_v4.json >/dev/null

      - name: Build 1X2 multiclass walk-forward calibration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p soccer_edge_state/analysis
          PYTHONPATH=runtime python -m mcp_gateway.one_x_two_multiclass_oos_v4 \
            --oos-report /tmp/oos_calibration_v4.json \
            --output soccer_edge_state/analysis/one_x_two_multiclass_oos_v4.json
          jq '{model_version,status,source_model_version,source_rows_current_model,evaluated_rows,walk_forward_folds,brier_delta,log_loss_delta,improves_brier_and_log_loss,provider_requests_added}' soccer_edge_state/analysis/one_x_two_multiclass_oos_v4.json

      - name: Build OOS stage diagnostics
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=runtime python -m mcp_gateway.oos_stage_diagnostics_v4 \
            --oos-report /tmp/oos_calibration_v4.json \
            --output /tmp/oos_stage_diagnostics_v4.json
          jq '{
            model_version,
            status,
            current_source_model_version,
            all_model_rows,
            current_model_rows,
            stage_counts_current_model,
            provider_requests_added
          }' /tmp/oos_stage_diagnostics_v4.json
          jq -e '
            .schema_version == "1.0.0"
            and .model_version == "SOCCER_OOS_STAGE_DIAGNOSTICS_V4_1.3.0"
            and (.current_model_by_stage | type == "object")
            and ([.current_model_by_stage[]?.binary_targets.draw.discrimination | type] | all(. == "object"))
            and (.provider_requests_added == 0)
          ' /tmp/oos_stage_diagnostics_v4.json >/dev/null

      - name: Persist OOS calibration report and ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p soccer_edge_state/analysis

          jq 'del(.rows)' /tmp/oos_calibration_v4.json > soccer_edge_state/analysis/oos_calibration_v4_report.json
          jq -c '.rows[]' /tmp/oos_calibration_v4.json > soccer_edge_state/analysis/oos_prediction_ledger_v4.jsonl
          cp /tmp/oos_stage_diagnostics_v4.json soccer_edge_state/analysis/oos_stage_diagnostics_v4.json

          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/oos_calibration_v4_report.json
          git add -f soccer_edge_state/analysis/oos_prediction_ledger_v4.jsonl
          git add -f soccer_edge_state/analysis/oos_stage_diagnostics_v4.json
          git add -f soccer_edge_state/analysis/one_x_two_multiclass_oos_v4.json

          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update OOS calibration v4 ledger"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
