name: Phase 21 Alert Engine Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/phase21-alert-engine-validation.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 21 alert tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          PYTHONPATH=. pytest -q tests/test_phase21_alert_engine_v4.py
