name: Soccer SPORT ONLY Refined Research Canary (Manual)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/soccer_isolated_sport_only_v1.py'
      - '.github/workflows/soccer-isolated-sport-only-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soccer-sport-only-refined-research
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check isolated sport-only code and no-price invariants
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/soccer_isolated_sport_only_v1.py
          python .github/scripts/soccer_isolated_sport_only_v1.py --self-test
          python - <<'PY'
          from pathlib import Path
          code = Path(".github/scripts/soccer_isolated_sport_only_v1.py").read_text()
          flow = Path(".github/workflows/soccer-isolated-sport-only-v1.yml").read_text()
          assert "v5._cheap_sport_bundle" in code and "v5._refine_sport_bundle" in code
          assert "model.build_raw_projection" in code
          assert "MAX_PROVIDER_REQUESTS = 40" in code
          assert "SPORT_ONLY_NON_SPORT_NETWORK_BLOCKED" in code
          assert '"markets_queried": 0' in code and '"clv_rows_added": 0' in code
          assert "automation_v129.run_tick(" not in code.replace("automation_v129.run_tick, ", "")
          assert "price_resolver_v4.resolve_payload(" not in code
          assert not any(x.lstrip().startswith("- cron:") for x in flow.splitlines())
          assert "DATABASE_URL: ''" in flow
          print("SPORT_ONLY_WORKFLOW_STATIC_GATES_PASS")
          PY

  manually-triggered-live-pilot:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      DATABASE_URL: ''
      SOCCER_EDGE_MAX_API_CALLS_PER_TICK: '40'
      SOCCER_EDGE_CACHE_PATH: /tmp/soccer_sport_only_manual.sqlite3
    steps:
      - uses: actions/checkout@v4
        with:
          path: controls
      - uses: actions/checkout@v4
        with:
          repository: Baahl11/Soccer
          ref: soccer-edge-mcp-v1
          path: runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime dependencies
        run: python -m pip install -r runtime/mcp_gateway/requirements.txt
      - name: Run bounded pregame sport-only research with no Postgres
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}" || { echo "::error::OFFICIAL_API_KEY_NOT_CONFIGURED"; exit 1; }
          sha=$(git -C runtime rev-parse HEAD)
          PYTHONPATH=runtime python controls/.github/scripts/soccer_isolated_sport_only_v1.py \
            --runtime-sha "$sha" \
            --output sport_only_refined_research_receipt.json
          jq -e '
            .status == "SPORT_ONLY_RESEARCH_CANARY"
            and .markets_queried == 0 and .price_resolver_invocations == 0
            and .clv_rows_added == 0 and .db_writes == 0
            and .bet_eligible == false and .production_promotion_allowed == false
            and .full_deep_dives_verified == 0
            and .actual_provider_calls <= 40 and .transport_budget_denied == 0
            and .quota_headers_verified > 0 and .last_daily_remaining >= 1000
          ' sport_only_refined_research_receipt.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: soccer-sport-only-refined-research-receipt
          path: sport_only_refined_research_receipt.json
          retention-days: 7
