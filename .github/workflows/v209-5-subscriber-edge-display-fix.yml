name: v209.5 subscriber edge display fix
on:
  push:
    branches: [soccer-edge-mcp-v1]
    paths: ['.github/workflows/v209-5-subscriber-edge-display-fix.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
      - name: Patch presentation only
        shell: python
        run: |
          from pathlib import Path
          p=Path('mcp_gateway/subscriber_app_v4.py')
          s=p.read_text(encoding='utf-8')
          old="pct=v=>{{let n=Number(v);return Number.isFinite(n)?((Math.abs(n)<=1?n*100:n).toFixed(1)+'%'):'—'}},edge=r=>{{let n=Number(V(r,'edge_pp','edge','edge_pct','model_edge'));return Number.isFinite(n)?((Math.abs(n)<=1?n*100:n).toFixed(1)+' pp'):'—'}};"
          new="pct=v=>{{if(v==null||v==='')return '—';let n=Number(v);return Number.isFinite(n)?((Math.abs(n)<=1?n*100:n).toFixed(1)+'%'):'—'}},prob=(r,...k)=>{{let v=V(r,...k);if(v==null||v==='')return null;let n=Number(v);return Number.isFinite(n)?(Math.abs(n)<=1?n:n/100):null}},edge=r=>{{let explicit=V(r,'prob_edge_pp','edge_pp','edge','edge_pct','model_edge');if(explicit!=null&&explicit!==''){{let n=Number(explicit);if(Number.isFinite(n)&&Math.abs(n)>1e-12)return (Math.abs(n)<=1?n*100:n).toFixed(1)+' pp'}}let pm=prob(r,'p_model_calibrated','p_shrunk','p_raw','model_probability','probability'),pk=prob(r,'p_market_fair','p_market_devig','market_probability');return pm!=null&&pk!=null?((pm-pk)*100).toFixed(1)+' pp':'—'}};"
          if old not in s:
              raise SystemExit('target JS helper not found; refusing broad edit')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Compile
        run: python -m py_compile mcp_gateway/subscriber_app_v4.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mcp_gateway/subscriber_app_v4.py
          git commit -m "v209.5 render real probability edge; missing values as N/V" || exit 0
          git push origin HEAD:soccer-edge-mcp-v1
