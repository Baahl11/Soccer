# v166 strict Postgres CLV reconciliation
name: Phase 18 OOS Backtest Validation - v160 Frozen OOS Evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/phase18-oos-backtest-validation.yml"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 18 unit tests
        working-directory: runtime
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          PYTHONPATH=. pytest -q tests/test_phase18_oos_backtest_v4.py

      - name: Build current OOS/backtest framework report
        working-directory: runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m mcp_gateway.oos_backtest_v4 \
            --settlement-ledger ../state/soccer_edge_state/analysis/bet_settlement_ledger.jsonl \
            --clv-report ../state/soccer_edge_state/analysis/clv_v4_postgres_report.json \
            --clv-tracking ../state/soccer_edge_state/analysis/clv_v4_postgres_tracking.jsonl \
            --oos-calibration-report ../state/soccer_edge_state/analysis/oos_calibration_v4_report.json \
            --output ../state/soccer_edge_state/analysis/phase18_oos_backtest_report.json

      - name: Validate safety gates
        run: |
          set -euo pipefail
          jq -e '.phase == "FASE_18_OOS_BACKTEST"' state/soccer_edge_state/analysis/phase18_oos_backtest_report.json >/dev/null
          jq -e '.production_promotion_allowed == false' state/soccer_edge_state/analysis/phase18_oos_backtest_report.json >/dev/null
          jq -e '.clv_context.source == "STRICT_POSTGRES_CLV_V4_TRACKING"' state/soccer_edge_state/analysis/phase18_oos_backtest_report.json >/dev/null
          jq -e '.clv_context.rows == 61' state/soccer_edge_state/analysis/phase18_oos_backtest_report.json >/dev/null
          jq -e '.clv_context.family_counts["1X2"] == 47' state/soccer_edge_state/analysis/phase18_oos_backtest_report.json >/dev/null
          jq -e '.clv_context.family_counts.BTTS == 14' state/soccer_edge_state/analysis/phase18_oos_backtest_report.json >/dev/null
          jq -e '.clv_context.ft_totals_maturation_funnel.true_clv_rows == 0' state/soccer_edge_state/analysis/phase18_oos_backtest_report.json >/dev/null

      - name: Persist report to state branch
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/phase18_oos_backtest_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Phase 18 OOS backtest report"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
