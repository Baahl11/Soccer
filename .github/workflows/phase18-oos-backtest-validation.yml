# v174 canonical CLV auto-refresh + dynamic consistency gates
name: Phase 18 OOS Backtest Validation - v160 Frozen OOS Evidence

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Phase 17 Postgres CLV Validation - Canonical Refresh"]
    types: [completed]
  push:
    branches: [main]
    paths: [".github/workflows/phase18-oos-backtest-validation.yml"]

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 18 unit tests
        working-directory: runtime
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          PYTHONPATH=. pytest -q tests/test_phase18_oos_backtest_v4.py

      - name: Build current OOS/backtest framework report
        working-directory: runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m mcp_gateway.oos_backtest_v4 \
            --settlement-ledger ../state/soccer_edge_state/analysis/bet_settlement_ledger.jsonl \
            --clv-report ../state/soccer_edge_state/analysis/clv_v4_postgres_report.json \
            --clv-tracking ../state/soccer_edge_state/analysis/clv_v4_postgres_tracking.jsonl \
            --oos-calibration-report ../state/soccer_edge_state/analysis/oos_calibration_v4_report.json \
            --output ../state/soccer_edge_state/analysis/phase18_oos_backtest_report.json

      - name: Validate safety and canonical CLV consistency gates
        shell: bash
        run: |
          set -euo pipefail
          REPORT=state/soccer_edge_state/analysis/phase18_oos_backtest_report.json
          CANON=state/soccer_edge_state/analysis/clv_v4_postgres_report.json
          TRACKING=state/soccer_edge_state/analysis/clv_v4_postgres_tracking.jsonl

          jq -e '.phase == "FASE_18_OOS_BACKTEST"' "$REPORT" >/dev/null
          jq -e '.production_promotion_allowed == false' "$REPORT" >/dev/null
          jq -e '.clv_context.source == "STRICT_POSTGRES_CLV_V4_TRACKING"' "$REPORT" >/dev/null
          jq -e '.canonical_bet_logic_changed == false' "$REPORT" >/dev/null
          jq -e '.model_weights_changed == false' "$REPORT" >/dev/null

          # Never freeze Phase18 to historical row counts. The report must instead
          # match the current canonical Phase17 CLV artifact exactly. This lets a
          # legitimate new FT Totals/BTTS/1X2 close flow through without lowering
          # any promotion or sample-size gate.
          jq -n -e \
            --slurpfile report "$REPORT" \
            --slurpfile canon "$CANON" '
              ($report[0].clv_context.rows == ($canon[0].comparable_true_clv_rows // 0))
              and ($report[0].clv_context.true_closing_line_rows == ($canon[0].comparable_true_clv_rows // 0))
              and ($report[0].clv_context.family_counts == ($canon[0].family_counts // {}))
              and (($report[0].clv_context.ft_totals_maturation_funnel.true_clv_rows // 0)
                   == ($canon[0].ft_totals_maturation_funnel.true_clv_rows // 0))
            ' >/dev/null

          TRACKING_ROWS=$(grep -cve '^[[:space:]]*$' "$TRACKING" || true)
          REPORT_ROWS=$(jq -r '.clv_context.rows // -1' "$REPORT")
          CANON_ROWS=$(jq -r '.comparable_true_clv_rows // -1' "$CANON")
          test "$REPORT_ROWS" -eq "$TRACKING_ROWS"
          test "$CANON_ROWS" -eq "$TRACKING_ROWS"

          # Existing framework safeguards remain intact.
          jq -e '.manual_review_required == true' "$REPORT" >/dev/null
          jq -e '.oos_model_evidence.anti_leakage_ok == true' "$REPORT" >/dev/null
          jq -e '.provider_requests_added == 0' "$REPORT" >/dev/null

      - name: Persist report to state branch
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/phase18_oos_backtest_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Phase 18 OOS backtest report"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
