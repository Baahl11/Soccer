name: v169 1X2 Selection Readiness Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v169-1x2-selection-readiness-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile Phase19 module
        run: python -m py_compile runtime/mcp_gateway/promotion_framework_v4.py

      - name: Run Phase19 tests
        working-directory: runtime
        run: python -m pytest -q tests/test_phase19_promotion_framework_v4.py
