# v238 live validate oldest derivative exact-instrument anchors
# v236 serialize DB-heavy runtime workflows to prevent Render 502 contention
# v234.1 derivative validation reserve 25% post-deploy refresh
# v234 continuous completion refresh 2026-10-05
# v233 post-v232.1 canonical refresh 2026-10-05
# v230 recent-first bounded canonical CLV refresh 2026-10-04
# v226.18 recover-and-preserve canonical strict CLV history
# v226.11 routed reconciliation live rerun
# v226.8 runtime live rerun
# v226 Team Totals capture-to-signal reconciliation 2026-10-04
# v225 post-active-FT-Totals canonical CLV refresh 2026-10-04
# v223.1 chronology-proven primary CLV refresh 2026-10-04
# v220.3 persist canonical 1X2 blocker audit 2026-10-04
# v220.2 canonical 1X2 temporal blocker audit 2026-10-04
# v219.4 post-v215-ledger-repair maturation refresh 2026-10-04
# v217.2 1X2 stall diagnostic refresh 2026-10-02
# v216.7 force canonical Phase17 refresh after Team Totals later-real quotes
# v216.6 restore canonical CLV evidence cap to 2000 after bounded diagnostics
# v216.1 reduce canonical CLV evidence cap 5000 -> 3000 after concurrent DB timeout
# v216 canonical 5000-signal CLV refresh trigger after temporary workflow cleanup
# v216 expand canonical CLV evidence cap 2000 -> 5000 after v215 ledger catch-up
# v215.4 post-ledger-catchup canonical CLV refresh
# post-v168 primary CLV maturation refresh
# v167 Team Totals maturation horizon audit
# v164 FT Totals CLV funnel refresh
# canonical rerun after Render explicit deploy v4.32.3 / CLV v1.1.9
# v135 integrated Team Totals CLV funnel + provider chronology
# v132 rebuild strict Team Totals true-CLV after provider-update hardening
# Team Totals strict FT CLV refresh after v123: 2026-09-24 21:09 CDMX
# v123 strict FT Team Totals CLV refresh: 2026-09-24 21:09 CDMX
# Team Totals post-v123 CLV refresh: 2026-09-24 20:37 CDMX
# 2026-09-30 recovery: allow the bounded CLV retries to complete after Postgres recovery
# 2026-09-30 runner isolation: execute stdlib-only CLV merge directly, avoiding package commercial imports
name: Phase 17 Postgres CLV Validation - Canonical Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6,18 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/phase17-clv-postgres-validation.yml"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: soccer-edge-db-heavy-runtime
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          fetch-depth: 1
          sparse-checkout: |
            soccer_edge_state/analysis/true_clv_tracking.jsonl
            soccer_edge_state/analysis/clv_v4_postgres_report.json
            soccer_edge_state/analysis/clv_v4_postgres_tracking.jsonl
            soccer_edge_state/analysis/v220_1x2_clv_temporal_audit.json
            soccer_edge_state/analysis/v226_team_totals_capture_signal_reconciliation.json
          sparse-checkout-cone-mode: false

      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - name: Warm Render
        run: |
          curl -sS --max-time 180 --retry 2 --retry-delay 5 --retry-all-errors \
            https://soccer-edge-api.onrender.com/health >/tmp/health.json || true
          cat /tmp/health.json || true

      - name: Build Postgres-native CLV report
        shell: bash
        run: |
          # v239: keep the explicit retry loop alive when curl itself times out.
          set -uo pipefail

          get_oidc_token() {
            local response token
            response=$(curl -fsS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
            token=$(echo "$response" | jq -r '.value // empty')
            test -n "$token"
            printf '%s' "$token"
          }

          EXPECTED_MODEL="SOCCER_TRUE_CLV_POSTGRES_V4_1.1.11"
          READY=0
          for attempt in 1 2 3 4 5; do
            TOKEN=$(get_oidc_token)
            echo "::add-mask::$TOKEN"
            HTTP_CODE=$(curl -sS --max-time 430 -o /tmp/clv_v4.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"lookback_days":60,"max_signals":2000}' \
              https://soccer-edge-api.onrender.com/internal/clv-v4/build)

            MODEL_VERSION=$(jq -r '.model_version // empty' /tmp/clv_v4.json 2>/dev/null || true)
            if [ "$HTTP_CODE" = "200" ] && [ "$MODEL_VERSION" = "$EXPECTED_MODEL" ]; then
              READY=1
              break
            fi

            echo "::notice::CLV runtime not fresh yet (attempt $attempt/5, http=$HTTP_CODE, model=$MODEL_VERSION)"
            if [ "$attempt" -lt 5 ]; then
              sleep 20
            fi
          done

          cat /tmp/clv_v4.json | jq '{
            model_version,
            status,
            signal_rows_considered,
            pipeline_market_rows_loaded,
            derivative_event_rows_loaded,
            derivative_market_rows_loaded_raw,
            derivative_period_team_total_rows_excluded,
            derivative_market_rows_loaded,
            derivative_source_counts_raw,
            derivative_family_counts_raw,
            derivative_source_counts,
            derivative_family_counts,
            legacy_signal_rows_loaded,
            tracked_rows,
            comparable_true_clv_rows,
            family_counts,
            signal_source_counts,
            team_totals_maturation_funnel,
            ft_totals_maturation_funnel,
            skip_reason_family_counts,
            skip_reasons,
            error,
            detail
          }'
          test "$READY" = "1"
          jq -e '
            .schema_version == "1.0.0"
            and .model_version == "SOCCER_TRUE_CLV_POSTGRES_V4_1.1.11"
            and (.rows | type == "array")
            and (.pipeline_market_rows_loaded | type == "number")
            and (.signal_source_counts | type == "object")
            and (.derivative_source_counts_raw | type == "object")
            and (.derivative_family_counts_raw | type == "object")
            and (.derivative_source_counts | type == "object")
            and (.derivative_family_counts | type == "object")
            and (.ft_totals_maturation_funnel | type == "object")
            and (.skip_reason_family_counts | type == "object")
            and (.provider_requests_added == 0)
          ' /tmp/clv_v4.json >/dev/null

      - name: Persist v220 1X2 blocker classification
        shell: bash
        run: |
          set -euo pipefail
          jq '{
            schema_version:"1.2.0",
            model_version:"SOCCER_1X2_CLV_TEMPORAL_AUDIT_V220_1.2.0",
            generated_at_utc:.generated_at_utc,
            source_model_version:.model_version,
            family_true_clv_count:(.family_counts["1X2"] // 0),
            skip_reason_counts:{
              INVALID_ENTRY_PRICE:(.skip_reason_family_counts.INVALID_ENTRY_PRICE["1X2"] // 0),
              NO_LATER_PREKICKOFF_MARKET_SNAPSHOT:(.skip_reason_family_counts.NO_LATER_PREKICKOFF_MARKET_SNAPSHOT["1X2"] // 0),
              NO_LATER_PROVIDER_UPDATE:(.skip_reason_family_counts.NO_LATER_PROVIDER_UPDATE["1X2"] // 0)
            },
            provider_requests_added:0,
            strict_close_semantics_changed:false,
            models_changed:false,
            thresholds_changed:false,
            gates_changed:false,
            provider_budget_changed:false
          }' /tmp/clv_v4.json > /tmp/v220.json
          jq . /tmp/v220.json
          mkdir -p soccer_edge_state/analysis
          cp /tmp/v220.json soccer_edge_state/analysis/v220_1x2_clv_temporal_audit.json

      - name: Build v226 Team Totals capture-to-signal reconciliation
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          TOKEN=$(echo "$response" | jq -r '.value // empty')
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          curl -fsS --max-time 430 -X POST \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
            -d '{"lookback_days":60}' \
            https://soccer-edge-api.onrender.com/internal/team-totals-capture-signal-reconciliation-v4/build \
            -o /tmp/v226_team_totals_reconciliation.json
          jq . /tmp/v226_team_totals_reconciliation.json
          jq -e '.model_version=="SOCCER_TEAM_TOTALS_CAPTURE_SIGNAL_RECON_V226_1.0.0" and .provider_requests_added==0' /tmp/v226_team_totals_reconciliation.json >/dev/null

      - name: Merge strict historical true CLV
        shell: bash
        run: |
          set -euo pipefail
          # Run the stdlib-only merge script directly. Using `python -m mcp_gateway...`
          # executes mcp_gateway/__init__.py first, which installs commercial layers and
          # pulls optional runtime dependencies (currently httpx) that Phase17 does not need.
          python runtime/mcp_gateway/clv_history_merge_v4.py \
            --postgres-report /tmp/clv_v4.json \
            --history-true-clv soccer_edge_state/analysis/true_clv_tracking.jsonl \
            --previous-canonical soccer_edge_state/analysis/clv_v4_postgres_tracking.jsonl \
            --output /tmp/clv_v4_merged.json
          mv /tmp/clv_v4_merged.json /tmp/clv_v4.json

          jq '{
            canonical_merge_version,
            tracked_rows,
            comparable_true_clv_rows,
            historical_backfill_rows_added,
            historical_backfill_unique_fixtures,
            unique_fixtures_by_family,
            family_counts,
            signal_source_counts,
            provider_requests_added
          }' /tmp/clv_v4.json
          jq -e '
            .schema_version == "1.0.0"
            and .canonical_merge_version == "SOCCER_TRUE_CLV_HISTORY_MERGE_V4_1.2.0"
            and (.rows | type == "array")
            and (.provider_requests_added == 0)
          ' /tmp/clv_v4.json >/dev/null

      - name: Persist CLV report and tracking rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p soccer_edge_state/analysis
          cp /tmp/v226_team_totals_reconciliation.json soccer_edge_state/analysis/v226_team_totals_capture_signal_reconciliation.json

          jq 'del(.rows)' /tmp/clv_v4.json > soccer_edge_state/analysis/clv_v4_postgres_report.json
          jq -c '.rows[]' /tmp/clv_v4.json > soccer_edge_state/analysis/clv_v4_postgres_tracking.jsonl

          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/clv_v4_postgres_report.json
          git add -f soccer_edge_state/analysis/clv_v4_postgres_tracking.jsonl
          git add -f soccer_edge_state/analysis/v220_1x2_clv_temporal_audit.json
          git add -f soccer_edge_state/analysis/v226_team_totals_capture_signal_reconciliation.json

          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Postgres-native CLV v4 report"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
