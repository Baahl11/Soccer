# Team Totals strict FT CLV refresh after v123: 2026-09-24 21:09 CDMX
# v123 strict FT Team Totals CLV refresh: 2026-09-24 21:09 CDMX
# Team Totals post-v123 CLV refresh: 2026-09-24 20:37 CDMX
name: Phase 17 Postgres CLV Validation - Canonical Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6,18 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/phase17-clv-postgres-validation.yml"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: phase17-clv-postgres-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          fetch-depth: 1
          sparse-checkout: |
            soccer_edge_state/analysis/true_clv_tracking.jsonl
            soccer_edge_state/analysis/clv_v4_postgres_report.json
            soccer_edge_state/analysis/clv_v4_postgres_tracking.jsonl
          sparse-checkout-cone-mode: false

      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - name: Warm Render
        run: |
          curl -sS --max-time 180 --retry 2 --retry-delay 5 --retry-all-errors \
            https://soccer-edge-api.onrender.com/health >/tmp/health.json || true
          cat /tmp/health.json || true

      - name: Build Postgres-native CLV report
        shell: bash
        run: |
          set -euo pipefail

          get_oidc_token() {
            local response token
            response=$(curl -fsS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
            token=$(echo "$response" | jq -r '.value // empty')
            test -n "$token"
            printf '%s' "$token"
          }

          # This contract check intentionally fails if Render is serving a stale runtime.
          # Diagnostics include per-market rejection counts from the live collector.
          # Derivative CLV smoke includes persisted research market rows.
          EXPECTED_MODEL="SOCCER_TRUE_CLV_POSTGRES_V4_1.1.8"
          READY=0
          for attempt in 1 2 3 4 5; do
            TOKEN=$(get_oidc_token)
            echo "::add-mask::$TOKEN"
            HTTP_CODE=$(curl -sS --max-time 120 -o /tmp/clv_v4.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"lookback_days":60,"max_signals":2000}' \
              https://soccer-edge-api.onrender.com/internal/clv-v4/build)

            MODEL_VERSION=$(jq -r '.model_version // empty' /tmp/clv_v4.json 2>/dev/null || true)
            if [ "$HTTP_CODE" = "200" ] && [ "$MODEL_VERSION" = "$EXPECTED_MODEL" ]; then
              READY=1
              break
            fi

            echo "::notice::CLV runtime not fresh yet (attempt $attempt/5, http=$HTTP_CODE, model=$MODEL_VERSION)"
            if [ "$attempt" -lt 5 ]; then
              sleep 20
            fi
          done

          cat /tmp/clv_v4.json | jq '{
            model_version,
            status,
            signal_rows_considered,
            pipeline_market_rows_loaded,
            derivative_event_rows_loaded,
            derivative_market_rows_loaded_raw,
            derivative_period_team_total_rows_excluded,
            derivative_market_rows_loaded,
            derivative_source_counts_raw,
            derivative_family_counts_raw,
            derivative_source_counts,
            derivative_family_counts,
            legacy_signal_rows_loaded,
            tracked_rows,
            comparable_true_clv_rows,
            family_counts,
            signal_source_counts,
            skip_reasons,
            error,
            detail
          }'
          test "$READY" = "1"
          jq -e '
            .schema_version == "1.0.0"
            and .model_version == "SOCCER_TRUE_CLV_POSTGRES_V4_1.1.8"
            and (.rows | type == "array")
            and (.pipeline_market_rows_loaded | type == "number")
            and (.signal_source_counts | type == "object")
            and (.derivative_source_counts_raw | type == "object")
            and (.derivative_family_counts_raw | type == "object")
            and (.derivative_source_counts | type == "object")
            and (.derivative_family_counts | type == "object")
            and (.provider_requests_added == 0)
          ' /tmp/clv_v4.json >/dev/null

      - name: Merge strict historical true CLV
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=runtime python -m mcp_gateway.clv_history_merge_v4 \
            --postgres-report /tmp/clv_v4.json \
            --history-true-clv soccer_edge_state/analysis/true_clv_tracking.jsonl \
            --output /tmp/clv_v4_merged.json
          mv /tmp/clv_v4_merged.json /tmp/clv_v4.json

          jq '{
            canonical_merge_version,
            tracked_rows,
            comparable_true_clv_rows,
            historical_backfill_rows_added,
            historical_backfill_unique_fixtures,
            unique_fixtures_by_family,
            family_counts,
            signal_source_counts,
            provider_requests_added
          }' /tmp/clv_v4.json
          jq -e '
            .schema_version == "1.0.0"
            and .canonical_merge_version == "SOCCER_TRUE_CLV_HISTORY_MERGE_V4_1.0.0"
            and (.rows | type == "array")
            and (.provider_requests_added == 0)
          ' /tmp/clv_v4.json >/dev/null

      - name: Persist CLV report and tracking rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p soccer_edge_state/analysis

          jq 'del(.rows)' /tmp/clv_v4.json > soccer_edge_state/analysis/clv_v4_postgres_report.json
          jq -c '.rows[]' /tmp/clv_v4.json > soccer_edge_state/analysis/clv_v4_postgres_tracking.jsonl

          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/clv_v4_postgres_report.json
          git add -f soccer_edge_state/analysis/clv_v4_postgres_tracking.jsonl

          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Postgres-native CLV v4 report"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
