name: FE11 Universal OIDC Schedule - Static QA
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/fe11-universal-slate.yml"
      - ".github/workflows/fe11-universal-schedule-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check exact secure OIDC endpoint, bounded schedule and fail-closed gates
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path(".github/workflows/fe11-universal-slate.yml").read_text()
          assert "id-token: write" in s
          assert "cancel-in-progress: false" in s
          assert s.count('cron: "') == 6
          assert s.count("fe11-universal-slate-v1") == 1
          assert "db_heavy_busy" in s
          assert ".database_persisted == true" in s
          assert ".bet_eligible == false" in s
          assert ".probabilities_calibrated == false" in s
          assert ".provider_requests_added | type == \"number\" and . >= 1 and . <= 12" in s
          assert "status == \"VERIFIED_ALL_ELIGIBLE_LIFECYCLE\"" in s
          assert "main" in s
          assert "gh issue create --title" in s
          print("FE11 OIDC schedule static contract PASS")
          PY
