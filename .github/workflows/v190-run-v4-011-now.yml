name: v190 Trigger V4-011 Now

on:
  push:
    branches: [main]
    paths: [".github/workflows/v190-run-v4-011-now.yml"]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official V4-011 workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v4-011-lightgbm-validation.yml --repo Baahl11/Soccer --ref main
