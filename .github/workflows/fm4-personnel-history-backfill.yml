# FM4 guarded prior-personnel accumulation
name: FM4 Personnel History Backfill

on:
  workflow_dispatch:
  schedule:
    # Stagger from tactical backfill to avoid DB-heavy/provider contention.
    - cron: "15,45 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fm4-personnel-history-backfill.yml"

permissions:
  contents: write
  id-token: write

concurrency:
  group: fm4-personnel-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 0

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: engine
          fetch-depth: 1

      - name: Install gateway research dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest -r engine/mcp_gateway/requirements.txt

      - name: Run FM4 personnel backfill regression guards
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q -c /dev/null --rootdir=. -p no:cacheprovider \
            tests/test_formation_personnel_history_backfill_v1.py \
            tests/test_formation_personnel_outcome_ablation_v1.py \
            tests/test_formation_matchup_fm4_style_ablation_v1.py

      - name: Build target cohort payload
        shell: bash
        run: |
          set -euo pipefail
          REPORT=state/soccer_edge_state/analysis/formation_matchup_engine_v1.json
          test -s "$REPORT"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.load(open(
              "state/soccer_edge_state/analysis/formation_matchup_engine_v1.json",
              encoding="utf-8",
          ))
          rows = [row for row in report.get("rows") or [] if isinstance(row, dict)]
          team_ids = sorted({
              int(value)
              for row in rows
              for value in (row.get("home_team_id"), row.get("away_team_id"))
              if value is not None
          })
          kickoffs = sorted(
              str(row.get("kickoff_local"))
              for row in rows
              if row.get("kickoff_local")
          )
          if not team_ids or not kickoffs:
              raise SystemExit(
                  "formation cohort is missing team IDs or kickoff timestamps"
              )

          payload = {
              "team_ids": team_ids,
              "before": kickoffs[0],
              "lookback_days": 365,
              "max_fixtures": 8,
          }
          Path("/tmp/fm4_personnel_backfill_request.json").write_text(
              json.dumps(payload, separators=(",", ":")),
              encoding="utf-8",
          )
          print(json.dumps({
              "target_team_count": len(team_ids),
              "before": kickoffs[0],
              "max_fixtures": 8,
          }, indent=2))
          PY

      - name: Wait for Render health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 \
              https://soccer-edge-api.onrender.com/health \
              > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Run guarded FM4 personnel history backfill
        id: backfill_call
        shell: bash
        run: |
          set -euo pipefail

          get_oidc_token() {
            local response token
            response=$(curl -fsS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
            token=$(echo "$response" | jq -r '.value // empty')
            test -n "$token"
            printf '%s' "$token"
          }

          TOKEN=$(get_oidc_token)
          echo "::add-mask::$TOKEN"

          HTTP_CODE=""
          RUNTIME_AVAILABLE=true

          for attempt in 1 2 3 4 5 6; do
            HTTP_CODE=$(curl -sS --max-time 180 \
              -o /tmp/fm4_personnel_backfill.json \
              -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/fm4_personnel_backfill_request.json \
              https://soccer-edge-api.onrender.com/internal/fm4-personnel-history-backfill-v1/run \
              || true)

            if [ "$HTTP_CODE" = "200" ]; then
              break
            fi

            echo "FM4 personnel backfill attempt $attempt returned HTTP $HTTP_CODE"
            cat /tmp/fm4_personnel_backfill.json || true

            # A deterministic 404 means the deployed Render runtime predates
            # the protected route. Retrying cannot repair deployment drift.
            if [ "$HTTP_CODE" = "404" ]; then
              RUNTIME_AVAILABLE=false
              break
            fi

            if [ "$attempt" -lt 6 ]; then
              sleep 20
              TOKEN=$(get_oidc_token)
              echo "::add-mask::$TOKEN"
            fi
          done

          if [ "$RUNTIME_AVAILABLE" = "false" ]; then
            DEPLOYED_COMMIT=$(jq -r '.render_git_commit // "UNKNOWN"' /tmp/health.json)
            ENGINE_COMMIT=$(git -C engine rev-parse HEAD)
            BEFORE=$(jq -r '.before' /tmp/fm4_personnel_backfill_request.json)
            TARGET_TEAM_COUNT=$(jq -r '.team_ids | length' /tmp/fm4_personnel_backfill_request.json)

            jq -n \
              --arg deployed_commit "$DEPLOYED_COMMIT" \
              --arg engine_commit "$ENGINE_COMMIT" \
              --arg before "$BEFORE" \
              --argjson target_team_count "$TARGET_TEAM_COUNT" \
              '{
                schema_version:"1.0.0",
                model_version:"FM4_PERSONNEL_DEPLOYMENT_BLOCK_V1.0.0",
                status:"BLOCKED_STALE_RENDER_RUNTIME",
                reason:"PROTECTED_PERSONNEL_BACKFILL_ROUTE_NOT_DEPLOYED",
                expected_route:"/internal/fm4-personnel-history-backfill-v1/run",
                deployed_render_git_commit:$deployed_commit,
                engine_branch_git_commit:$engine_commit,
                before:$before,
                target_team_count:$target_team_count,
                attempted:0,
                captured:0,
                incomplete:0,
                errors:0,
                provider_requests_added:0,
                prior_history_use_only:true,
                retroactive_current_fixture_allowed:false,
                retroactive_prediction_rewrite:false,
                retroactive_market_created:false,
                retroactive_bet_created:false,
                decision_weight:0,
                production_promotion_allowed:false,
                materialized_personnel_history_fixture_count:0
              }' > /tmp/fm4_personnel_deployment_block.json

            cat /tmp/fm4_personnel_deployment_block.json
            echo "runtime_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test "$HTTP_CODE" = "200"

          jq '{
            status,
            model_version,
            before,
            target_team_count,
            candidate_pool_rows,
            selected_fixture_count,
            attempted,
            captured,
            incomplete,
            errors,
            provider_requests_added,
            daily_remaining_after_run,
            details
          }' /tmp/fm4_personnel_backfill.json

          jq -e '
            .model_version == "SOCCER_FM4_PERSONNEL_HISTORY_BACKFILL_V1.0.0"
            and .provider_requests_added <= 8
            and .max_provider_requests_per_run == 8
            and .prior_history_use_only == true
            and .retroactive_current_fixture_allowed == false
            and .retroactive_prediction_rewrite == false
            and .retroactive_market_created == false
            and .retroactive_bet_created == false
            and .decision_weight == 0
            and .production_promotion_allowed == false
            and (.events | type == "array")
          ' /tmp/fm4_personnel_backfill.json >/dev/null

          echo "runtime_available=true" >> "$GITHUB_OUTPUT"

      - name: Persist Render deployment blocker
        if: steps.backfill_call.outputs.runtime_available == 'false'
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p soccer_edge_state/analysis
          cp /tmp/fm4_personnel_deployment_block.json \
            soccer_edge_state/analysis/fm4_personnel_history_backfill_report.json

          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/fm4_personnel_history_backfill_report.json

          if git diff --cached --quiet; then
            echo "Deployment blocker state unchanged"
            exit 0
          fi

          git commit -m "Record FM4 personnel Render deployment blocker"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin soccer-edge-state
            if git rebase --autostash origin/soccer-edge-state \
              && git push origin HEAD:soccer-edge-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Merge FM4 personnel history
        if: steps.backfill_call.outputs.runtime_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state/soccer_edge_state/history state/soccer_edge_state/analysis
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          incoming = json.load(open(
              "/tmp/fm4_personnel_backfill.json",
              encoding="utf-8",
          ))
          history_path = Path(
              "state/soccer_edge_state/history/fm4_personnel_backfill.jsonl"
          )

          merged = {}
          if history_path.exists():
              for line in history_path.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  try:
                      tick = json.loads(line)
                  except Exception:
                      continue
                  for event in tick.get("events") or []:
                      if not isinstance(event, dict):
                          continue
                      fixture_id = (event.get("fixture") or {}).get("fixture_id")
                      if fixture_id is not None:
                          merged[int(fixture_id)] = event

          for event in incoming.get("events") or []:
              if not isinstance(event, dict):
                  continue
              fixture_id = (event.get("fixture") or {}).get("fixture_id")
              if fixture_id is not None:
                  merged[int(fixture_id)] = event

          now = datetime.now(timezone.utc).isoformat()
          tick = {
              "schema_version": "1.0.0",
              "generated_at_utc": now,
              "generated_at_local": now,
              "source": "FM4_PERSONNEL_HISTORY_BACKFILL",
              "events": sorted(
                  merged.values(),
                  key=lambda event: (
                      str((event.get("fixture") or {}).get("kickoff") or ""),
                      int((event.get("fixture") or {}).get("fixture_id") or 0),
                  ),
              ),
          }
          history_path.write_text(
              json.dumps(tick, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          report_path = Path(
              "state/soccer_edge_state/analysis/"
              "fm4_personnel_history_backfill_report.json"
          )
          report_path.write_text(
              json.dumps(
                  {
                      **{k: v for k, v in incoming.items() if k != "events"},
                      "materialized_personnel_history_fixture_count": len(merged),
                  },
                  ensure_ascii=False,
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )

          print(json.dumps({
              "materialized_personnel_history_fixture_count": len(merged),
              "newly_captured": len(incoming.get("events") or []),
          }, indent=2))
          PY

      - name: Rebuild FM4 style/personnel ablation
        if: steps.backfill_call.outputs.runtime_available == 'true'
        env:
          PYTHONPATH: engine
        shell: bash
        run: |
          set -euo pipefail
          python engine/mcp_gateway/formation_matchup_fm4_style_ablation_v1.py \
            --formation-report \
              state/soccer_edge_state/analysis/formation_matchup_engine_v1.json \
            --history-dir state/soccer_edge_state/history \
            --output \
              state/soccer_edge_state/analysis/formation_matchup_fm4_style_ablation_v1.json

          jq -e '
            .health.production_enabled == false
            and .health.decision_weight == 0
            and .health.odds_consumed == false
            and .health.market_prices_consumed == false
            and .health.personnel_outcome_ablation_used == true
          ' state/soccer_edge_state/analysis/formation_matchup_fm4_style_ablation_v1.json >/dev/null

      - name: Persist FM4 personnel research state
        if: steps.backfill_call.outputs.runtime_available == 'true'
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f \
            soccer_edge_state/history/fm4_personnel_backfill.jsonl \
            soccer_edge_state/analysis/fm4_personnel_history_backfill_report.json \
            soccer_edge_state/analysis/formation_matchup_fm4_style_ablation_v1.json

          if git diff --cached --quiet; then
            echo "No FM4 personnel research changes"
            exit 0
          fi

          git commit -m "Update FM4 personnel history backfill research"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin soccer-edge-state
            if git rebase --autostash origin/soccer-edge-state \
              && git push origin HEAD:soccer-edge-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Refresh formation lifecycle health after personnel attempt
        if: success() && steps.backfill_call.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          FM4=state/soccer_edge_state/analysis/formation_matchup_fm4_style_ablation_v1.json
          FM5=state/soccer_edge_state/analysis/formation_fm5_readiness_gate_v1.json
          PROSPECTIVE=state/soccer_edge_state/analysis/prospective_evaluation_summary_v1.json
          PERSONNEL=state/soccer_edge_state/analysis/fm4_personnel_history_backfill_report.json
          OUT=state/soccer_edge_state/analysis/formation_lifecycle_health_v1.json

          test -s "$FM4"
          test -s "$FM5"
          test -s "$PROSPECTIVE"
          test -s "$PERSONNEL"

          PYTHONPATH=engine python engine/mcp_gateway/formation_lifecycle_health_v1.py \
            --fm4-report "$FM4" \
            --fm5-readiness "$FM5" \
            --prospective "$PROSPECTIVE" \
            --personnel-backfill "$PERSONNEL" \
            --output "$OUT"

          jq -e '
            .software_contracts_complete == true
            and .phases.FM4.personnel_backfill_status != null
            and .provider_requests_added == 0
            and .production_promotion_allowed == false
          ' "$OUT" >/dev/null

      - name: Persist refreshed formation lifecycle health
        if: success() && steps.backfill_call.outcome == 'success'
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/formation_lifecycle_health_v1.json

          if git diff --cached --quiet; then
            echo "No lifecycle health changes after personnel attempt"
            exit 0
          fi

          git commit -m "Refresh formation lifecycle health after personnel attempt"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin soccer-edge-state
            if git rebase --autostash origin/soccer-edge-state \
              && git push origin HEAD:soccer-edge-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 3))
          done
          exit 1
