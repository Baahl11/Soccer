name: v225 Content Factory

on:
  workflow_dispatch:
  push:
    branches:
      - v225-content-factory
    paths:
      - mcp_gateway/content_factory_v4.py
      - mcp_gateway/content_factory_http_v4.py
      - mcp_gateway/__init__.py
      - content_factory/remotion/**
      - tests/test_v225_content_factory.py
      - .github/workflows/v225-content-factory.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx psycopg[binary] "mcp<2" pyjwt cryptography
      - name: Compile V225 Python layers
        run: |
          python -m py_compile mcp_gateway/content_factory_v4.py
          python -m py_compile mcp_gateway/content_factory_http_v4.py
          python -m py_compile mcp_gateway/__init__.py
      - name: Run V225 plus commercial regressions
        run: |
          PYTHONPATH=. pytest -q tests/test_v225_content_factory.py tests/test_v224_funnel_analytics.py tests/test_v223_landing_conversion.py tests/test_v222_es_en_i18n.py tests/test_v221_commercial_surface_hardening.py tests/test_v220_subscriber_app_billing.py tests/test_v219_subscription_entitlements.py tests/test_v218_auth_accounts_readiness.py tests/test_v217_match_detail_premium.py tests/test_v216_performance_track_record.py tests/test_v215_commercial_product_shell.py tests/test_phase24_product_dashboard_v4.py tests/test_phase24_product_views_v4.py
      - name: Validate Remotion renderer bundle
        working-directory: content_factory/remotion
        run: |
          npm install --no-audit --no-fund
          npm run check
