# trigger v216.4 directed Team Totals close audit
name: v216.4 Team Totals Directed Close Audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v2164-team-totals-directed-close-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 0

      - name: Checkout control script
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          sparse-checkout: |
            .github/scripts/v2164_patch_team_totals_directed_close_audit.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply patch
        run: python control/.github/scripts/v2164_patch_team_totals_directed_close_audit.py runtime

      - name: Validate
        working-directory: runtime
        run: |
          python -m py_compile mcp_gateway/clv_postgres_v4.py
          grep -q 'team_totals_directed_close_audit' mcp_gateway/clv_postgres_v4.py
          grep -q 'STRICT_EXACT_CLOSE_EXISTS' mcp_gateway/clv_postgres_v4.py

      - name: Commit runtime diagnostic
        working-directory: runtime
        run: |
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add mcp_gateway/clv_postgres_v4.py
          git diff --cached --quiet && exit 0
          git commit -m 'v216.4 add directed Team Totals close audit'
          git fetch origin soccer-edge-mcp-v1
          git rebase origin/soccer-edge-mcp-v1
          git push origin HEAD:soccer-edge-mcp-v1
