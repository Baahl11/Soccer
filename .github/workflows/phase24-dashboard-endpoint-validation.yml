name: Phase 24 Dashboard Endpoint Validation - Control Tower v1
# v215.2 evidence freshness live validation
# v158 live endpoint validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/phase24-dashboard-endpoint-validation.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run dashboard renderer tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r mcp_gateway/requirements.txt
          PYTHONPATH=. pytest -q tests/test_phase24_product_dashboard_v4.py tests/test_phase24_product_views_v4.py

      - name: Validate product views endpoint
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --max-time 60 -o /tmp/views.json -w "%{http_code}" "https://soccer-edge-api.onrender.com/product/views?limit=5" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep $((attempt * 5))
          done
          test "$code" = "200"
          jq -e '
            .status == "CONTROL_TOWER_V1_CONTRACT"
            and (.views | type == "object")
            and (.views.control_tower | type == "object")
            and (.views.control_tower.pipeline | type == "object")
            and (.row_limit_per_view == 5)
          ' /tmp/views.json >/dev/null

          jq '{
            control_tower_status: .views.control_tower.status,
            maturity_snapshot_status: .views.control_tower.maturity_snapshot.status,
            evidence_age: .views.control_tower.maturity_snapshot.maturation_control_tower.monitoring.evidence_age,
            report_freshness: .views.control_tower.maturity_snapshot.maturation_control_tower.monitoring.report_freshness,
            family_statuses: [.views.control_tower.maturity_snapshot.maturation_control_tower.families[]? | {key,status,current,target,unique_fixtures,blocker}]
          }' /tmp/views.json

          jq -e '
            .views.control_tower.maturity_snapshot.maturation_control_tower.monitoring.evidence_age.status == "OK"
            and (.views.control_tower.maturity_snapshot.maturation_control_tower.monitoring.evidence_age.evidence.age_hours < 48)
          ' /tmp/views.json >/dev/null

      - name: Validate dashboard endpoint
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 60 -o /tmp/dashboard.html -w "%{http_code}" "https://soccer-edge-api.onrender.com/dashboard?limit=5")
          test "$code" = "200"
          grep -q "Control Tower" /tmp/dashboard.html
          grep -q "System Health" /tmp/dashboard.html
          grep -q "Model Maturity" /tmp/dashboard.html
          grep -q "Today&#x27;s Slate" /tmp/dashboard.html
          grep -q "Research-first dashboard" /tmp/dashboard.html
