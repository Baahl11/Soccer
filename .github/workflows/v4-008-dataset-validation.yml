# 2026-09-26 lineage reconciliation audit rerun
name: V4-008 Dataset Materialization Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/v4-008-dataset-validation.yml"]

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Warm Render
        run: |
          curl -sS --max-time 360 --retry 2 --retry-delay 5 --retry-all-errors \
            https://soccer-edge-api.onrender.com/health >/tmp/health.json || true
          cat /tmp/health.json || true

      - name: Build reproducible V4 dataset
        shell: bash
        run: |
          set -euo pipefail

          response=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          token=$(echo "$response" | jq -r '.value // empty')
          test -n "$token"
          echo "::add-mask::$token"

          cutoff=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          http_code=$(curl -sS --max-time 430 -o /tmp/v4_008_dataset.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg cutoff "$cutoff" '{cutoff:$cutoff,backfill_limit:5000}')" \
            https://soccer-edge-api.onrender.com/internal/training-dataset/build)

          cat /tmp/v4_008_dataset.json | jq '{
            status,
            build_id,
            persisted_row_count,
            manifest:{
              dataset_version:.manifest.dataset_version,
              feature_schema_version:.manifest.feature_schema_version,
              row_count:.manifest.row_count,
              feature_count:.manifest.feature_count,
              cutoff:.manifest.cutoff,
              dataset_fingerprint:.manifest.dataset_fingerprint,
              market_fields_included:.manifest.market_fields_included,
              post_kickoff_features_allowed:.manifest.post_kickoff_features_allowed,
              critical_missingness_imputed:.manifest.critical_missingness_imputed
            },
            backfill
          }'

          test "$http_code" = "200"
          jq -e '.status == "OK"' /tmp/v4_008_dataset.json >/dev/null
          jq -e '.manifest.market_fields_included == false' /tmp/v4_008_dataset.json >/dev/null
          jq -e '.manifest.post_kickoff_features_allowed == false' /tmp/v4_008_dataset.json >/dev/null
          jq -e '.manifest.critical_missingness_imputed == false' /tmp/v4_008_dataset.json >/dev/null
          jq -e '(.manifest.dataset_fingerprint // "") | length == 64' /tmp/v4_008_dataset.json >/dev/null