# FE11 next-day canonical identity-only discovery: no provider credentials in QA.
name: Soccer FE11 Next-Day Registry Coverage - Offline QA
on:
  pull_request:
    branches: [soccer-edge-mcp-v1]
    paths:
      - 'mcp_gateway/fe11_registry_next_day_v1.py'
      - 'mcp_gateway/automation_v7.py'
      - 'tests/test_fe11_registry_next_day_v1.py'
      - '.github/workflows/fe11-next-day-registry-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal offline test runner
        run: python -m pip install -r mcp_gateway/requirements.txt pytest
      - name: Compile patched canonical registry path
        run: |
          python -m compileall -q \
            mcp_gateway/fe11_registry_next_day_v1.py \
            mcp_gateway/automation_v7.py \
            mcp_gateway/persistence.py \
            tests/test_fe11_registry_next_day_v1.py
      - name: Run official registry, v7 rollover and FE11 bridge regression tests
        run: |
          python -m pytest -q \
            tests/test_fe11_registry_next_day_v1.py \
            tests/test_automation_v7_rollover_import.py \
            tests/test_multimarket_history_bridge_v1.py
