name: Temporary v201 Player Props Capture Audit

on:
  push:
    branches:
      - tmp-v201-player-props-capture-audit

permissions:
  contents: write

jobs:
  v201-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-v201-player-props-capture-audit
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply v201 patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v201_patch.py
          python /tmp/v201_patch.py
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_gateway/requirements.txt pytest
      - name: Compile v201 paths
        run: |
          python -m py_compile mcp_gateway/price_resolver_v4.py
          python -m py_compile mcp_gateway/player_props_clv_postgres_v4.py
      - name: Run v201 specific tests
        run: |
          PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider \
            tests/test_price_resolver_v4.py -k 'v201 or player_props_maturation'
          PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider \
            tests/test_player_props_capture_audit_v201.py
      - name: Run focused regressions
        run: |
          PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider \
            tests/test_research_derivative_postgres_audit.py \
            tests/test_player_props_phase15_v4.py \
            tests/test_phase15_player_props_v4.py \
            tests/test_clv_postgres_v4.py \
            tests/test_price_resolver_v4.py
      - name: Commit validated candidate
        shell: bash
        run: |
          git config user.name "soccer-edge-v201-bot"
          git config user.email "soccer-edge-v201-bot@users.noreply.github.com"
          git add mcp_gateway/price_resolver_v4.py mcp_gateway/player_props_clv_postgres_v4.py tests/test_price_resolver_v4.py tests/test_player_props_capture_audit_v201.py
          git commit -m "v201: make Player Props maturation family-aware and audit capture"
          git push origin HEAD:tmp-v201-player-props-capture-audit
