name: V4-019 Team Totals OOS Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/v4-019-team-totals-oos-validation.yml"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run V4-019 unit tests
        working-directory: runtime
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          PYTHONPATH=. pytest -q tests/test_v4_019_team_totals_oos.py

      - name: Build current Team Totals OOS report
        working-directory: runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m mcp_gateway.team_totals_oos_v4             --validation ../state/soccer_edge_state/analysis/team_totals_validation.json             --true-clv-tracking ../state/soccer_edge_state/analysis/clv_v4_postgres_tracking.jsonl             --output ../state/soccer_edge_state/analysis/v4_019_team_totals_oos_validation.json

      - name: Validate safety gates
        run: |
          set -euo pipefail
          jq -e '.ticket == "V4-019"' state/soccer_edge_state/analysis/v4_019_team_totals_oos_validation.json >/dev/null
          jq -e '.production_promotion_allowed == false' state/soccer_edge_state/analysis/v4_019_team_totals_oos_validation.json >/dev/null

      - name: Persist validation report to state branch
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/v4_019_team_totals_oos_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update V4-019 Team Totals OOS validation report"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
