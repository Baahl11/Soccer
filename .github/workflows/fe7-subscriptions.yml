name: FE7 Subscriptions

on:
  push:
    branches:
      - fe7-subscriptions
    paths:
      - mcp_gateway/subscriber_billing_v2.py
      - mcp_gateway/subscription_entitlements_v4.py
      - mcp_gateway/subscriber_contract_v2.py
      - mcp_gateway/subscriber_frontend_v2.py
      - tests/test_fe7_subscriptions.py
      - .github/workflows/fe7-subscriptions.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_gateway/requirements.txt pytest
      - name: Compile subscription surface
        run: |
          python -W error::SyntaxWarning -m py_compile             mcp_gateway/subscriber_billing_v2.py             mcp_gateway/subscription_entitlements_v4.py             mcp_gateway/subscriber_contract_v2.py             mcp_gateway/subscriber_frontend_v2.py
      - name: Validate rendered JavaScript syntax
        run: |
          PYTHONPATH=. python - <<'PY'
          import re
          from pathlib import Path
          from mcp_gateway import subscriber_frontend_v2
          html = subscriber_frontend_v2.render()
          match = re.search(r'<script id="soccer-edge-v2-app">(.*?)</script>', html, re.S)
          assert match, "V2 app script not found"
          Path("/tmp/app-v2.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/app-v2.js
      - name: Run FE7 and customer truth regressions
        run: |
          PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider             tests/test_fe7_subscriptions.py             tests/test_v219_subscription_entitlements.py             tests/test_v226_regional_billing_live.py             tests/test_fe6_my_edge.py             tests/test_fe5_performance_trust.py             tests/test_fe4_match_intelligence.py             tests/test_fe3_picks_leans_clarity.py             tests/test_subscriber_contract_v2.py             tests/test_subscriber_frontend_v2.py             tests/test_fe0_frontend_stabilization.py
