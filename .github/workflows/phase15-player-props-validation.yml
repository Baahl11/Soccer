# refresh after cards-props taxonomy v144
name: Phase 15 Player Props Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/phase15-player-props-validation.yml"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 15 unit tests
        working-directory: runtime
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          PYTHONPATH=. pytest -q tests/test_phase15_player_props_v4.py

      - name: Build Phase 15 validation report
        working-directory: runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m mcp_gateway.player_props_phase15_v4             --shots ../state/soccer_edge_state/analysis/player_shots_model_sanity.json             --sot ../state/soccer_edge_state/analysis/player_sot_model_sanity.json             --goalscorer ../state/soccer_edge_state/analysis/player_goalscorer_model_sanity.json             --assists ../state/soccer_edge_state/analysis/player_assists_model_sanity.json             --cards ../state/soccer_edge_state/analysis/player_cards_model_sanity.json             --gk-saves ../state/soccer_edge_state/analysis/gk_saves_model_sanity.json             --true-clv-tracking ../state/soccer_edge_state/analysis/clv_v4_postgres_tracking.jsonl             --market-audit ../state/soccer_edge_state/analysis/research_derivative_market_audit.json             --output ../state/soccer_edge_state/analysis/phase15_player_props_validation.json

      - name: Validate safety gates
        run: |
          set -euo pipefail
          jq -e '.phase == "FASE_15_PLAYER_PROPS"' state/soccer_edge_state/analysis/phase15_player_props_validation.json >/dev/null
          jq -e '.production_promotion_allowed == false' state/soccer_edge_state/analysis/phase15_player_props_validation.json >/dev/null

      - name: Persist report to state branch
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/phase15_player_props_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Phase 15 Player Props validation report"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
