name: Soccer Isolated Sport First Prematch - Official Prospective Pilot
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/soccer_isolated_pregame_sport_first.py"
      - ".github/workflows/soccer-isolated-pregame-sport-first.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/soccer_isolated_pregame_sport_first.py"
      - ".github/workflows/soccer-isolated-pregame-sport-first.yml"
  workflow_dispatch:
  # Strict max 38 provider requests / capture; 18 real fixtures; sport-only no markets.
  schedule:
    # Eight staggered sport-only discovery windows: up to 144 distinct
    # fixture attempts/day before de-duplication, at most 38 provider calls
    # each (304/day maximum) and the original hard 1000-call reserve.
    # Both dates are scanned; source-missing fixtures have 8h cooldown.
    - cron: "50 08 * * *"  # 02:50 Mexico City
    - cron: "50 11 * * *"  # 05:50 Mexico City
    - cron: "50 13 * * *"  # 07:50 Mexico City
    - cron: "50 15 * * *"  # 09:50 Mexico City
    - cron: "50 17 * * *"  # 11:50 Mexico City
    - cron: "50 19 * * *"  # 13:50 Mexico City
    - cron: "50 22 * * *"  # 16:50 Mexico City
    - cron: "50 01 * * *"  # 19:50 Mexico City previous date

permissions:
  contents: write

concurrency:
  group: soccer-isolated-sport-first-pregame-pilot
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: controls
      - uses: actions/checkout@v4
        with:
          repository: Baahl11/Soccer
          ref: soccer-edge-mcp-v1
          path: runtime
          sparse-checkout: |
            mcp_gateway/soccer_model.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical model and offline fake-provider invariants
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git -C runtime rev-parse HEAD)
          python controls/.github/scripts/soccer_isolated_pregame_sport_first.py \
            --self-test \
            --model-file runtime/mcp_gateway/soccer_model.py \
            --runtime-model-sha "$sha"
          python - <<'PY'
          from pathlib import Path
          s=Path("controls/.github/scripts/soccer_isolated_pregame_sport_first.py").read_text()
          w=Path("controls/.github/workflows/soccer-isolated-pregame-sport-first.yml").read_text()
          assert 'MAX_PROVIDER_REQUESTS = 38' in s
          assert 'MAX_FIXTURES = 18' in s
          assert 'MIN_VERIFIED_SPLIT_SAMPLE = 5' in s
          assert 'NEGATIVE_COOLDOWN = timedelta(hours=8)' in s
          assert 'NEGATIVE_REASONS = frozenset' in s
          assert '_write_negative_cache' in s
          assert '--negative-cache' in s
          assert 'MIN_DAILY_REMAINING = 1000' in s
          assert 'ALLOWED_ENDPOINTS = frozenset({"fixtures", "teams/statistics"})' in s
          assert 'FROZEN_RESEARCH_PREMATCH_SPORT_PROJECTION' in s
          assert '"production_promotion_allowed": False' in s
          assert '"bet_eligible": False' in s
          assert '"provider_odds_requests_added": 0' in s
          assert "soccer-edge-state" in w
          assert sum(line.strip().startswith("- cron:") for line in w.splitlines()) == 8
          assert "304/day maximum" in w
          assert "1000-call reserve" in w
          print("ISOLATED_PROSPECTIVE_SPORT_ONLY_STATIC_CONTRACT_PASS")
          PY

  capture:
    if: github.event_name != 'pull_request'
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: controls
      - uses: actions/checkout@v4
        with:
          repository: Baahl11/Soccer
          ref: soccer-edge-mcp-v1
          path: runtime
          sparse-checkout: |
            mcp_gateway/soccer_model.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1
          sparse-checkout: |
            soccer_edge_state/analysis/isolated_sport_first_pregame_v1.jsonl
            soccer_edge_state/analysis/isolated_sport_first_pregame_receipt_v1.json
            soccer_edge_state/analysis/isolated_sport_first_negative_cache_v1.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture only genuine prospective sport projections
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}" || { echo "::error::API_FOOTBALL_KEY_NOT_CONFIGURED"; exit 1; }
          model_sha=$(git -C runtime rev-parse HEAD)
          mkdir -p state/soccer_edge_state/analysis
          touch state/soccer_edge_state/analysis/isolated_sport_first_pregame_v1.jsonl
          python controls/.github/scripts/soccer_isolated_pregame_sport_first.py \
            --model-file runtime/mcp_gateway/soccer_model.py \
            --runtime-model-sha "$model_sha" \
            --registry state/soccer_edge_state/analysis/isolated_sport_first_pregame_v1.jsonl \
            --receipt state/soccer_edge_state/analysis/isolated_sport_first_pregame_receipt_v1.json \
            --negative-cache state/soccer_edge_state/analysis/isolated_sport_first_negative_cache_v1.json
          jq -e '
            (.status == "CAPTURED_RESEARCH_ONLY" or .status == "NO_NEW_VALID_PREGAME_MODELS")
            and .production_promotion_allowed == false
            and .retroactive_pregame_signals_created == false
            and .provider_odds_requests_added == 0
            and .postgres_write_queries == 0
            and (.provider_requests_added <= 38)
            and (.new_frozen_pregame_models <= 18)
            and (.negative_cache_deferred_fixtures >= 0)
            and (.negative_cache_policy == "SOURCE_MISSING_OR_SAMPLE_SMALL_8H_RETRY_NO_MODEL")
            and (.daily_remaining_reported >= 1000)
          ' state/soccer_edge_state/analysis/isolated_sport_first_pregame_receipt_v1.json >/dev/null
      - name: Save genuine pregame observations without rewriting historical predictions
        shell: bash
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/isolated_sport_first_pregame_v1.jsonl \
                     soccer_edge_state/analysis/isolated_sport_first_pregame_receipt_v1.json \
                     soccer_edge_state/analysis/isolated_sport_first_negative_cache_v1.json
          if git diff --cached --quiet; then
            echo "NO_STATE_FILE_DELTA"
            exit 0
          fi
          git commit -m "Store authentic frozen pregame SPORT FIRST observations (research-only)"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            if git rebase origin/soccer-edge-state && git push origin HEAD:soccer-edge-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((2 * attempt))
          done
          exit 1
