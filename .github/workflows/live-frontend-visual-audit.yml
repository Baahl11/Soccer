# Post recovery validation: 2026-11-06, memory-safe canonical tick persisted.
# FE2 live audit rerun after rendered-JS repair
name: Live Frontend Visual Audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/live-frontend-visual-audit.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-frontend-visual-audit-v2
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://soccer-edge-api.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify live HTTP contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/frontend-audit
          curl -fsS --retry 4 --retry-delay 4 --max-time 45 "$BASE_URL/health" > /tmp/frontend-audit/health.json
          curl -fsS --retry 4 --retry-delay 4 --max-time 45 "$BASE_URL/app/api/v2/today" > /tmp/frontend-audit/today.json
          curl -sS --retry 4 --retry-delay 4 --max-time 45 -o /tmp/frontend-audit/picks.json -w "%{http_code}" "$BASE_URL/app/api/v2/picks" > /tmp/frontend-audit/picks.status
          curl -sS --retry 4 --retry-delay 4 --max-time 45 -o /tmp/frontend-audit/leans.json -w "%{http_code}" "$BASE_URL/app/api/v2/leans" > /tmp/frontend-audit/leans.status
          curl -fsS --retry 4 --retry-delay 4 --max-time 45 "$BASE_URL/app/api/v2/watches" > /tmp/frontend-audit/watches.json
          curl -fsS --retry 4 --retry-delay 4 --max-time 45 "$BASE_URL/app-v2" > /tmp/frontend-audit/app-v2.html

          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/frontend-audit/health.json").read_text())
          today = json.loads(Path("/tmp/frontend-audit/today.json").read_text())
          from datetime import datetime, timezone
          picks = json.loads(Path("/tmp/frontend-audit/picks.json").read_text())
          leans = json.loads(Path("/tmp/frontend-audit/leans.json").read_text())
          watches = json.loads(Path("/tmp/frontend-audit/watches.json").read_text())
          pick_status = Path("/tmp/frontend-audit/picks.status").read_text().strip()
          lean_status = Path("/tmp/frontend-audit/leans.status").read_text().strip()
          assert pick_status in ("200","403"), pick_status
          assert lean_status in ("200","403"), lean_status
          if pick_status == "403":
              assert picks.get("error") in ("PRO_REQUIRED","AUTH_REQUIRED"), picks
          if lean_status == "403":
              assert leans.get("error") in ("PRO_REQUIRED","AUTH_REQUIRED"), leans

          generated = today.get("generated_at_utc")
          try:
              snapshot_age_hours = round(
                  (datetime.now(timezone.utc) -
                   datetime.fromisoformat(str(generated).replace("Z", "+00:00"))).total_seconds()/3600, 2)
          except (TypeError, ValueError):
              snapshot_age_hours = None
          freshness = "FRESH" if snapshot_age_hours is not None and 0 <= snapshot_age_hours <= 24 else "STALE_OR_NOT_VERIFIED"
          Path("/tmp/frontend-audit/freshness.json").write_text(
              json.dumps({"snapshot_age_hours": snapshot_age_hours, "freshness": freshness,
                          "generated_at_utc": generated}, indent=2), encoding="utf-8")

          html = Path("/tmp/frontend-audit/app-v2.html").read_text()

          assert health.get("status") == "ok", health
          assert today.get("schema_version") == "2.0.0", today
          assert today.get("status") == "SUBSCRIBER_CONTRACT_V2_READY", today
          assert '<script id="soccer-edge-v2-app">' in html
          assert "Arsenal vs Brighton" not in html
          assert "Control Tower" not in html
          assert "Research Lab" not in html
          assert html.count('id="boot"') == 1
          assert 'id="sgpQuotedComposites"' in html
          assert '<details id="sgpMarketCatalogDetails"' in html
          assert '<summary>Ver catálogo de cuotas combinadas (NO son picks)</summary>' in html
          assert 'id="sgpMarketCatalog"' in html
          assert 'Máximo UNA señal por encuentro' in html
          assert "function sgpCatalogCard(" in html
          assert '<details id="sgpMarketCatalogDetails" open' not in html

          assert "MutationObserver" not in html
          assert "setTimeout(" not in html
          print(json.dumps({
              "render_git_commit": health.get("render_git_commit"),
              "snapshot_age_hours": snapshot_age_hours,
              "snapshot_freshness": freshness,
              "picks_http_status": pick_status,
              "leans_http_status": lean_status,
              "picks_schema": picks.get("schema_version"),
              "leans_schema": leans.get("schema_version"),
              "watches_schema": watches.get("schema_version"),
              "today_status": today.get("status"),
              "counts": today.get("counts"),
              "effective_plan": (today.get("access") or {}).get("effective_plan"),
              "html_bytes": len(html.encode()),
          }, indent=2))
          PY

      - name: Install Playwright client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q playwright
          BROWSER_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER_PATH"
          echo "BROWSER_PATH=$BROWSER_PATH" >> "$GITHUB_ENV"
          "$BROWSER_PATH" --version

      - name: Validate rendered JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("/tmp/frontend-audit/app-v2.html").read_text()
          match = re.search(r'<script id="soccer-edge-v2-app">(.*?)</script>', html, re.S)
          assert match, "V2 app script not found"
          Path("/tmp/frontend-audit/app-v2.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/frontend-audit/app-v2.js

      - name: Capture desktop and mobile visual audits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          base = os.environ["BASE_URL"]
          out = Path("/tmp/frontend-audit")
          report = {}
          failures = []

          def audit(page, name, width, height):
              console_errors = []
              page_errors = []
              failed_requests = []
              http_errors = []
              page.on("console", lambda msg: console_errors.append(msg.text) if msg.type == "error" else None)
              page.on("pageerror", lambda exc: page_errors.append(str(exc)))
              page.on("requestfailed", lambda req: failed_requests.append({"url": req.url, "failure": str(req.failure)}))
              page.on("response", lambda res: http_errors.append({"url": res.url, "status": res.status}) if res.status >= 400 else None)
              page.set_viewport_size({"width": width, "height": height})
              response = page.goto(base + "/app-v2", wait_until="networkidle", timeout=60000)
              assert response and response.ok, f"{name} page status={response.status if response else None}"
              page.wait_for_timeout(6000)

              active = page.locator(".page.active").count()
              boot_visible = page.locator("#boot").is_visible()
              boot_copy = page.locator("#bootCopy").inner_text() if page.locator("#bootCopy").count() else None
              body_text = page.locator("body").inner_text()
              overflow = page.evaluate("() => document.documentElement.scrollWidth - document.documentElement.clientWidth")
              mock_found = any(
                  term in body_text
                  for term in ("Arsenal vs Brighton", "Man City vs Nottm Forest", "Mockup Preview")
              )
              nav_prefix = ".mobile-nav " if width <= 1050 else ".side "
              primary = [
                  page.locator(nav_prefix + '[data-page="today"]').is_visible(),
                  page.locator(nav_prefix + '[data-page="picks"]').is_visible(),
                  page.locator(nav_prefix + '[data-page="leans"]').is_visible(),
                  page.locator(nav_prefix + '[data-page="matches"]').is_visible(),
              ]

              screenshot = out / f"{name}.png"
              page.screenshot(path=str(screenshot), full_page=True)
              row = {
                  "viewport": [width, height],
                  "active_pages": active,
                  "boot_visible": boot_visible,
                  "boot_copy": boot_copy,
                  "horizontal_overflow_px": overflow,
                  "mock_content_visible": mock_found,
                  "primary_navigation_visible": primary,
                  "console_errors": console_errors,
                  "page_errors": page_errors,
                  "failed_requests": failed_requests,
                  "http_errors": http_errors,
                  "body_text_excerpt": body_text[:2500],
              }
              report[name] = row

              if active != 1:
                  failures.append(f"{name}: active pages={active}")
              if boot_visible:
                  failures.append(f"{name}: boot still visible: {boot_copy}")
              if mock_found:
                  failures.append(f"{name}: mock content visible")
              if not all(primary):
                  failures.append(f"{name}: primary navigation missing")
              if overflow > 2:
                  failures.append(f"{name}: horizontal overflow {overflow}px")
              if page_errors:
                  failures.append(f"{name}: page errors={page_errors}")
              if console_errors:
                  failures.append(f"{name}: console errors={console_errors}")
              if http_errors:
                  failures.append(f"{name}: HTTP errors={http_errors}")

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  executable_path=os.environ["BROWSER_PATH"],
                  args=["--no-sandbox", "--disable-dev-shm-usage"],
              )
              audit(browser.new_page(), "desktop-1440", 1440, 1100)
              audit(browser.new_page(), "mobile-390", 390, 844)
              browser.close()

          (out / "visual-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          (out / "visual-failures.json").write_text(
              json.dumps(failures, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if failures:
              print("VISUAL_AUDIT_FAILURES")
              for failure in failures:
                  print(" -", failure)
          PY

      - name: Publish visual audit snapshots
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/frontend-audit-repo
          mkdir -p /tmp/frontend-audit-repo
          cd /tmp/frontend-audit-repo
          git init
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          cp /tmp/frontend-audit/desktop-1440.png .
          cp /tmp/frontend-audit/mobile-390.png .
          cp /tmp/frontend-audit/visual-report.json .
          cp /tmp/frontend-audit/visual-failures.json .
          cp /tmp/frontend-audit/health.json .
          cp /tmp/frontend-audit/today.json .
          cp /tmp/frontend-audit/freshness.json .
          cp /tmp/frontend-audit/picks.json .
          cp /tmp/frontend-audit/leans.json .
          cp /tmp/frontend-audit/watches.json .
          git add .
          git commit -m "Update live frontend visual audit"
          git branch -M frontend-audit-artifacts
          git push --force origin frontend-audit-artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce visual audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          failures = json.loads(Path("/tmp/frontend-audit/visual-failures.json").read_text())
          if failures:
              raise SystemExit("Visual audit failed: " + " | ".join(failures))
          print("VISUAL_AUDIT_PASS")
          PY
