name: Soccer Edge History Analysis

on:
  schedule:
    - cron: "0 8 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/soccer-edge-history-analysis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 0

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: engine
          fetch-depth: 1

      - name: Build historical signal ledger
        shell: bash
        run: |
          set -euo pipefail
          python engine/mcp_gateway/build_signal_ledger.py \
            --history-dir state/soccer_edge_state/history \
            --output state/soccer_edge_state/analysis/signal_ledger.jsonl \
            --summary-output state/soccer_edge_state/analysis/signal_ledger_summary.json

      - name: Analyze complete history
        shell: bash
        run: |
          set -euo pipefail
          python engine/mcp_gateway/analyze_history.py \
            --history-dir state/soccer_edge_state/history \
            --output state/soccer_edge_state/analysis/latest.json
          python engine/mcp_gateway/summarize_analysis.py \
            --input state/soccer_edge_state/analysis/latest.json \
            --output state/soccer_edge_state/analysis/compact.json
          python - <<'PY'
          import json
          for p in (
              'state/soccer_edge_state/analysis/signal_ledger_summary.json',
              'state/soccer_edge_state/analysis/compact.json',
          ):
              print(f'--- {p} ---')
              d=json.load(open(p, encoding='utf-8'))
              print(json.dumps(d, indent=2))
          PY

      - name: Persist analysis
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "soccer-edge-bot"
          git config user.email "soccer-edge-bot@users.noreply.github.com"
          git add -f \
            soccer_edge_state/analysis/latest.json \
            soccer_edge_state/analysis/compact.json \
            soccer_edge_state/analysis/signal_ledger.jsonl \
            soccer_edge_state/analysis/signal_ledger_summary.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Soccer Edge historical analysis and signal ledger"
          git push origin HEAD:soccer-edge-state
