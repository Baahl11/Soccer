name: Soccer Edge History Analysis

on:
  schedule:
    - cron: "0 8 * * *"
  push:
    branches:
      - main
      - soccer-edge-mcp-v1
    paths:
      - ".github/workflows/soccer-edge-history-analysis.yml"
      - "mcp_gateway/build_signal_ledger.py"
      - "mcp_gateway/evaluate_postgame.py"
      - "mcp_gateway/analyze_clv.py"
      - "mcp_gateway/analyze_1x2_calibration.py"
      - "mcp_gateway/analyze_1x2_dixon_coles.py"
      - "mcp_gateway/analyze_1x2_prior_calibration.py"
      - "mcp_gateway/analyze_1x2_relative_strength.py"
      - "mcp_gateway/analyze_ft_totals.py"
      - "mcp_gateway/analyze_learning_pipeline.py"
      - "mcp_gateway/analyze_api_efficiency_versions.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 0

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: engine
          fetch-depth: 1

      - name: Build historical signal ledger
        shell: bash
        run: |
          set -euo pipefail
          python engine/mcp_gateway/build_signal_ledger.py \
            --history-dir state/soccer_edge_state/history \
            --output state/soccer_edge_state/analysis/signal_ledger.jsonl \
            --summary-output state/soccer_edge_state/analysis/signal_ledger_summary.json

      - name: Evaluate postgame outcomes
        shell: bash
        run: |
          set -euo pipefail
          python engine/mcp_gateway/evaluate_postgame.py \
            --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl \
            --output state/soccer_edge_state/analysis/postgame_evaluation.jsonl \
            --summary-output state/soccer_edge_state/analysis/postgame_summary.json

      - name: Track closing line value
        shell: bash
        run: |
          set -euo pipefail
          python engine/mcp_gateway/analyze_clv.py \
            --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl \
            --output state/soccer_edge_state/analysis/clv_tracking.jsonl \
            --summary-output state/soccer_edge_state/analysis/clv_summary.json

      - name: Analyze 1X2 calibration
        shell: bash
        run: |
          set -euo pipefail
          python engine/mcp_gateway/analyze_1x2_calibration.py \
            --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl \
            --output state/soccer_edge_state/analysis/one_x_two_calibration.json

      - name: Evaluate Dixon-Coles 1X2 challenger
        shell: bash
        run: |
          set -euo pipefail
          python engine/mcp_gateway/analyze_1x2_dixon_coles.py \
            --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl \
            --output state/soccer_edge_state/analysis/one_x_two_dixon_coles.json

      - name: Evaluate 1X2 prior calibration challenger
        shell: bash
        run: |
          set -euo pipefail
          python engine/mcp_gateway/analyze_1x2_prior_calibration.py \
            --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl \
            --output state/soccer_edge_state/analysis/one_x_two_prior_calibration.json

      - name: Evaluate relative-strength 1X2 challenger
        shell: bash
        run: |
          set -euo pipefail
          # v1.1 joins pre-kickoff projections to final results by fixture_id.
          python engine/mcp_gateway/analyze_1x2_relative_strength.py \
            --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl \
            --output state/soccer_edge_state/analysis/one_x_two_relative_strength.json

      - name: Validate FT totals
        shell: bash
        run: |
          set -euo pipefail
          python engine/mcp_gateway/analyze_ft_totals.py \
            --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl \
            --output state/soccer_edge_state/analysis/ft_totals_validation.json

      - name: Build learning pipeline reports
        shell: bash
        run: |
          set -euo pipefail
          python engine/mcp_gateway/analyze_learning_pipeline.py \
            --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl \
            --history-dir state/soccer_edge_state/history \
            --analysis-dir state/soccer_edge_state/analysis

      - name: Analyze urgent-window efficiency by version
        shell: bash
        run: |
          set -euo pipefail
          python engine/mcp_gateway/analyze_api_efficiency_versions.py \
            --history-dir state/soccer_edge_state/history \
            --output state/soccer_edge_state/analysis/api_efficiency_versions.json

      - name: Analyze complete history
        shell: bash
        run: |
          set -euo pipefail
          python engine/mcp_gateway/analyze_history.py \
            --history-dir state/soccer_edge_state/history \
            --output state/soccer_edge_state/analysis/latest.json
          python engine/mcp_gateway/summarize_analysis.py \
            --input state/soccer_edge_state/analysis/latest.json \
            --output state/soccer_edge_state/analysis/compact.json
          python - <<'PY'
          import json
          for p in (
              'state/soccer_edge_state/analysis/signal_ledger_summary.json',
              'state/soccer_edge_state/analysis/postgame_summary.json',
              'state/soccer_edge_state/analysis/clv_summary.json',
              'state/soccer_edge_state/analysis/one_x_two_calibration.json',
              'state/soccer_edge_state/analysis/one_x_two_dixon_coles.json',
              'state/soccer_edge_state/analysis/one_x_two_prior_calibration.json',
              'state/soccer_edge_state/analysis/one_x_two_relative_strength.json',
              'state/soccer_edge_state/analysis/ft_totals_validation.json',
              'state/soccer_edge_state/analysis/decision_decomposition_summary.json',
              'state/soccer_edge_state/analysis/discrepancy_recheck.json',
              'state/soccer_edge_state/analysis/lineup_impact.json',
              'state/soccer_edge_state/analysis/api_efficiency.json',
              'state/soccer_edge_state/analysis/api_efficiency_versions.json',
              'state/soccer_edge_state/analysis/derivative_model_registry.json',
              'state/soccer_edge_state/analysis/learning_dashboard.json',
              'state/soccer_edge_state/analysis/compact.json',
          ):
              print(f'--- {p} ---')
              d=json.load(open(p, encoding='utf-8'))
              print(json.dumps(d, indent=2))
          PY

      - name: Persist analysis
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "soccer-edge-bot"
          git config user.email "soccer-edge-bot@users.noreply.github.com"
          git add -f soccer_edge_state/analysis/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Soccer Edge learning pipeline analysis"
          git push origin HEAD:soccer-edge-state
