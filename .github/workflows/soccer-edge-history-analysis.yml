name: Soccer Edge History Analysis
on:
  schedule:
    - cron: "0 8 * * *"
  push:
    branches: [main, soccer-edge-mcp-v1]
    paths: [".github/workflows/soccer-edge-history-analysis.yml", "mcp_gateway/*.py"]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout state
        uses: actions/checkout@v4
        with: {ref: soccer-edge-state, path: state, fetch-depth: 0}
      - name: Checkout engine
        uses: actions/checkout@v4
        with: {ref: soccer-edge-mcp-v1, path: engine, fetch-depth: 1}
      - name: Build historical signal ledger
        run: python engine/mcp_gateway/build_signal_ledger.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/signal_ledger.jsonl --summary-output state/soccer_edge_state/analysis/signal_ledger_summary.json
      - name: Build league strength baseline registry
        run: python engine/mcp_gateway/build_league_strength_baselines.py --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl --output state/soccer_edge_state/analysis/league_strength_baselines.json --min-matches 20
      - name: Evaluate postgame outcomes
        run: python engine/mcp_gateway/evaluate_postgame.py --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl --output state/soccer_edge_state/analysis/postgame_evaluation.jsonl --summary-output state/soccer_edge_state/analysis/postgame_summary.json
      - name: Track closing line value proxy
        run: python engine/mcp_gateway/analyze_clv.py --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl --output state/soccer_edge_state/analysis/clv_tracking.jsonl --summary-output state/soccer_edge_state/analysis/clv_summary.json
      - name: Analyze dedicated true CLV
        run: python engine/mcp_gateway/analyze_true_clv.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/true_clv_tracking.jsonl --summary-output state/soccer_edge_state/analysis/true_clv_summary.json
      - name: Analyze 1X2 calibration
        run: python engine/mcp_gateway/analyze_1x2_calibration.py --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl --output state/soccer_edge_state/analysis/one_x_two_calibration.json
      - name: Evaluate Dixon-Coles 1X2 challenger
        run: python engine/mcp_gateway/analyze_1x2_dixon_coles.py --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl --output state/soccer_edge_state/analysis/one_x_two_dixon_coles.json
      - name: Evaluate 1X2 prior calibration challenger
        run: python engine/mcp_gateway/analyze_1x2_prior_calibration.py --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl --output state/soccer_edge_state/analysis/one_x_two_prior_calibration.json
      - name: Evaluate relative-strength 1X2 challenger
        run: python engine/mcp_gateway/analyze_1x2_relative_strength.py --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl --output state/soccer_edge_state/analysis/one_x_two_relative_strength.json
      - name: Consolidate 1X2 model selection
        run: python engine/mcp_gateway/analyze_1x2_model_selection.py --analysis-dir state/soccer_edge_state/analysis --output state/soccer_edge_state/analysis/one_x_two_model_selection.json
      - name: Validate FT totals
        run: python engine/mcp_gateway/analyze_ft_totals.py --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl --output state/soccer_edge_state/analysis/ft_totals_validation.json
      - name: Validate FT goals relative-strength shadow
        run: python engine/mcp_gateway/analyze_ft_goals_shadow.py --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl --output state/soccer_edge_state/analysis/ft_goals_shadow_validation.json
      - name: Validate Team Totals research model
        run: python engine/mcp_gateway/analyze_team_totals.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/team_totals_validation.json
      - name: Validate Correct Score research model
        run: python engine/mcp_gateway/analyze_correct_score.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/correct_score_validation.json
      - name: Validate BTTS research model
        run: python engine/mcp_gateway/analyze_btts.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/btts_validation.json
      - name: Validate Double Chance research model
        run: python engine/mcp_gateway/analyze_double_chance.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/double_chance_validation.json
      - name: Validate Draw No Bet research model
        run: python engine/mcp_gateway/analyze_dnb.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/dnb_validation.json
      - name: Validate Asian Handicap research model
        run: python engine/mcp_gateway/analyze_asian_handicap.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/asian_handicap_validation.json
      - name: Build period rate registry
        run: python engine/mcp_gateway/build_period_rate_registry.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/period_rate_registry.json
      - name: Evaluate explicit 1H goals research model
        run: python engine/mcp_gateway/analyze_1h_goals_model.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/one_h_goals_model.json
      - name: Evaluate 1H calibration challenger
        run: python engine/mcp_gateway/analyze_1h_calibration.py --model-report state/soccer_edge_state/analysis/one_h_goals_model.json --output state/soccer_edge_state/analysis/one_h_goals_calibration.json
      - name: Evaluate explicit pregame 2H goals research model
        run: python engine/mcp_gateway/analyze_2h_goals_model.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/two_h_goals_model.json
      - name: Evaluate halftime-conditioned 2H challenger
        env: {PYTHONPATH: engine}
        run: python engine/mcp_gateway/analyze_2h_halftime_conditioned.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/two_h_halftime_conditioned.json
      - name: Build learning pipeline reports
        run: python engine/mcp_gateway/analyze_learning_pipeline.py --ledger state/soccer_edge_state/analysis/signal_ledger.jsonl --history-dir state/soccer_edge_state/history --analysis-dir state/soccer_edge_state/analysis
      - name: Analyze formation intelligence
        env: {PYTHONPATH: engine}
        run: python engine/mcp_gateway/analyze_formation_intelligence.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/formation_intelligence.json
      - name: Analyze team and match trends
        run: python engine/mcp_gateway/analyze_trend_intelligence.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/trend_intelligence.json
      - name: Analyze trend convergence and disagreement
        run: python engine/mcp_gateway/analyze_trend_convergence.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/trend_convergence.json
      - name: Build player trend history
        run: python engine/mcp_gateway/analyze_player_trends.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/player_trends.json
      - name: Evaluate explicit corners research model
        env: {PYTHONPATH: engine}
        run: python engine/mcp_gateway/analyze_corners_baseline.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/corners_baseline.json
      - name: Build live corners rate registry
        env: {PYTHONPATH: engine}
        run: python engine/mcp_gateway/build_corners_rate_registry.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/corners_rate_registry.json
      - name: Validate Team Corners research model
        run: python engine/mcp_gateway/analyze_team_corners.py --baseline-report state/soccer_edge_state/analysis/corners_baseline.json --output state/soccer_edge_state/analysis/team_corners_validation.json
      - name: Evaluate yellow-card baseline
        run: python engine/mcp_gateway/analyze_cards_baseline.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/cards_baseline.json
      - name: Build live yellow-card rate registry
        env: {PYTHONPATH: engine}
        run: python engine/mcp_gateway/build_cards_rate_registry.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/cards_rate_registry.json
      - name: Refresh derivative model registry
        run: python engine/mcp_gateway/refresh_derivative_registry.py --history-dir state/soccer_edge_state/history --analysis-dir state/soccer_edge_state/analysis --output state/soccer_edge_state/analysis/derivative_model_registry.json
      - name: Analyze urgent-window efficiency by version
        run: python engine/mcp_gateway/analyze_api_efficiency_versions.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/api_efficiency_versions.json
      - name: Analyze complete history
        run: |
          python engine/mcp_gateway/analyze_history.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/latest.json
          python engine/mcp_gateway/summarize_analysis.py --input state/soccer_edge_state/analysis/latest.json --output state/soccer_edge_state/analysis/compact.json
      - name: Persist analysis
        working-directory: state
        run: |
          git config user.name "soccer-edge-bot"
          git config user.email "soccer-edge-bot@users.noreply.github.com"
          git add -f soccer_edge_state/analysis/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Soccer Edge learning pipeline analysis"
          git push origin HEAD:soccer-edge-state
