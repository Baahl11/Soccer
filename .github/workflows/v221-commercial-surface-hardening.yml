name: v221 Commercial Surface Hardening

on:
  workflow_dispatch:
  push:
    branches:
      - v221-commercial-surface-hardening
    paths:
      - mcp_gateway/__init__.py
      - mcp_gateway/commercial_surface_guard_v4.py
      - tests/test_v221_commercial_surface_hardening.py
      - .github/workflows/v221-commercial-surface-hardening.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx psycopg[binary] "mcp<2"
      - name: Compile commercial hardening layer
        run: |
          python -m py_compile mcp_gateway/commercial_surface_guard_v4.py
          python -m py_compile mcp_gateway/__init__.py
      - name: Run V221 plus commercial regressions
        run: |
          PYTHONPATH=. pytest -q tests/test_v221_commercial_surface_hardening.py tests/test_v220_subscriber_app_billing.py tests/test_v219_subscription_entitlements.py tests/test_v218_auth_accounts_readiness.py tests/test_v217_match_detail_premium.py tests/test_v216_performance_track_record.py tests/test_v215_commercial_product_shell.py tests/test_phase24_product_dashboard_v4.py tests/test_phase24_product_views_v4.py
