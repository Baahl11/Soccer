name: v192b Corners CLV Maturation Patch

on:
  push:
    branches: [soccer-edge-mcp-v1]
    paths:
      - .github/workflows/v192b-corners-clv-maturation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          fetch-depth: 1

      - name: Apply v192 patch with corrected merge indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/v192-corners-clv-maturation.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          patch_script = dedent(workflow[start:end])
          exec(compile(patch_script, 'v192-original-patch', 'exec'), {})

          path = Path('mcp_gateway/price_resolver_v4.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '\nfor event in (corners_maturation.get("candidate_events") or []):\n'
          end_marker = '    family_counts = defaultdict(int, primary_maturation.get("candidate_family_counts") or {})\n'
          if text.count(start_marker) != 1:
              raise SystemExit(f'bad corners merge start count={text.count(start_marker)}')
          start = text.index(start_marker) + 1
          end = text.index(end_marker, start)
          block = text[start:end]
          fixed = ''.join(('    ' + line) if line.strip() else line for line in block.splitlines(True))
          text = text[:start] + fixed + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate v192
        shell: bash
        run: |
          python -m py_compile mcp_gateway/price_resolver_v4.py
          python - <<'PY'
          from pathlib import Path
          import ast
          src = Path('mcp_gateway/price_resolver_v4.py').read_text(encoding='utf-8')
          ast.parse(src)
          required = [
              'SOCCER_PRICE_RESOLVER_V4_1.19.1',
              'def _load_corners_clv_maturation_backlog(',
              'corners_maturation = await asyncio.to_thread(_load_corners_clv_maturation_backlog)',
              'POSTGRES_CORNERS_DERIVATIVE_CLV_MATURATION_BACKLOG_V1',
              'POSTGRES_PRIMARY_PLUS_DERIVATIVE_CLV_MATURATION_BACKLOG_V4',
              'PRIMARY_CLV_MATURATION_MAX_CALLS_PER_TICK = max(',
          ]
          missing = [x for x in required if x not in src]
          if missing:
              raise SystemExit(f'missing invariants: {missing}')
          if '\nfor event in (corners_maturation.get("candidate_events") or []):\n' in src:
              raise SystemExit('corners merge escaped resolve_prices scope')
          print('v192 compile + source invariants OK')
          PY
          git diff --check

      - name: Commit production patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mcp_gateway/price_resolver_v4.py
          git commit -m 'v192: add exact Corners true-CLV maturation'
          git push origin HEAD:soccer-edge-mcp-v1
