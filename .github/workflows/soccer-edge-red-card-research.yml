name: Soccer Edge Red Card Research

on:
  workflow_run:
    workflows: ["Soccer Edge History Analysis"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 0
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: engine
          fetch-depth: 1
      - name: Build red card rate registry
        env:
          PYTHONPATH: engine
        run: python engine/mcp_gateway/build_red_cards_rate_registry.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/red_cards_rate_registry.json
      - name: Validate red card model walk-forward
        env:
          PYTHONPATH: engine
        run: python engine/mcp_gateway/analyze_red_cards.py --history-dir state/soccer_edge_state/history --output state/soccer_edge_state/analysis/red_cards_validation.json
      - name: Persist red card research
        working-directory: state
        run: |
          git config user.name "soccer-edge-bot"
          git config user.email "soccer-edge-bot@users.noreply.github.com"
          git add -f soccer_edge_state/analysis/red_cards_rate_registry.json soccer_edge_state/analysis/red_cards_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Soccer Edge red card research"
          git push origin HEAD:soccer-edge-state
