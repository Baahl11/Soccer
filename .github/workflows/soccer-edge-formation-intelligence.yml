name: Soccer Edge Formation Intelligence

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - soccer-edge-mcp-v1
    paths:
      - "mcp_gateway/analyze_formation_intelligence.py"
      - "mcp_gateway/analyze_formation_intelligence_v2.py"
      - "mcp_gateway/automation_v17.py"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 0

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: engine
          fetch-depth: 1

      - name: Analyze formation intelligence
        shell: bash
        run: |
          set -euo pipefail
          python engine/mcp_gateway/analyze_formation_intelligence_v2.py \
            --history-dir state/soccer_edge_state/history \
            --output state/soccer_edge_state/analysis/formation_intelligence.json
          python - <<'PY'
          import json
          p='state/soccer_edge_state/analysis/formation_intelligence.json'
          d=json.load(open(p, encoding='utf-8'))
          print(json.dumps({
              'status': d.get('status'),
              'fixtures_with_confirmed_both_formations_and_final': d.get('fixtures_with_confirmed_both_formations_and_final'),
              'fixtures_with_postgame_corners_and_formations': d.get('fixtures_with_postgame_corners_and_formations'),
              'unique_matchups': d.get('unique_matchups'),
              'matchups_with_n_ge_8': d.get('matchups_with_n_ge_8'),
              'walk_forward_residual_test_over_2_5': d.get('walk_forward_residual_test_over_2_5'),
              'corner_feature_gate': d.get('corner_feature_gate'),
          }, indent=2))
          PY

      - name: Persist formation analysis
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "soccer-edge-bot"
          git config user.email "soccer-edge-bot@users.noreply.github.com"
          git add -f soccer_edge_state/analysis/formation_intelligence.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Soccer Edge formation intelligence"
          git push origin HEAD:soccer-edge-state
