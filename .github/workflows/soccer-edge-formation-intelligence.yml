# FM-4 materialize canonical fixture season for historical backfill
# FM-4 materialize verified XI/coach continuity
# FM-4 rerun with prior-style density diagnostics
# FM-4 rerun after explicit style-density blocker semantics
# FM-4 rerun after chronology-regression test fix
name: Soccer Edge Formation Intelligence

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - soccer-edge-mcp-v1
    paths:
      - ".github/workflows/soccer-edge-formation-intelligence.yml"
      - "mcp_gateway/analyze_formation_intelligence.py"
      - "mcp_gateway/analyze_formation_intelligence_v2.py"
      - "mcp_gateway/analyze_corners_baseline.py"
      - "mcp_gateway/formation_matchup_engine_v1.py"
      - "mcp_gateway/formation_matchup_fm3_oos_v1.py"
      - "mcp_gateway/formation_matchup_fm4_style_ablation_v1.py"
      - "mcp_gateway/formation_personnel_outcome_ablation_v1.py"
      - "mcp_gateway/formation_personnel_history_backfill_v1.py"
      - "tests/test_formation_matchup_engine_v1.py"
      - "tests/test_formation_matchup_fm3_oos_v1.py"
      - "tests/test_formation_matchup_fm4_style_ablation_v1.py"
      - "tests/test_formation_personnel_history_backfill_v1.py"
      - "tests/test_formation_personnel_outcome_ablation_v1.py"
      - "tests/test_corners_side_specific_formation.py"
      - "mcp_gateway/automation_v17.py"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 0

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: engine
          fetch-depth: 1

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check -q pytest -r engine/mcp_gateway/requirements.txt

      - name: Run formation matchup focused tests
        working-directory: engine
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q -c /dev/null --rootdir=. -p no:cacheprovider \
            tests/test_formation_matchup_engine_v1.py \
            tests/test_formation_matchup_fm3_oos_v1.py \
            tests/test_formation_matchup_fm4_style_ablation_v1.py \
            tests/test_formation_personnel_history_backfill_v1.py \
            tests/test_formation_personnel_outcome_ablation_v1.py \
            tests/test_corners_side_specific_formation.py

      - name: Analyze formation intelligence
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=engine python engine/mcp_gateway/analyze_formation_intelligence_v2.py \
            --history-dir state/soccer_edge_state/history \
            --output state/soccer_edge_state/analysis/formation_intelligence.json

      - name: Analyze formation matchup engine v1
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=engine python engine/mcp_gateway/formation_matchup_engine_v1.py \
            --history-dir state/soccer_edge_state/history \
            --output state/soccer_edge_state/analysis/formation_matchup_engine_v1.json

      - name: Analyze FM-3 shots SOT goals formation residuals
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=engine python engine/mcp_gateway/formation_matchup_fm3_oos_v1.py \
            --formation-report state/soccer_edge_state/analysis/formation_matchup_engine_v1.json \
            --output state/soccer_edge_state/analysis/formation_matchup_fm3_oos_v1.json
          jq -e '.status == "RESEARCH_ONLY_FM3_SHOTS_SOT_GOALS"' state/soccer_edge_state/analysis/formation_matchup_fm3_oos_v1.json >/dev/null
          jq -e '.health.odds_consumed == false and .health.market_prices_consumed == false' state/soccer_edge_state/analysis/formation_matchup_fm3_oos_v1.json >/dev/null
          jq -e '.health.production_enabled == false and .health.decision_weight == 0' state/soccer_edge_state/analysis/formation_matchup_fm3_oos_v1.json >/dev/null
          jq -e '(.targets.SHOTS | type) == "object" and (.targets.SOT | type) == "object" and (.targets.GOALS | type) == "object"' state/soccer_edge_state/analysis/formation_matchup_fm3_oos_v1.json >/dev/null

      - name: Analyze FM-4 prior-only style/personnel ablation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=engine python engine/mcp_gateway/formation_matchup_fm4_style_ablation_v1.py \
            --formation-report state/soccer_edge_state/analysis/formation_matchup_engine_v1.json \
            --history-dir state/soccer_edge_state/history \
            --output state/soccer_edge_state/analysis/formation_matchup_fm4_style_ablation_v1.json
          jq -e '.status == "RESEARCH_HOLD_FM4_STYLE_PERSONNEL_ABLATION"' state/soccer_edge_state/analysis/formation_matchup_fm4_style_ablation_v1.json >/dev/null
          jq -e '.health.odds_consumed == false and .health.current_match_postgame_style_consumed == false' state/soccer_edge_state/analysis/formation_matchup_fm4_style_ablation_v1.json >/dev/null
          jq -e '.personnel_overlay.status == "RESEARCH_ONLY_PERSONNEL_CONTINUITY"' state/soccer_edge_state/analysis/formation_matchup_fm4_style_ablation_v1.json >/dev/null
          jq -e '.personnel_overlay.production_enabled == false and .personnel_overlay.decision_weight == 0' state/soccer_edge_state/analysis/formation_matchup_fm4_style_ablation_v1.json >/dev/null
          jq -e '.health.personnel_continuity_materialized == true and .health.personnel_outcome_ablation_used == false' state/soccer_edge_state/analysis/formation_matchup_fm4_style_ablation_v1.json >/dev/null
          jq -e '.style_profile.history_source == "ALL_PRIOR_VERIFIED_TACTICAL_HISTORY"' state/soccer_edge_state/analysis/formation_matchup_fm4_style_ablation_v1.json >/dev/null
          jq -e '.health.production_enabled == false and .health.decision_weight == 0' state/soccer_edge_state/analysis/formation_matchup_fm4_style_ablation_v1.json >/dev/null

      - name: Analyze corners baseline
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=engine python engine/mcp_gateway/analyze_corners_baseline.py \
            --history-dir state/soccer_edge_state/history \
            --output state/soccer_edge_state/analysis/corners_baseline.json
          python - <<'PY'
          import json
          for p in ('state/soccer_edge_state/analysis/formation_intelligence.json','state/soccer_edge_state/analysis/formation_matchup_engine_v1.json','state/soccer_edge_state/analysis/formation_matchup_fm3_oos_v1.json','state/soccer_edge_state/analysis/formation_matchup_fm4_style_ablation_v1.json','state/soccer_edge_state/analysis/corners_baseline.json'):
              d=json.load(open(p, encoding='utf-8'))
              summary={k:d.get(k) for k in ('status','fixtures_with_confirmed_both_formations_and_final','fixtures_with_postgame_corners_and_formations','rows_with_verified_postgame_corners','walk_forward_evaluations','formation_adjusted_evaluations')}
              if p.endswith('formation_matchup_engine_v1.json'):
                  summary['model_version']=d.get('model_version')
                  summary['fixtures_with_verified_formation_pair_and_final']=d.get('fixtures_with_verified_formation_pair_and_final')
                  summary['unique_matchups']=d.get('unique_matchups')
                  summary['matchups_n_ge_8']=d.get('matchups_n_ge_8')
                  summary['metric_rows']=d.get('metric_rows')
              if p.endswith('formation_matchup_fm3_oos_v1.json'):
                  summary['model_version']=d.get('model_version')
                  summary['targets']={
                      key:{
                          'status': value.get('status'),
                          'observed_rows': value.get('observed_rows'),
                          'baseline_evaluations': value.get('baseline_evaluations'),
                          'formation_adjusted_evaluations': value.get('formation_adjusted_evaluations'),
                          'improvement': value.get('improvement'),
                          'blockers': value.get('blockers'),
                      }
                      for key,value in (d.get('targets') or {}).items()
                  }
                  summary['health']=d.get('health')
              if p.endswith('formation_matchup_fm4_style_ablation_v1.json'):
                  summary['model_version']=d.get('model_version')
                  summary['style_profile']=d.get('style_profile')
                  summary['targets']={
                      key:{
                          'status': value.get('status'),
                          'eligible_fixtures': value.get('eligible_fixtures'),
                          'improvement': value.get('improvement'),
                          'blockers': value.get('blockers'),
                      }
                      for key,value in (d.get('targets') or {}).items()
                  }
                  summary['personnel_overlay']=d.get('personnel_overlay')
                  summary['health']=d.get('health')
              if p.endswith('corners_baseline.json'):
                  lift=d.get('formation_lift_by_league')
                  assert isinstance(lift, dict)
                  summary['formation_lift_by_league']={
                      'review_ready': lift.get('review_ready'),
                      'review_eligible_leagues': lift.get('review_eligible_leagues'),
                      'stable_lift_leagues': lift.get('stable_lift_leagues'),
                      'negative_lift_leagues': lift.get('negative_lift_leagues'),
                  }
                  audit=d.get('formation_eligibility_audit') or {}
                  side=d.get('side_specific_formation_challenger') or {}
                  summary['side_specific_formation_challenger']={
                      'status': side.get('status'),
                      'formation_adjusted_evaluations': side.get('formation_adjusted_evaluations'),
                      'baseline_side_metrics': side.get('baseline_side_metrics'),
                      'challenger_side_metrics': side.get('challenger_side_metrics'),
                      'improvement': side.get('improvement'),
                      'production_enabled': side.get('production_enabled'),
                      'decision_weight': side.get('decision_weight'),
                  }
                  summary['formation_eligibility_audit']={
                      'audit_schema': 'formation_eligibility_v2_2',
                      'oos_evaluations': audit.get('oos_evaluations'),
                      'formation_adjusted_evaluations': audit.get('formation_adjusted_evaluations'),
                      'excluded_from_formation_adjustment': audit.get('excluded_from_formation_adjustment'),
                      'formation_present_but_prior_matchup_lt_8': audit.get('formation_present_but_prior_matchup_lt_8'),
                      'missing_matchup_rows': audit.get('missing_matchup_rows'),
                      'recoverable_missing_matchup_rows': audit.get('recoverable_missing_matchup_rows'),
                      'confirmed_xi_without_formation_value': (audit.get('reason_counts') or {}).get('CONFIRMED_XI_WITHOUT_FORMATION_VALUE'),
                      'reason_counts': audit.get('reason_counts'),
                      'timing_integrity': audit.get('timing_integrity'),
                  }
              print(p, json.dumps(summary, indent=2))
          PY

      - name: Persist research analysis
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "soccer-edge-bot"
          git config user.email "soccer-edge-bot@users.noreply.github.com"
          git add -f soccer_edge_state/analysis/formation_intelligence.json soccer_edge_state/analysis/formation_matchup_engine_v1.json soccer_edge_state/analysis/formation_matchup_fm3_oos_v1.json soccer_edge_state/analysis/formation_matchup_fm4_style_ablation_v1.json soccer_edge_state/analysis/corners_baseline.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Soccer Edge formation and corners research"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
