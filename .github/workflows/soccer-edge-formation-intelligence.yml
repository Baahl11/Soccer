name: Soccer Edge Formation Intelligence

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - soccer-edge-mcp-v1
    paths:
      - ".github/workflows/soccer-edge-formation-intelligence.yml"
      - "mcp_gateway/analyze_formation_intelligence.py"
      - "mcp_gateway/analyze_formation_intelligence_v2.py"
      - "mcp_gateway/analyze_corners_baseline.py"
      - "mcp_gateway/automation_v17.py"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 0

      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: engine
          fetch-depth: 1

      - name: Analyze formation intelligence
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=engine python engine/mcp_gateway/analyze_formation_intelligence_v2.py \
            --history-dir state/soccer_edge_state/history \
            --output state/soccer_edge_state/analysis/formation_intelligence.json

      - name: Analyze corners baseline
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=engine python engine/mcp_gateway/analyze_corners_baseline.py \
            --history-dir state/soccer_edge_state/history \
            --output state/soccer_edge_state/analysis/corners_baseline.json
          python - <<'PY'
          import json
          for p in ('state/soccer_edge_state/analysis/formation_intelligence.json','state/soccer_edge_state/analysis/corners_baseline.json'):
              d=json.load(open(p, encoding='utf-8'))
              summary={k:d.get(k) for k in ('status','fixtures_with_confirmed_both_formations_and_final','fixtures_with_postgame_corners_and_formations','rows_with_verified_postgame_corners','walk_forward_evaluations','formation_adjusted_evaluations')}
              if p.endswith('corners_baseline.json'):
                  lift=d.get('formation_lift_by_league')
                  assert isinstance(lift, dict)
                  summary['formation_lift_by_league']={
                      'review_ready': lift.get('review_ready'),
                      'review_eligible_leagues': lift.get('review_eligible_leagues'),
                      'stable_lift_leagues': lift.get('stable_lift_leagues'),
                      'negative_lift_leagues': lift.get('negative_lift_leagues'),
                  }
                  audit=d.get('formation_eligibility_audit') or {}
                  summary['formation_eligibility_audit']={
                      'oos_evaluations': audit.get('oos_evaluations'),
                      'formation_adjusted_evaluations': audit.get('formation_adjusted_evaluations'),
                      'excluded_from_formation_adjustment': audit.get('excluded_from_formation_adjustment'),
                      'formation_present_but_prior_matchup_lt_8': audit.get('formation_present_but_prior_matchup_lt_8'),
                      'missing_matchup_rows': audit.get('missing_matchup_rows'),
                      'recoverable_missing_matchup_rows': audit.get('recoverable_missing_matchup_rows'),
                      'reason_counts': audit.get('reason_counts'),
                  }
              print(p, json.dumps(summary, indent=2))
          PY

      - name: Persist research analysis
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "soccer-edge-bot"
          git config user.email "soccer-edge-bot@users.noreply.github.com"
          git add -f soccer_edge_state/analysis/formation_intelligence.json soccer_edge_state/analysis/corners_baseline.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Soccer Edge formation and corners research"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
