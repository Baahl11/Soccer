name: FE0 Frontend Stabilization

on:
  push:
    branches:
      - fe0-frontend-stabilization
    paths:
      - mcp_gateway/subscriber_preview_v230.py
      - mcp_gateway/subscriber_preview_live_v231.py
      - mcp_gateway/subscriber_product_v233.py
      - mcp_gateway/subscriber_product_v234.py
      - mcp_gateway/subscriber_product_v235.py
      - mcp_gateway/subscriber_today_v236.py
      - mcp_gateway/subscriber_visual_v237.py
      - tests/test_fe0_frontend_stabilization.py
      - .github/workflows/fe0-frontend-stabilization.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_gateway/requirements.txt pytest
      - name: Compile frontend modules
        run: |
          python -m py_compile             mcp_gateway/subscriber_preview_v230.py             mcp_gateway/subscriber_preview_live_v231.py             mcp_gateway/subscriber_product_v233.py             mcp_gateway/subscriber_product_v234.py             mcp_gateway/subscriber_product_v235.py             mcp_gateway/subscriber_today_v236.py             mcp_gateway/subscriber_visual_v237.py
      - name: Run FE0 and subscriber regressions
        run: |
          PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider             tests/test_fe0_frontend_stabilization.py             tests/test_v233_frontend_completion_gate.py             tests/test_v234_functional_mockup_completion.py             tests/test_subscriber_ui_contract_v231.py             tests/test_v4_023_subscriber_preview_data.py
