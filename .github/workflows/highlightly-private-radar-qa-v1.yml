name: Soccer Highlightly Private Radar Source - Security and State QA
on:
  pull_request:
    branches: [soccer-edge-mcp-v1]
    paths:
      - 'mcp_gateway/highlightly_research_pg_v1.py'
      - 'mcp_gateway/server.py'
      - 'mcp_gateway/subscriber_contract_v2.py'
      - 'mcp_gateway/subscriber_frontend_v2.py'
      - 'tests/test_highlightly_research_pg_v1.py'
      - 'tests/test_subscriber_contract_v2.py'
      - 'tests/test_subscriber_frontend_v2.py'
      - '.github/workflows/highlightly-private-radar-qa-v1.yml'

permissions:
  contents: read

jobs:
  no-bet-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r mcp_gateway/requirements.txt pytest
      - name: Run research store and existing V2 contract/frontend tests
        run: |
          set -euo pipefail
          python -m pytest -q -c /dev/null --rootdir=. -p no:cacheprovider tests/test_highlightly_research_pg_v1.py tests/test_subscriber_contract_v2.py tests/test_subscriber_frontend_v2.py
          python - <<'PY'
          from pathlib import Path
          server=Path('mcp_gateway/server.py').read_text()
          pg=Path('mcp_gateway/highlightly_research_pg_v1.py').read_text()
          contract=Path('mcp_gateway/subscriber_contract_v2.py').read_text()
          assert 'HIGHLIGHTLY_RESEARCH_IMPORT_WORKFLOW' in server
          assert '_github_oidc_claims' in server
          assert "commercial_display_allowed" in pg
          assert 'SOURCE_NOT_VERIFIED' in contract
          assert "access.get(\"owner\") or access.get(\"admin\")" in contract
          print("HIGHLIGHTLY_PRIVATE_RESEARCH_NO_BET_GATE_PASS")
          PY
