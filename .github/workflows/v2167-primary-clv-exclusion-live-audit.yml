name: v216.7 Primary CLV Exclusion Live Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v2167-primary-clv-exclusion-live-audit.yml"

permissions:
  contents: read
  id-token: write

jobs:
  audit-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_COMMIT: de18ba4c6369f9ba86649635d45f3b74dd7c2903
      BASE_URL: https://soccer-edge-api.onrender.com
    steps:
      - name: Wait for v216.7 runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl -fsS --max-time 20 "$BASE_URL/health" -o /tmp/health.json; then
              LIVE_COMMIT=$(jq -r '.render_git_commit // empty' /tmp/health.json)
              echo "attempt=$attempt live_commit=$LIVE_COMMIT"
              if [ "$LIVE_COMMIT" = "$EXPECTED_COMMIT" ]; then
                jq '{status,service,version,render_git_commit,database_persistence_configured}' /tmp/health.json
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Render did not reach expected commit $EXPECTED_COMMIT"
          cat /tmp/health.json || true
          exit 1

      - name: Run one diagnostic tick
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.value // empty')
          test -n "$OIDC_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"

          HTTP_CODE=$(curl -sS --max-time 430 \
            -o /tmp/tick.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            "$BASE_URL/internal/tick")

          echo "http_code=$HTTP_CODE"
          test "$HTTP_CODE" = "200"
          jq -e 'type == "object"' /tmp/tick.json >/dev/null

          jq '{
            service,
            version,
            model_version,
            generated_at_utc,
            fixture_scan_count,
            due_fixture_count,
            event_count,
            api_calls_this_tick,
            effective_max_api_calls_per_tick,
            last_daily_remaining,
            database_persisted,
            database_error,
            audit: .v216_7_primary_clv_maturation_exclusion_audit,
            primary_maturation: {
              source: .price_resolution_v4.primary_clv_maturation_source,
              candidates: .price_resolution_v4.primary_clv_maturation_candidates,
              candidate_family_counts: .price_resolution_v4.primary_clv_maturation_candidate_family_counts,
              evaluation_counts: .price_resolution_v4.primary_clv_maturation_family_evaluation_counts,
              not_matured_counts: .price_resolution_v4.primary_clv_maturation_not_matured_family_counts,
              refresh_counts: .price_resolution_v4.primary_clv_maturation_family_refresh_counts,
              unchanged_provider_updates: .price_resolution_v4.primary_clv_maturation_unchanged_provider_updates,
              api_calls_added: .price_resolution_v4.primary_clv_maturation_api_calls_added
            }
          }' /tmp/tick.json | tee /tmp/v2167-audit.json

          jq -e '.version == "4.38.4-primary-clv-exclusion-audit"' /tmp/tick.json >/dev/null
          jq -e '.database_persisted == true' /tmp/tick.json >/dev/null
          jq -e '.v216_7_primary_clv_maturation_exclusion_audit.status == "OBSERVABILITY_ONLY"' /tmp/tick.json >/dev/null
          jq -e '.v216_7_primary_clv_maturation_exclusion_audit.provider_requests_added == 0' /tmp/tick.json >/dev/null
          jq -e '.v216_7_primary_clv_maturation_exclusion_audit.selection_logic_changed == false' /tmp/tick.json >/dev/null
          jq -e '.v216_7_primary_clv_maturation_exclusion_audit.loader_observation.diagnostic_family_counts["1X2"] | type == "object"' /tmp/tick.json >/dev/null
