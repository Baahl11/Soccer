name: Soccer Edge Scheduler
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/soccer-edge-scheduler.yml"]
concurrency: {group: soccer-edge-scheduler, cancel-in-progress: false}
permissions: {contents: write, issues: write, id-token: write}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout state branch
        uses: actions/checkout@v4
        with: {ref: soccer-edge-state, fetch-depth: 0}
      - name: API quota circuit breaker
        id: quota_guard
        shell: bash
        run: |
          set -euo pipefail
          SKIP=false
          if [ -f soccer_edge_state/quota_block_until.txt ]; then
            BLOCK_UNTIL=$(cat soccer_edge_state/quota_block_until.txt || echo 0); NOW=$(date -u +%s)
            if [ "$NOW" -lt "$BLOCK_UNTIL" ]; then SKIP=true; fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
      - name: Obtain GitHub OIDC token
        if: steps.quota_guard.outputs.skip != 'true'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          TOKEN=$(echo "$RESPONSE" | jq -r '.value'); test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Run Soccer Edge tick
        if: steps.quota_guard.outputs.skip != 'true'
        id: tick
        shell: bash
        env: {OIDC_TOKEN: "${{ steps.oidc.outputs.token }}"}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/soccer_tick.json -w "%{http_code}" -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H "Content-Type: application/json" https://soccer-edge-api.onrender.com/internal/tick)
          jq '{service,version,model_version,generated_at_local,event_count,api_calls_this_tick,last_daily_remaining,galaxy_first_metrics,odds_source_policy,galaxy_builder_candidate_count_this_tick,match_intelligence_event_count_this_tick,referee_assignment_verified_count_this_tick,coach_pair_verified_count_this_tick,card_market_groups_this_tick,card_market_quotes_this_tick,trend_context_count_this_tick,trend_signal_count_this_tick,trend_model_disagreement_count_this_tick,player_trend_fixture_calls_attempted_this_tick,player_trend_fixtures_captured_this_tick,player_trend_players_captured_this_tick,player_trend_policy,v343_xg_xga_checkpoint,v344_npxg_npxga_checkpoint,odds_catalog_audit,v357_odds_catalog_checkpoint,bookmaker_catalog_audit,primary_bookmaker_policy,v358_bookmaker_checkpoint,v345_ppda_checkpoint,v346_field_tilt_checkpoint,v347_box_entries_checkpoint,v348_big_chances_checkpoint,database_persisted,error,detail}' /tmp/soccer_tick.json
          if [ "$HTTP_CODE" -ne 200 ]; then
            mkdir -p soccer_edge_state
            jq --arg http_code "$HTTP_CODE" '{captured_at: now|todateiso8601,http_code:$http_code,response:.}' /tmp/soccer_tick.json > soccer_edge_state/last_error.json
            if jq -e '(.detail // "") | test("request limit for the day"; "i")' /tmp/soccer_tick.json >/dev/null; then date -u -d 'tomorrow 00:05:00' +%s > soccer_edge_state/quota_block_until.txt; fi
            git config user.name soccer-edge-bot; git config user.email soccer-edge-bot@users.noreply.github.com
            git add -f soccer_edge_state/last_error.json
            if [ -f soccer_edge_state/quota_block_until.txt ]; then git add -f soccer_edge_state/quota_block_until.txt; fi
            if ! git diff --cached --quiet; then git commit -m "Soccer Edge scheduler error"; git push origin HEAD:soccer-edge-state; fi
            exit 1
          fi
          echo "event_count=$(jq -r '.event_count // 0' /tmp/soccer_tick.json)" >> "$GITHUB_OUTPUT"
          echo "run_date=$(jq -r '.generated_at_local[0:10]' /tmp/soccer_tick.json)" >> "$GITHUB_OUTPUT"
      - name: Persist scheduler heartbeat
        if: steps.quota_guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p soccer_edge_state
          jq '{
            status:"ok",
            service,
            version,
            model_version,
            generated_at_utc,
            generated_at_local,
            timezone,
            fixture_scan_count,
            due_fixture_count,
            event_count,
            actionable_refresh_count,
            bet_candidate_count,
            api_calls_this_tick,
            last_daily_remaining,
            daily_budget_mode,
            database_persisted
          }' /tmp/soccer_tick.json > soccer_edge_state/health.json
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/health.json
          if ! git diff --cached --quiet; then
            git commit -m "Soccer Edge health heartbeat"
            git push origin HEAD:soccer-edge-state
          fi
      - name: Persist pending opportunity queue
        if: steps.quota_guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p soccer_edge_state
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          tick = json.load(open("/tmp/soccer_tick.json", encoding="utf-8"))
          state_path = Path("soccer_edge_state/pending_opportunities.json")
          latest_path = Path("soccer_edge_state/latest.json")
          now = datetime.fromisoformat(tick["generated_at_local"])

          def dt(value):
              try:
                  return datetime.fromisoformat(value) if value else None
              except Exception:
                  return None

          def num(value):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return None

          previous = {}
          if state_path.exists():
              try:
                  old = json.load(open(state_path, encoding="utf-8"))
                  rows = old.get("opportunities", []) if isinstance(old, dict) else []
                  for row in rows:
                      ko = dt(((row.get("fixture") or {}).get("kickoff")))
                      if ko and ko > now and row.get("key"):
                          previous[row["key"]] = row
              except Exception:
                  previous = {}

          sources = [tick]
          if latest_path.exists():
              try:
                  persisted_latest = json.load(open(latest_path, encoding="utf-8"))
                  if isinstance(persisted_latest, dict):
                      sources.append(persisted_latest)
              except Exception:
                  pass

          current = {}
          for source in sources:
              source_seen_at = source.get("generated_at_local") or tick["generated_at_local"]
              for event in source.get("events") or []:
                  fixture = event.get("fixture") or {}
                  fixture_id = fixture.get("fixture_id")
                  kickoff = dt(fixture.get("kickoff"))
                  if not fixture_id or not kickoff or kickoff <= now:
                      continue

                  shortlist = event.get("sporting_shortlist") or {}
                  raw = event.get("raw_projection") or {}
                  best = event.get("best_market") or {}
                  availability = num(event.get("availability_confidence"))
                  rank = num(shortlist.get("rank"))
                  two_way = num(shortlist.get("two_way_scoring_score"))
                  goals_env = num(shortlist.get("goal_environment_score"))
                  tracks = set(shortlist.get("tracks") or [])
                  over25 = num(raw.get("raw_over_2_5_prob"))
                  home = num(raw.get("raw_home_win_prob"))
                  draw = num(raw.get("raw_draw_prob"))
                  away = num(raw.get("raw_away_win_prob"))

                  strong_sport = bool(shortlist.get("shortlisted")) and (
                      (rank is not None and rank >= 80.0)
                      or (two_way is not None and two_way >= 80.0)
                      or (goals_env is not None and goals_env >= 75.0)
                      or ("GOALS_OVER" in tracks and over25 is not None and over25 >= 0.60)
                      or ("GOALS_UNDER" in tracks and over25 is not None and (1.0 - over25) >= 0.60)
                      or (
                          "SIDE" in tracks
                          and max([p for p in (home, draw, away) if p is not None] or [0.0]) >= 0.60
                      )
                  )
                  if strong_sport:
                      key = f"sport:{fixture_id}"
                      current[key] = {
                          "key": key,
                          "signal_type": "PRE_MARKET_WATCH",
                          "first_seen_at": (previous.get(key) or {}).get("first_seen_at", source_seen_at),
                          "last_seen_at": source_seen_at,
                          "fixture": fixture,
                          "stage": event.get("stage"),
                          "classification": event.get("classification"),
                          "availability_confidence": event.get("availability_confidence"),
                          "sporting_shortlist": shortlist,
                          "raw_projection": raw,
                          "market_provenance": event.get("market_provenance"),
                          "notes": event.get("notes") or [],
                      }

                  edge = num(best.get("prob_edge_pp"))
                  tier = best.get("tier")
                  market_fresh = bool(best.get("quote_fresh")) or bool(
                      (event.get("market_provenance") or {}).get("fresh")
                  )
                  if best and edge is not None and edge >= 3.0:
                      key = (
                          f"market:{fixture_id}:{best.get('family')}:"
                          f"{best.get('selection')}:{best.get('line')}"
                      )
                      if (
                          event.get("classification") in {"BET", "LEAN"}
                          and market_fresh
                          and (availability or 0.0) >= 0.85
                      ):
                          signal_type = "ACTION_NOW"
                      elif tier in {"A", "S"} or edge >= 5.0:
                          signal_type = "MARKET_CHECK_NEEDED"
                      else:
                          signal_type = "WATCH_EDGE"

                      current[key] = {
                          "key": key,
                          "signal_type": signal_type,
                          "first_seen_at": (previous.get(key) or {}).get("first_seen_at", source_seen_at),
                          "last_seen_at": source_seen_at,
                          "fixture": fixture,
                          "stage": event.get("stage"),
                          "classification": event.get("classification"),
                          "availability_confidence": event.get("availability_confidence"),
                          "sporting_shortlist": shortlist,
                          "raw_projection": raw,
                          "market_provenance": event.get("market_provenance"),
                          "best_market": best,
                          "notes": event.get("notes") or [],
                      }

          merged = dict(previous)
          merged.update(current)
          opportunities = sorted(
              merged.values(),
              key=lambda row: (
                  ((row.get("fixture") or {}).get("kickoff") or ""),
                  row.get("signal_type") or "",
                  row.get("key") or "",
              ),
          )[:100]

          payload = {
              "schema_version": "1.0.0",
              "generated_at_local": tick["generated_at_local"],
              "version": tick.get("version"),
              "opportunity_count": len(opportunities),
              "opportunities": opportunities,
          }
          state_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/pending_opportunities.json
          if ! git diff --cached --quiet; then
            git commit -m "Soccer Edge pending opportunities"
            git push origin HEAD:soccer-edge-state
          fi
      - name: Deliver live opportunity alerts
        if: steps.quota_guard.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOCCER_ALERT_WEBHOOK_URL: ${{ secrets.SOCCER_ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          queue_path = Path("soccer_edge_state/pending_opportunities.json")
          sent_path = Path("soccer_edge_state/alert_delivery_state.json")
          if not queue_path.exists():
              Path("/tmp/soccer_alert_count").write_text("0")
              raise SystemExit(0)

          queue = json.load(open(queue_path, encoding="utf-8"))
          now = datetime.fromisoformat(queue["generated_at_local"])

          def dt(value):
              try:
                  return datetime.fromisoformat(value) if value else None
              except Exception:
                  return None

          def num(value):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return None

          def changed_materially(old, row):
              if not old:
                  return True
              if old.get("signal_type") != row.get("signal_type"):
                  return True
              if old.get("classification") != row.get("classification"):
                  return True
              old_av = num(old.get("availability_confidence"))
              new_av = num(row.get("availability_confidence"))
              if old_av is not None and new_av is not None:
                  if (old_av < 0.85 <= new_av) or (old_av >= 0.85 > new_av):
                      return True
              old_best = old.get("best_market") or {}
              new_best = row.get("best_market") or {}
              old_edge = num(old_best.get("prob_edge_pp"))
              new_edge = num(new_best.get("prob_edge_pp"))
              if old_edge is not None and new_edge is not None and abs(new_edge - old_edge) >= 2.0:
                  return True
              old_price = num(old_best.get("decimal_price"))
              new_price = num(new_best.get("decimal_price"))
              if old_price is not None and new_price is not None and abs(new_price - old_price) >= 0.10:
                  return True
              old_fresh = bool(old_best.get("quote_fresh")) or bool((old.get("market_provenance") or {}).get("fresh"))
              new_fresh = bool(new_best.get("quote_fresh")) or bool((row.get("market_provenance") or {}).get("fresh"))
              if old_fresh != new_fresh:
                  return True
              old_rank = num((old.get("sporting_shortlist") or {}).get("rank"))
              new_rank = num((row.get("sporting_shortlist") or {}).get("rank"))
              if old_rank is not None and new_rank is not None and abs(new_rank - old_rank) >= 10.0:
                  return True
              return False

          sent = {}
          if sent_path.exists():
              try:
                  sent_doc = json.load(open(sent_path, encoding="utf-8"))
                  sent = sent_doc.get("delivered", {}) if isinstance(sent_doc, dict) else {}
              except Exception:
                  sent = {}

          eligible = []
          for row in queue.get("opportunities") or []:
              kickoff = dt(((row.get("fixture") or {}).get("kickoff")))
              if not kickoff or kickoff <= now:
                  continue
              signal = row.get("signal_type")
              best = row.get("best_market") or {}
              edge = num(best.get("prob_edge_pp"))
              minutes = (kickoff - now).total_seconds() / 60.0

              keep = signal in {
                  "ACTION_NOW",
                  "MARKET_CHECK_NEEDED",
                  "MODEL_PLAY_MANUAL_PRICE_CHECK",
                  "GALAXY",
                  "PRE_MARKET_WATCH",
              }
              if signal == "WATCH_EDGE":
                  keep = minutes <= 45.0 and edge is not None and edge >= 3.0
              if not keep:
                  continue
              key = row.get("key")
              if not key or not changed_materially(sent.get(key), row):
                  continue

              priority_order = {
                  "ACTION_NOW": 0,
                  "MARKET_CHECK_NEEDED": 1,
                  "MODEL_PLAY_MANUAL_PRICE_CHECK": 2,
                  "GALAXY": 3,
                  "WATCH_EDGE": 4,
                  "PRE_MARKET_WATCH": 5,
              }
              eligible.append((
                  priority_order.get(signal, 9),
                  minutes,
                  -(edge or 0.0),
                  -(num((row.get("sporting_shortlist") or {}).get("rank")) or 0.0),
                  row,
              ))

          eligible.sort(key=lambda x: x[:4])
          selected = [x[4] for x in eligible[:3]]
          Path("/tmp/soccer_alert_count").write_text(str(len(selected)))
          if not selected:
              raise SystemExit(0)

          def pct(v):
              x = num(v)
              return "N/V" if x is None else f"{100*x:.1f}%"

          def dec(v):
              x = num(v)
              return "N/V" if x is None else f"{x:.2f}"

          def match_name(row):
              f = row.get("fixture") or {}
              return f"{f.get('home_team','?')} vs {f.get('away_team','?')}"

          def kickoff_text(row):
              d = dt(((row.get("fixture") or {}).get("kickoff")) or "")
              return d.strftime("%H:%M CDMX") if d else "N/V"

          cards = []
          for row in selected:
              signal = row.get("signal_type")
              shortlist = row.get("sporting_shortlist") or {}
              raw = row.get("raw_projection") or {}
              best = row.get("best_market") or {}
              prov = row.get("market_provenance") or {}
              av = num(row.get("availability_confidence"))
              lines = [
                  f"### ⚽ {signal}",
                  f"**{match_name(row)} — {kickoff_text(row)}**",
              ]
              if signal == "PRE_MARKET_WATCH":
                  tracks = ", ".join(shortlist.get("tracks") or []) or "N/V"
                  lines += [
                      f"Señales: {tracks} | shortlist {dec(shortlist.get('rank'))}",
                      f"λ total: {dec(raw.get('raw_total_goals'))} | Over 2.5 raw: {pct(raw.get('raw_over_2_5_prob'))} | BTTS Sí raw: {pct(raw.get('raw_btts_yes_prob'))}",
                      f"1X2 raw H/D/A: {pct(raw.get('raw_home_win_prob'))} / {pct(raw.get('raw_draw_prob'))} / {pct(raw.get('raw_away_win_prob'))}",
                      f"Availability: {dec(av)} | **ESPERANDO PRECIO FRESCO / XI-GK**",
                  ]
              else:
                  fresh = bool(best.get("quote_fresh")) or bool(prov.get("fresh"))
                  price_label = "FRESCA" if fresh else "STALE / REFERENCIA"
                  market_line = best.get("line")
                  market_text = f"{best.get('market') or best.get('family') or 'N/V'} — {best.get('selection') or 'N/V'}"
                  if market_line is not None:
                      market_text += f" {market_line}"
                  lines += [
                      f"Mercado: {market_text}",
                      f"Precio: {best.get('decimal_price','N/V')} @ {best.get('bookmaker','N/V')} — **{price_label}**",
                      f"P_model/shrunk: {pct(best.get('p_shrunk'))} | Edge: {dec(best.get('prob_edge_pp'))} pp | Tier: {best.get('tier') or 'N/V'}",
                      f"Availability: {dec(av)} | quote age: {dec(best.get('quote_age_minutes'))} min",
                  ]
              notes = row.get("notes") or []
              if notes:
                  lines.append(f"Bloqueo principal: {notes[0]}")
              cards.append("\n".join(lines))

          body = "@Baahl11\n\n" + "\n\n---\n\n".join(cards)
          Path("/tmp/soccer_alert_body.md").write_text(body + "\n", encoding="utf-8")
          Path("/tmp/soccer_alert_webhook.json").write_text(
              json.dumps(
                  {
                      "source": "soccer-edge-scheduler",
                      "generated_at_local": queue.get("generated_at_local"),
                      "alert_count": len(selected),
                      "message": body,
                      "opportunities": selected,
                  },
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )

          delivered = dict(sent)
          for row in selected:
              snapshot = dict(row)
              snapshot["delivered_at_local"] = queue.get("generated_at_local")
              delivered[row["key"]] = snapshot
          next_state = {
              "schema_version": "1.0.0",
              "updated_at_local": queue.get("generated_at_local"),
              "delivered": dict(list(delivered.items())[-500:]),
          }
          Path("/tmp/soccer_alert_delivery_state_next.json").write_text(
              json.dumps(next_state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          ALERT_COUNT=$(cat /tmp/soccer_alert_count)
          if [ "$ALERT_COUNT" = "0" ]; then
            exit 0
          fi

          ISSUE_NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Soccer Edge Live Alerts" in:title' --json number,title --jq '.[] | select(.title=="⚽ Soccer Edge Live Alerts") | .number' | head -n1)
          if [ -z "$ISSUE_NUMBER" ]; then
            cat >/tmp/soccer_issue_intro.md <<'EOF'
          @Baahl11

          Canal automático de alertas del Soccer Edge Scheduler.
          Cada comentario es una oportunidad nueva o materialmente cambiada.
          WATCH/PRE-MARKET no equivale a BET.
          EOF
            ISSUE_URL=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "⚽ Soccer Edge Live Alerts" --body-file /tmp/soccer_issue_intro.md)
            ISSUE_NUMBER="${ISSUE_URL##*/}"
          fi

          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/soccer_alert_body.md

          if [ -n "${SOCCER_ALERT_WEBHOOK_URL:-}" ]; then
            curl -fsS -X POST -H "Content-Type: application/json" --data-binary @/tmp/soccer_alert_webhook.json "$SOCCER_ALERT_WEBHOOK_URL" || echo "::warning::Optional alert webhook delivery failed"
          fi

          cp /tmp/soccer_alert_delivery_state_next.json soccer_edge_state/alert_delivery_state.json
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/alert_delivery_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Soccer Edge alert delivery state"
            git push origin HEAD:soccer-edge-state
          fi
      - name: Build compact notification state
        if: steps.quota_guard.outputs.skip != 'true' && steps.tick.outputs.event_count != '0'
        shell: bash
        run: |
          set -euo pipefail
