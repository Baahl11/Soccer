name: Soccer Edge Scheduler
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/soccer-edge-scheduler.yml"]
concurrency: {group: soccer-edge-scheduler, cancel-in-progress: false}
permissions: {contents: write, id-token: write}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout state branch
        uses: actions/checkout@v4
        with: {ref: soccer-edge-state, fetch-depth: 0}
      - name: API quota circuit breaker
        id: quota_guard
        shell: bash
        run: |
          set -euo pipefail
          SKIP=false
          if [ -f soccer_edge_state/quota_block_until.txt ]; then
            BLOCK_UNTIL=$(cat soccer_edge_state/quota_block_until.txt || echo 0); NOW=$(date -u +%s)
            if [ "$NOW" -lt "$BLOCK_UNTIL" ]; then SKIP=true; fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
      - name: Obtain GitHub OIDC token
        if: steps.quota_guard.outputs.skip != 'true'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          TOKEN=$(echo "$RESPONSE" | jq -r '.value'); test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Run Soccer Edge tick
        if: steps.quota_guard.outputs.skip != 'true'
        id: tick
        shell: bash
        env: {OIDC_TOKEN: "${{ steps.oidc.outputs.token }}"}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/soccer_tick.json -w "%{http_code}" -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H "Content-Type: application/json" https://soccer-edge-api.onrender.com/internal/tick)
          jq '{service,version,model_version,generated_at_local,event_count,api_calls_this_tick,last_daily_remaining,galaxy_first_metrics,odds_source_policy,galaxy_builder_candidate_count_this_tick,match_intelligence_event_count_this_tick,referee_assignment_verified_count_this_tick,coach_pair_verified_count_this_tick,card_market_groups_this_tick,card_market_quotes_this_tick,trend_context_count_this_tick,trend_signal_count_this_tick,trend_model_disagreement_count_this_tick,player_trend_fixture_calls_attempted_this_tick,player_trend_fixtures_captured_this_tick,player_trend_players_captured_this_tick,player_trend_policy,v343_xg_xga_checkpoint,v344_npxg_npxga_checkpoint,v345_ppda_checkpoint,v346_field_tilt_checkpoint,v347_box_entries_checkpoint,v348_big_chances_checkpoint,database_persisted,error,detail}' /tmp/soccer_tick.json
          if [ "$HTTP_CODE" -ne 200 ]; then
            mkdir -p soccer_edge_state
            jq --arg http_code "$HTTP_CODE" '{captured_at: now|todateiso8601,http_code:$http_code,response:.}' /tmp/soccer_tick.json > soccer_edge_state/last_error.json
            if jq -e '(.detail // "") | test("request limit for the day"; "i")' /tmp/soccer_tick.json >/dev/null; then date -u -d 'tomorrow 00:05:00' +%s > soccer_edge_state/quota_block_until.txt; fi
            git config user.name soccer-edge-bot; git config user.email soccer-edge-bot@users.noreply.github.com
            git add -f soccer_edge_state/last_error.json soccer_edge_state/quota_block_until.txt 2>/dev/null || true
            if ! git diff --cached --quiet; then git commit -m "Soccer Edge scheduler error"; git push origin HEAD:soccer-edge-state; fi
            exit 1
          fi
          echo "event_count=$(jq -r '.event_count // 0' /tmp/soccer_tick.json)" >> "$GITHUB_OUTPUT"
          echo "run_date=$(jq -r '.generated_at_local[0:10]' /tmp/soccer_tick.json)" >> "$GITHUB_OUTPUT"
      - name: Build compact notification state
        if: steps.quota_guard.outputs.skip != 'true' && steps.tick.outputs.event_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          jq '{service,version,model_version,generated_at_utc,generated_at_local,timezone,fixture_scan_count,due_fixture_count,event_count,actionable_refresh_count,bet_candidate_count,api_calls_this_tick,max_api_calls_per_tick,effective_max_api_calls_per_tick,last_daily_remaining,daily_budget_mode,deferred_due_to_budget,deferred_due_to_priority,deep_dive_processed_count,shortlist_event_count,screened_out_low_data_count,market_requests_avoided_by_sport_screen,max_deep_dive_fixtures_per_tick,priority_queue,urgent_late_shortlist_due,urgent_late_shortlist_processed,urgent_window_completion_rate_this_tick,urgent_window_policy,deep_dive_capacity_policy,base_deep_dive_cap,elastic_deep_dive_cap,provider_api_cap_unchanged,dedicated_close_snapshots_this_tick,dedicated_close_quotes_this_tick,clv_close_policy,derivative_research_snapshots_this_tick,derivative_research_quotes_this_tick,one_h_market_groups_this_tick,two_h_market_groups_this_tick,derivative_market_capture_policy,relative_strength_1x2_shadow_count_this_tick,relative_strength_1x2_policy,trend_context_count_this_tick,trend_signal_count_this_tick,trend_model_disagreement_count_this_tick,trend_context_policy,player_trend_fixture_calls_attempted_this_tick,player_trend_fixtures_captured_this_tick,player_trend_players_captured_this_tick,player_trend_max_fixture_calls_per_tick,player_trend_policy,request_pacing_seconds,rate_limit_max_retries,first_half_market_model,period_market_model,automated_market_scope,shortlist_persistence,shortlist_state_count,shortlist_seed_imported,galaxy_first_enabled,galaxy_first_policy,galaxy_first_metrics,actionable_model_scope,duplicate_request_policy,galaxy_sample_policy,tier_policy,odds_source_policy,league_coverage_registry,presentation_contract,coverage_registry_policy,match_table_rows,research_report,research_report_count_this_tick,research_completed_count_this_tick,research_insufficient_data_count_this_tick,research_policy,daily_research,daily_research_count_this_tick,daily_research_horizon_hours,galaxy_builder,galaxy_builder_candidate_count_this_tick,galaxy_builder_policy,galaxy_builder_actionable_scope,match_intelligence_schema_version,match_intelligence_event_count_this_tick,referee_assignment_verified_count_this_tick,coach_pair_verified_count_this_tick,card_market_groups_this_tick,card_market_quotes_this_tick,cards_probability_model_status,match_intelligence_policy,v39_provider_requests_added,v39_model_weights_changed,v39_canonical_bet_logic_changed,xg_xga_intelligence,v343_xg_xga_checkpoint,npxg_npxga_intelligence,v344_npxg_npxga_checkpoint,ppda_intelligence,v345_ppda_checkpoint,field_tilt_intelligence,v346_field_tilt_checkpoint,box_entries_intelligence,v347_box_entries_checkpoint,big_chances_intelligence,v348_big_chances_checkpoint,set_piece_intelligence,v349_set_piece_checkpoint,tactical_style_intelligence,rest_intelligence,congestion_intelligence,travel_intelligence,weather_intelligence,competition_context_intelligence,v350_tactical_style_checkpoint,rest_intelligence,v351_rest_checkpoint,congestion_intelligence,v352_congestion_checkpoint,travel_intelligence,v353_travel_checkpoint,weather_intelligence,v354_weather_checkpoint,competition_context_intelligence,v355_competition_context_checkpoint,galaxy_joint_intelligence,v356_galaxy_joint_checkpoint,quota,database_persisted,events:[.events[]|{event_type,stage,classification,tier,stake_units,bet_eligible,availability_confidence,fixture,coverage:(if (.coverage|type)=="object" then {data_tier:.coverage.data_tier} else .coverage end),sporting_shortlist,sporting_screen_initial,sporting_screen_refined,galaxy_source,market_source,market_provenance,trend_context,player_trends_research,postgame_player_stats,closing_market_snapshot,derivative_research_market_snapshot,match_intelligence,postgame_xg_observation,xg_xga_intelligence,npxg_npxga_intelligence,ppda_intelligence,field_tilt_intelligence,box_entries_intelligence,postgame_big_chances_observation,big_chances_intelligence,postgame_set_piece_observation,set_piece_intelligence,tactical_style_intelligence,rest_intelligence,congestion_intelligence,travel_intelligence,weather_intelligence,competition_context_intelligence,lineups:(if (.lineups|type)=="object" then {lineup_state:.lineups.lineup_state,both_xi_confirmed:.lineups.both_xi_confirmed,both_goalkeepers_confirmed:.lineups.both_goalkeepers_confirmed,teams:[.lineups.teams[]?|{team_id,team,formation,coach_id,coach,goalkeepers,starter_count:(.starters|length),substitutes_count}]} else .lineups end),raw_projection:(if (.raw_projection|type)=="object" then {status:.raw_projection.status,projection_model:.raw_projection.projection_model,sport_source:.raw_projection.sport_source,market_independent:.raw_projection.market_independent,advanced_metrics:.raw_projection.advanced_metrics,galaxy_contract_version:.raw_projection.galaxy_contract_version,galaxy_model_versions:.raw_projection.galaxy_model_versions,galaxy_data_cutoff:.raw_projection.galaxy_data_cutoff,galaxy_actionable_total_model:.raw_projection.galaxy_actionable_total_model,galaxy_actionable_reason:.raw_projection.galaxy_actionable_reason,raw_home_goal_rate:.raw_projection.raw_home_goal_rate,raw_away_goal_rate:.raw_projection.raw_away_goal_rate,raw_total_goals:.raw_projection.raw_total_goals,raw_home_win_prob:.raw_projection.raw_home_win_prob,raw_draw_prob:.raw_projection.raw_draw_prob,raw_away_win_prob:.raw_projection.raw_away_win_prob,raw_btts_yes_prob:.raw_projection.raw_btts_yes_prob,raw_over_2_5_prob:.raw_projection.raw_over_2_5_prob,scoring_path:.raw_projection.scoring_path,screen_scores:.raw_projection.screen_scores,relative_strength_shadow:.raw_projection.relative_strength_shadow} else .raw_projection end),market_decision:(if (.market_decision|type)=="object" then {status:.market_decision.status,reason:.market_decision.reason,first_half_markets_ignored:.market_decision.first_half_markets_ignored,first_half_reason:.market_decision.first_half_reason,period_markets_ignored:.market_decision.period_markets_ignored,period_market_reason:.market_decision.period_market_reason,btts_market_mode:.market_decision.btts_market_mode,galaxy_publication_gate_downgraded:.market_decision.galaxy_publication_gate_downgraded,galaxy_sample_gate_substitutions:.market_decision.galaxy_sample_gate_substitutions} else .market_decision end),best_market,notes,result,error}]}' /tmp/soccer_tick.json > /tmp/soccer_compact.json
          jq -e . /tmp/soccer_compact.json >/dev/null
      - name: Persist scheduler state
        if: steps.quota_guard.outputs.skip != 'true' && steps.tick.outputs.event_count != '0'
        shell: bash
        env: {RUN_DATE: "${{ steps.tick.outputs.run_date }}"}
        run: |
          set -euo pipefail
          mkdir -p soccer_edge_state/history
          cp /tmp/soccer_compact.json soccer_edge_state/latest.json
          jq -c '.' /tmp/soccer_compact.json >> "soccer_edge_state/history/${RUN_DATE}.jsonl"
          jq '.shortlist_state // {}' /tmp/soccer_tick.json > soccer_edge_state/shortlist_state.json
          rm -f soccer_edge_state/last_error.json soccer_edge_state/quota_block_until.txt
          git config user.name soccer-edge-bot; git config user.email soccer-edge-bot@users.noreply.github.com
          git add -A soccer_edge_state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Soccer Edge tick ${RUN_DATE}"
          git push origin HEAD:soccer-edge-state
