name: Soccer Edge Scheduler
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/soccer-edge-scheduler.yml"]
concurrency: {group: soccer-edge-scheduler, cancel-in-progress: false}
permissions: {contents: write, id-token: write}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout state branch
        uses: actions/checkout@v4
        with: {ref: soccer-edge-state, fetch-depth: 0}
      - name: API quota circuit breaker
        id: quota_guard
        shell: bash
        run: |
          set -euo pipefail
          SKIP=false
          if [ -f soccer_edge_state/quota_block_until.txt ]; then
            BLOCK_UNTIL=$(cat soccer_edge_state/quota_block_until.txt || echo 0); NOW=$(date -u +%s)
            if [ "$NOW" -lt "$BLOCK_UNTIL" ]; then SKIP=true; fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
      - name: Obtain GitHub OIDC token
        if: steps.quota_guard.outputs.skip != 'true'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          TOKEN=$(echo "$RESPONSE" | jq -r '.value'); test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Run Soccer Edge tick
        if: steps.quota_guard.outputs.skip != 'true'
        id: tick
        shell: bash
        env: {OIDC_TOKEN: "${{ steps.oidc.outputs.token }}"}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/soccer_tick.json -w "%{http_code}" -X POST -H "Authorization: Bearer ${OIDC_TOKEN}" -H "Content-Type: application/json" https://soccer-edge-api.onrender.com/internal/tick)
          jq '{service,version,model_version,generated_at_local,event_count,api_calls_this_tick,last_daily_remaining,galaxy_first_metrics,odds_source_policy,galaxy_builder_candidate_count_this_tick,match_intelligence_event_count_this_tick,referee_assignment_verified_count_this_tick,coach_pair_verified_count_this_tick,card_market_groups_this_tick,card_market_quotes_this_tick,trend_context_count_this_tick,trend_signal_count_this_tick,trend_model_disagreement_count_this_tick,player_trend_fixture_calls_attempted_this_tick,player_trend_fixtures_captured_this_tick,player_trend_players_captured_this_tick,player_trend_policy,v343_xg_xga_checkpoint,v344_npxg_npxga_checkpoint,odds_catalog_audit,v357_odds_catalog_checkpoint,bookmaker_catalog_audit,primary_bookmaker_policy,v358_bookmaker_checkpoint,v345_ppda_checkpoint,v346_field_tilt_checkpoint,v347_box_entries_checkpoint,v348_big_chances_checkpoint,database_persisted,error,detail}' /tmp/soccer_tick.json
          if [ "$HTTP_CODE" -ne 200 ]; then
            mkdir -p soccer_edge_state
            jq --arg http_code "$HTTP_CODE" '{captured_at: now|todateiso8601,http_code:$http_code,response:.}' /tmp/soccer_tick.json > soccer_edge_state/last_error.json
            if jq -e '(.detail // "") | test("request limit for the day"; "i")' /tmp/soccer_tick.json >/dev/null; then date -u -d 'tomorrow 00:05:00' +%s > soccer_edge_state/quota_block_until.txt; fi
            git config user.name soccer-edge-bot; git config user.email soccer-edge-bot@users.noreply.github.com
            git add -f soccer_edge_state/last_error.json
            if [ -f soccer_edge_state/quota_block_until.txt ]; then git add -f soccer_edge_state/quota_block_until.txt; fi
            if ! git diff --cached --quiet; then git commit -m "Soccer Edge scheduler error"; git push origin HEAD:soccer-edge-state; fi
            exit 1
          fi
          echo "event_count=$(jq -r '.event_count // 0' /tmp/soccer_tick.json)" >> "$GITHUB_OUTPUT"
          echo "run_date=$(jq -r '.generated_at_local[0:10]' /tmp/soccer_tick.json)" >> "$GITHUB_OUTPUT"
      - name: Persist scheduler heartbeat
        if: steps.quota_guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p soccer_edge_state
          jq '{
            status:"ok",
            service,
            version,
            model_version,
            generated_at_utc,
            generated_at_local,
            timezone,
            fixture_scan_count,
            due_fixture_count,
            event_count,
            actionable_refresh_count,
            bet_candidate_count,
            api_calls_this_tick,
            last_daily_remaining,
            daily_budget_mode,
            database_persisted
          }' /tmp/soccer_tick.json > soccer_edge_state/health.json
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/health.json
          if ! git diff --cached --quiet; then
            git commit -m "Soccer Edge health heartbeat"
            git push origin HEAD:soccer-edge-state
          fi
      - name: Build compact notification state
        if: steps.quota_guard.outputs.skip != 'true' && steps.tick.outputs.event_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          jq '{service,version,model_version,generated_at_utc,generated_at_local,timezone,fixture_scan_count,due_fixture_count,event_count,actionable_refresh_count,bet_candidate_count,api_calls_this_tick,max_api_calls_per_tick,effective_max_api_calls_per_tick,last_daily_remaining,daily_budget_mode,deferred_due_to_budget,deferred_due_to_priority,deep_dive_processed_count,shortlist_event_count,screened_out_low_data_count,market_requests_avoided_by_sport_screen,max_deep_dive_fixtures_per_tick,priority_queue,urgent_late_shortlist_due,urgent_late_shortlist_processed,urgent_window_completion_rate_this_tick,urgent_window_policy,deep_dive_capacity_policy,base_deep_dive_cap,elastic_deep_dive_cap,provider_api_cap_unchanged,dedicated_close_snapshots_this_tick,dedicated_close_quotes_this_tick,clv_close_policy,derivative_research_snapshots_this_tick,derivative_research_quotes_this_tick,one_h_market_groups_this_tick,two_h_market_groups_this_tick,derivative_market_capture_policy,relative_strength_1x2_shadow_count_this_tick,relative_strength_1x2_policy,trend_context_count_this_tick,trend_signal_count_this_tick,trend_model_disagreement_count_this_tick,trend_context_policy,player_trend_fixture_calls_attempted_this_tick,player_trend_fixtures_captured_this_tick,player_trend_players_captured_this_tick,player_trend_max_fixture_calls_per_tick,player_trend_policy,request_pacing_seconds,rate_limit_max_retries,first_half_market_model,period_market_model,automated_market_scope,shortlist_persistence,shortlist_state_count,shortlist_seed_imported,galaxy_first_enabled,galaxy_first_policy,galaxy_first_metrics,actionable_model_scope,duplicate_request_policy,galaxy_sample_policy,tier_policy,odds_source_policy,league_coverage_registry:(if (.league_coverage_registry|type)=="object" then {schema_version:.league_coverage_registry.schema_version,generated_at_local:.league_coverage_registry.generated_at_local,scope:.league_coverage_registry.scope,provider_calls_per_league:.league_coverage_registry.provider_calls_per_league,galaxy_activation_is_eligibility_gate:.league_coverage_registry.galaxy_activation_is_eligibility_gate,competition_count:.league_coverage_registry.competition_count,data_tier_counts:.league_coverage_registry.data_tier_counts,pregame_data_eligible_fixture_count:.league_coverage_registry.pregame_data_eligible_fixture_count,errors:.league_coverage_registry.errors} else .league_coverage_registry end),presentation_contract,coverage_registry_policy,match_table_rows,research_report,research_report_count_this_tick,research_completed_count_this_tick,research_insufficient_data_count_this_tick,research_policy,daily_research,daily_research_count_this_tick,daily_research_horizon_hours,galaxy_builder,galaxy_builder_candidate_count_this_tick,galaxy_builder_policy,galaxy_builder_actionable_scope,match_intelligence_schema_version,match_intelligence_event_count_this_tick,referee_assignment_verified_count_this_tick,coach_pair_verified_count_this_tick,card_market_groups_this_tick,card_market_quotes_this_tick,cards_probability_model_status,match_intelligence_policy,v39_provider_requests_added,v39_model_weights_changed,v39_canonical_bet_logic_changed,xg_xga_intelligence,v343_xg_xga_checkpoint,npxg_npxga_intelligence,v344_npxg_npxga_checkpoint,ppda_intelligence,v345_ppda_checkpoint,field_tilt_intelligence,v346_field_tilt_checkpoint,box_entries_intelligence,v347_box_entries_checkpoint,big_chances_intelligence,v348_big_chances_checkpoint,set_piece_intelligence,v349_set_piece_checkpoint,tactical_style_intelligence,rest_intelligence,congestion_intelligence,travel_intelligence,weather_intelligence,competition_context_intelligence,v350_tactical_style_checkpoint,rest_intelligence,v351_rest_checkpoint,congestion_intelligence,v352_congestion_checkpoint,travel_intelligence,v353_travel_checkpoint,weather_intelligence,v354_weather_checkpoint,competition_context_intelligence,v355_competition_context_checkpoint,galaxy_joint_intelligence,v356_galaxy_joint_checkpoint,odds_catalog_audit,v357_provider_requests_added,v357_model_weights_changed,v357_canonical_bet_logic_changed,v357_odds_catalog_checkpoint,bookmaker_catalog_audit,primary_bookmaker_policy,v358_provider_requests_added,v358_model_weights_changed,v358_canonical_bet_logic_changed,v358_bookmaker_checkpoint,manual_price_check_count,manual_price_check_ready_count,manual_price_check_candidates,v3581_provider_requests_added,v3581_model_weights_changed,v3581_canonical_bet_logic_changed,v3581_manual_price_checkpoint,quota,database_persisted,events:[.events[]|{event_type,stage,classification,tier,stake_units,bet_eligible,availability_confidence,fixture,coverage:(if (.coverage|type)=="object" then {data_tier:.coverage.data_tier} else .coverage end),sporting_shortlist,sporting_screen_initial,sporting_screen_refined,galaxy_source,market_source,market_provenance,trend_context,player_trends_research,postgame_player_stats,closing_market_snapshot,derivative_research_market_snapshot:(if (.derivative_research_market_snapshot|type)=="object" then {schema_version:.derivative_research_market_snapshot.schema_version,captured_at_local:.derivative_research_market_snapshot.captured_at_local,research_only:.derivative_research_market_snapshot.research_only,actionable:.derivative_research_market_snapshot.actionable,policy:.derivative_research_market_snapshot.policy,group_count:.derivative_research_market_snapshot.group_count,quote_count:.derivative_research_market_snapshot.quote_count,contains_corner_markets:.derivative_research_market_snapshot.contains_corner_markets,groups:[.derivative_research_market_snapshot.groups[]?|{family,bookmaker,market,provider_update,value_count:(.values|length)}]} else .derivative_research_market_snapshot end),match_intelligence:(if (.match_intelligence|type)=="object" then {schema_version:.match_intelligence.schema_version,fixture_id:.match_intelligence.fixture_id,kickoff:.match_intelligence.kickoff,match:.match_intelligence.match,stage:.match_intelligence.stage,data_tier:.match_intelligence.data_tier,bet_tier:.match_intelligence.bet_tier,classification:.match_intelligence.classification,availability_confidence:.match_intelligence.availability_confidence,sport_first:.match_intelligence.sport_first,coverage_gaps:.match_intelligence.coverage_gaps,policy:.match_intelligence.policy,areas:(((.match_intelligence.areas // {})|with_entries(.value=(if (.value|type)=="object" then (.value|{status,actionable,decision_weight,production_status}) else .value end)))+{side_control:.match_intelligence.areas.side_control,goals_full_match:(if (.match_intelligence.areas.goals_full_match|type)=="object" then {status:.match_intelligence.areas.goals_full_match.status,home_lambda:.match_intelligence.areas.goals_full_match.home_lambda,away_lambda:.match_intelligence.areas.goals_full_match.away_lambda,total_lambda:.match_intelligence.areas.goals_full_match.total_lambda,over_2_5_prob:.match_intelligence.areas.goals_full_match.over_2_5_prob,goal_environment_score:.match_intelligence.areas.goals_full_match.goal_environment_score,scoring_path:.match_intelligence.areas.goals_full_match.scoring_path,canonical_projection_model:.match_intelligence.areas.goals_full_match.canonical_projection_model,observed_total_market_ladder:((.match_intelligence.areas.goals_full_match.observed_total_market_ladder // [])[0:8]),remaining_model_gaps:.match_intelligence.areas.goals_full_match.remaining_model_gaps} else .match_intelligence.areas.goals_full_match end),btts:(if (.match_intelligence.areas.btts|type)=="object" then {status:.match_intelligence.areas.btts.status,p_yes:.match_intelligence.areas.btts.p_yes,p_no:.match_intelligence.areas.btts.p_no,observed_market_rows:((.match_intelligence.areas.btts.observed_market_rows // [])[0:6]),actionable:.match_intelligence.areas.btts.actionable,decision_weight:.match_intelligence.areas.btts.decision_weight,production_status:.match_intelligence.areas.btts.production_status} else .match_intelligence.areas.btts end),one_x_two:(if (.match_intelligence.areas.one_x_two|type)=="object" then {status:.match_intelligence.areas.one_x_two.status,canonical:.match_intelligence.areas.one_x_two.canonical,observed_market_rows:((.match_intelligence.areas.one_x_two.observed_market_rows // [])[0:6]),actionable:.match_intelligence.areas.one_x_two.actionable,decision_weight:.match_intelligence.areas.one_x_two.decision_weight,production_status:.match_intelligence.areas.one_x_two.production_status} else .match_intelligence.areas.one_x_two end),double_chance:(if (.match_intelligence.areas.double_chance|type)=="object" then {status:.match_intelligence.areas.double_chance.status,probabilities:.match_intelligence.areas.double_chance.probabilities,observed_market_rows:((.match_intelligence.areas.double_chance.observed_market_rows // [])[0:6]),actionable:.match_intelligence.areas.double_chance.actionable,decision_weight:.match_intelligence.areas.double_chance.decision_weight,production_status:.match_intelligence.areas.double_chance.production_status} else .match_intelligence.areas.double_chance end),team_goals:(if (.match_intelligence.areas.team_goals|type)=="object" then {status:.match_intelligence.areas.team_goals.status,home_lambda:.match_intelligence.areas.team_goals.home_lambda,away_lambda:.match_intelligence.areas.team_goals.away_lambda,observed_exact_market_rows:((.match_intelligence.areas.team_goals.observed_exact_market_rows // [])[0:6]),actionable:.match_intelligence.areas.team_goals.actionable,decision_weight:.match_intelligence.areas.team_goals.decision_weight,production_status:.match_intelligence.areas.team_goals.production_status} else .match_intelligence.areas.team_goals end),lineups_formations:.match_intelligence.areas.lineups_formations,goalkeepers:.match_intelligence.areas.goalkeepers,goalkeeper:.match_intelligence.areas.goalkeeper,formations:.match_intelligence.areas.formations,coaches:.match_intelligence.areas.coaches,referee:.match_intelligence.areas.referee,injuries:.match_intelligence.areas.injuries,injuries_suspensions:.match_intelligence.areas.injuries_suspensions,competition_context:.match_intelligence.areas.competition_context,weather:.match_intelligence.areas.weather})} else .match_intelligence end),postgame_xg_observation,xg_xga_intelligence,npxg_npxga_intelligence,ppda_intelligence,field_tilt_intelligence,box_entries_intelligence,postgame_big_chances_observation,big_chances_intelligence,postgame_set_piece_observation,set_piece_intelligence,tactical_style_intelligence,rest_intelligence,congestion_intelligence,travel_intelligence,weather_intelligence,competition_context_intelligence,lineups:(if (.lineups|type)=="object" then {lineup_state:.lineups.lineup_state,both_xi_confirmed:.lineups.both_xi_confirmed,both_goalkeepers_confirmed:.lineups.both_goalkeepers_confirmed,teams:[.lineups.teams[]?|{team_id,team,formation,coach_id,coach,goalkeepers,starter_count:(.starters|length),substitutes_count}]} else .lineups end),raw_projection:(if (.raw_projection|type)=="object" then {status:.raw_projection.status,projection_model:.raw_projection.projection_model,sport_source:.raw_projection.sport_source,market_independent:.raw_projection.market_independent,advanced_metrics:.raw_projection.advanced_metrics,galaxy_contract_version:.raw_projection.galaxy_contract_version,galaxy_model_versions:.raw_projection.galaxy_model_versions,galaxy_data_cutoff:.raw_projection.galaxy_data_cutoff,galaxy_actionable_total_model:.raw_projection.galaxy_actionable_total_model,galaxy_actionable_reason:.raw_projection.galaxy_actionable_reason,raw_home_goal_rate:.raw_projection.raw_home_goal_rate,raw_away_goal_rate:.raw_projection.raw_away_goal_rate,raw_total_goals:.raw_projection.raw_total_goals,raw_home_win_prob:.raw_projection.raw_home_win_prob,raw_draw_prob:.raw_projection.raw_draw_prob,raw_away_win_prob:.raw_projection.raw_away_win_prob,raw_btts_yes_prob:.raw_projection.raw_btts_yes_prob,raw_over_2_5_prob:.raw_projection.raw_over_2_5_prob,scoring_path:.raw_projection.scoring_path,screen_scores:.raw_projection.screen_scores,relative_strength_shadow:.raw_projection.relative_strength_shadow} else .raw_projection end),market_decision:(if (.market_decision|type)=="object" then {status:.market_decision.status,reason:.market_decision.reason,first_half_markets_ignored:.market_decision.first_half_markets_ignored,first_half_reason:.market_decision.first_half_reason,period_markets_ignored:.market_decision.period_markets_ignored,period_market_reason:.market_decision.period_market_reason,btts_market_mode:.market_decision.btts_market_mode,galaxy_publication_gate_downgraded:.market_decision.galaxy_publication_gate_downgraded,galaxy_sample_gate_substitutions:.market_decision.galaxy_sample_gate_substitutions} else .market_decision end),best_market,notes,result,error}]}' /tmp/soccer_tick.json > /tmp/soccer_compact.json
          jq -e . /tmp/soccer_compact.json >/dev/null
      - name: Persist scheduler state
        if: steps.quota_guard.outputs.skip != 'true' && steps.tick.outputs.event_count != '0'
        shell: bash
        env: {RUN_DATE: "${{ steps.tick.outputs.run_date }}"}
        run: |
          set -euo pipefail
          mkdir -p soccer_edge_state/history
          cp /tmp/soccer_compact.json soccer_edge_state/latest.json
          jq -c '.' /tmp/soccer_compact.json >> "soccer_edge_state/history/${RUN_DATE}.jsonl"
          jq '.shortlist_state // {}' /tmp/soccer_tick.json > soccer_edge_state/shortlist_state.json
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          latest = json.load(open("/tmp/soccer_compact.json", encoding="utf-8"))
          state_path = Path("soccer_edge_state/pending_opportunities.json")
          now = datetime.fromisoformat(latest["generated_at_local"])

          def dt(value):
              try:
                  return datetime.fromisoformat(value) if value else None
              except Exception:
                  return None

          def num(value):
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return None

          previous = {}
          if state_path.exists():
              try:
                  old = json.load(open(state_path, encoding="utf-8"))
                  rows = old.get("opportunities", []) if isinstance(old, dict) else []
                  for row in rows:
                      ko = dt(((row.get("fixture") or {}).get("kickoff")))
                      if ko and ko > now and row.get("key"):
                          previous[row["key"]] = row
              except Exception:
                  previous = {}

          current = {}
          for event in latest.get("events") or []:
              fixture = event.get("fixture") or {}
              fixture_id = fixture.get("fixture_id")
              kickoff = dt(fixture.get("kickoff"))
              if not fixture_id or not kickoff or kickoff <= now:
                  continue

              shortlist = event.get("sporting_shortlist") or {}
              raw = event.get("raw_projection") or {}
              best = event.get("best_market") or {}
              availability = num(event.get("availability_confidence"))
              rank = num(shortlist.get("rank"))
              two_way = num(shortlist.get("two_way_scoring_score"))
              goals_env = num(shortlist.get("goal_environment_score"))
              tracks = set(shortlist.get("tracks") or [])
              over25 = num(raw.get("raw_over_2_5_prob"))
              home = num(raw.get("raw_home_win_prob"))
              draw = num(raw.get("raw_draw_prob"))
              away = num(raw.get("raw_away_win_prob"))

              strong_sport = bool(shortlist.get("shortlisted")) and (
                  (rank is not None and rank >= 80.0)
                  or (two_way is not None and two_way >= 80.0)
                  or (goals_env is not None and goals_env >= 75.0)
                  or ("GOALS_OVER" in tracks and over25 is not None and over25 >= 0.60)
                  or ("GOALS_UNDER" in tracks and over25 is not None and (1.0 - over25) >= 0.60)
                  or ("SIDE" in tracks and max([p for p in (home, draw, away) if p is not None] or [0.0]) >= 0.60)
              )
              if strong_sport:
                  key = f"sport:{fixture_id}"
                  current[key] = {
                      "key": key,
                      "signal_type": "PRE_MARKET_WATCH",
                      "first_seen_at": (previous.get(key) or {}).get("first_seen_at", latest["generated_at_local"]),
                      "last_seen_at": latest["generated_at_local"],
                      "fixture": fixture,
                      "stage": event.get("stage"),
                      "classification": event.get("classification"),
                      "availability_confidence": event.get("availability_confidence"),
                      "sporting_shortlist": shortlist,
                      "raw_projection": raw,
                      "market_provenance": event.get("market_provenance"),
                      "notes": event.get("notes") or [],
                  }

              edge = num(best.get("prob_edge_pp"))
              tier = best.get("tier")
              market_fresh = bool(best.get("quote_fresh")) or bool((event.get("market_provenance") or {}).get("fresh"))
              if best and edge is not None and edge >= 3.0:
                  family = best.get("family")
                  selection = best.get("selection")
                  line = best.get("line")
                  key = f"market:{fixture_id}:{family}:{selection}:{line}"
                  if event.get("classification") in {"BET", "LEAN"} and market_fresh and (availability or 0.0) >= 0.85:
                      signal_type = "ACTION_NOW"
                  elif tier in {"A", "S"} or edge >= 5.0:
                      signal_type = "MARKET_CHECK_NEEDED"
                  else:
                      signal_type = "WATCH_EDGE"
                  current[key] = {
                      "key": key,
                      "signal_type": signal_type,
                      "first_seen_at": (previous.get(key) or {}).get("first_seen_at", latest["generated_at_local"]),
                      "last_seen_at": latest["generated_at_local"],
                      "fixture": fixture,
                      "stage": event.get("stage"),
                      "classification": event.get("classification"),
                      "availability_confidence": event.get("availability_confidence"),
                      "sporting_shortlist": shortlist,
                      "raw_projection": raw,
                      "market_provenance": event.get("market_provenance"),
                      "best_market": best,
                      "notes": event.get("notes") or [],
                  }

          merged = dict(previous)
          merged.update(current)
          opportunities = sorted(
              merged.values(),
              key=lambda row: (
                  ((row.get("fixture") or {}).get("kickoff") or ""),
                  row.get("signal_type") or "",
                  row.get("key") or "",
              ),
          )[:100]
          payload = {
              "schema_version": "1.0.0",
              "generated_at_local": latest["generated_at_local"],
              "version": latest.get("version"),
              "opportunity_count": len(opportunities),
              "opportunities": opportunities,
          }
          state_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          rm -f soccer_edge_state/last_error.json soccer_edge_state/quota_block_until.txt
          git config user.name soccer-edge-bot; git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/pending_opportunities.json
          git add -A soccer_edge_state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Soccer Edge tick ${RUN_DATE}"
          git push origin HEAD:soccer-edge-state
