name: Soccer Edge Scheduler
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/soccer-edge-scheduler.yml"]
concurrency: {group: soccer-edge-scheduler, cancel-in-progress: false}
permissions: {contents: write, issues: write, id-token: write}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout state branch
        uses: actions/checkout@v4
        with: {ref: soccer-edge-state, fetch-depth: 0}

      - name: API quota circuit breaker
        id: quota_guard
        shell: bash
        run: |
          set -euo pipefail
          SKIP=false
          if [ -f soccer_edge_state/quota_block_until.txt ]; then
            BLOCK_UNTIL=$(cat soccer_edge_state/quota_block_until.txt || echo 0)
            NOW=$(date -u +%s)
            if [ "$NOW" -lt "$BLOCK_UNTIL" ]; then SKIP=true; fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Warm Render before OIDC
        if: steps.quota_guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 360 --retry 2 --retry-delay 5 --retry-all-errors \
            https://soccer-edge-api.onrender.com/health >/tmp/soccer_render_health.json || true
          cat /tmp/soccer_render_health.json || true

      - name: Run Soccer Edge tick
        if: steps.quota_guard.outputs.skip != 'true'
        id: tick
        shell: bash
        run: |
          set -euo pipefail

          get_oidc_token() {
            local response token
            response=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
            token=$(echo "$response" | jq -r '.value')
            test -n "$token" && test "$token" != "null"
            printf '%s' "$token"
          }

          post_tick() {
            local token="$1"
            curl -sS --max-time 430 -o /tmp/soccer_tick.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" \
              https://soccer-edge-api.onrender.com/internal/tick
          }

          OIDC_TOKEN=$(get_oidc_token)
          HTTP_CODE=$(post_tick "$OIDC_TOKEN")

          if [ "$HTTP_CODE" = "401" ] && jq -e '(.detail // "") | test("Signature has expired"; "i")' /tmp/soccer_tick.json >/dev/null; then
            echo "::warning::OIDC token expired during Render wake/tick; retrying once with a fresh token"
            OIDC_TOKEN=$(get_oidc_token)
            HTTP_CODE=$(post_tick "$OIDC_TOKEN")
          fi

          jq '{service,version,model_version,generated_at_local,event_count,due_fixture_count,fixture_scan_count,api_calls_this_tick,last_daily_remaining,database_persisted,error,detail}' /tmp/soccer_tick.json || true

          if [ "$HTTP_CODE" -ne 200 ]; then
            mkdir -p soccer_edge_state
            jq --arg http_code "$HTTP_CODE" '{captured_at: now|todateiso8601,http_code:$http_code,response:.}' /tmp/soccer_tick.json > soccer_edge_state/last_error.json
            if jq -e '(.detail // "") | test("request limit for the day"; "i")' /tmp/soccer_tick.json >/dev/null; then
              date -u -d 'tomorrow 00:05:00' +%s > soccer_edge_state/quota_block_until.txt
            fi
            git config user.name soccer-edge-bot
            git config user.email soccer-edge-bot@users.noreply.github.com
            git add -f soccer_edge_state/last_error.json
            if [ -f soccer_edge_state/quota_block_until.txt ]; then git add -f soccer_edge_state/quota_block_until.txt; fi
            if ! git diff --cached --quiet; then
              git commit -m "Soccer Edge scheduler error"
              for attempt in 1 2 3; do
                git fetch origin soccer-edge-state
                git rebase origin/soccer-edge-state
                if git push origin HEAD:soccer-edge-state; then exit 1; fi
                sleep $((attempt * 2))
              done
            fi
            exit 1
          fi

          echo "event_count=$(jq -r '.event_count // 0' /tmp/soccer_tick.json)" >> "$GITHUB_OUTPUT"
          echo "run_date=$(jq -r '.generated_at_local[0:10]' /tmp/soccer_tick.json)" >> "$GITHUB_OUTPUT"

      - name: Persist scheduler state
        if: steps.quota_guard.outputs.skip != 'true'
        shell: bash
        env: {RUN_DATE: "${{ steps.tick.outputs.run_date }}"}
        run: |
          set -euo pipefail
          mkdir -p soccer_edge_state/history

          jq '{
            status:"ok",
            service,
            version,
            model_version,
            generated_at_utc,
            generated_at_local,
            timezone,
            fixture_scan_count,
            due_fixture_count,
            event_count,
            actionable_refresh_count,
            bet_candidate_count,
            api_calls_this_tick,
            last_daily_remaining,
            daily_budget_mode,
            database_persisted
          }' /tmp/soccer_tick.json > soccer_edge_state/health.json

          cp /tmp/soccer_tick.json soccer_edge_state/latest.json
          jq -c '.' /tmp/soccer_tick.json >> "soccer_edge_state/history/${RUN_DATE}.jsonl"
          jq '.shortlist_state // {}' /tmp/soccer_tick.json > soccer_edge_state/shortlist_state.json
          rm -f soccer_edge_state/last_error.json soccer_edge_state/quota_block_until.txt

          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -A soccer_edge_state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Soccer Edge tick ${RUN_DATE}"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            echo "Concurrent soccer-edge-state update detected; retrying push (attempt $attempt/3)"
            sleep $((attempt * 2))
          done
          echo "Failed to persist scheduler state after 3 retries"
          exit 1

      - name: Deliver compact live alerts
        if: steps.quota_guard.outputs.skip != 'true' && steps.tick.outputs.event_count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOCCER_ALERT_WEBHOOK_URL: ${{ secrets.SOCCER_ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          tick = json.load(open('/tmp/soccer_tick.json', encoding='utf-8'))
          rows = tick.get('match_table_rows') or []
          actionable = [r for r in rows if str(r.get('classification') or '').upper() in {'BET','LEAN','WATCH'}]
          Path('/tmp/soccer_alert_count').write_text(str(len(actionable)))
          if not actionable:
              raise SystemExit(0)

          lines = [
              '@Baahl11',
              '',
              f"### ⚽ Soccer Edge {tick.get('generated_at_local')} — {tick.get('version')}",
              '',
          ]
          for row in actionable[:8]:
              home = row.get('home') or '?'
              away = row.get('away') or '?'
              market = row.get('market') or 'N/V'
              selection = row.get('selection') or 'N/V'
              line = row.get('line')
              price = row.get('price') or 'N/V'
              cls = row.get('classification') or 'N/V'
              reason = row.get('reason') or 'N/V'
              market_text = f"{market} — {selection}"
              if line is not None:
                  market_text += f" {line}"
              lines += [
                  f"- **{cls}** {home} vs {away} | {row.get('kickoff','N/V')} | {market_text} | price {price} | {reason}"
              ]
          body = '\n'.join(lines) + '\n'
          Path('/tmp/soccer_alert_body.md').write_text(body, encoding='utf-8')
          Path('/tmp/soccer_alert_webhook.json').write_text(json.dumps({
              'source': 'soccer-edge-scheduler',
              'generated_at_local': tick.get('generated_at_local'),
              'alert_count': len(actionable),
              'message': body,
              'rows': actionable[:8],
          }, ensure_ascii=False), encoding='utf-8')
          PY

          ALERT_COUNT=$(cat /tmp/soccer_alert_count)
          if [ "$ALERT_COUNT" = "0" ]; then exit 0; fi

          ISSUE_NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Soccer Edge Live Alerts" in:title' --json number,title --jq '.[] | select(.title=="⚽ Soccer Edge Live Alerts") | .number' | head -n1)
          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_URL=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "⚽ Soccer Edge Live Alerts" --body "Canal automático de alertas del Soccer Edge Scheduler.")
            ISSUE_NUMBER="${ISSUE_URL##*/}"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/soccer_alert_body.md

          if [ -n "${SOCCER_ALERT_WEBHOOK_URL:-}" ]; then
            curl -fsS -X POST -H "Content-Type: application/json" --data-binary @/tmp/soccer_alert_webhook.json "$SOCCER_ALERT_WEBHOOK_URL" || echo "::warning::Optional alert webhook delivery failed"
          fi
