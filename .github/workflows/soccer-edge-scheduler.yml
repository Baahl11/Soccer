# v124 strict Team Totals diversity capture live tick: 2026-09-24 21:45 CDMX
# v124 LIVE runtime Team Totals diversity tick: 2026-09-24 21:38 CDMX
# v124 post-deploy Team Totals diversity validation: 2026-09-24 21:35 CDMX
# v124 Team Totals fixture-diversity live validation: 2026-09-24 21:34 CDMX
# v123 strict FT Team Totals validation after checkpoint fix: 2026-09-24 21:07 CDMX
# Team Totals strict FT 16-17 live validation: 2026-09-24 20:46 CDMX
# Team Totals leftover-odds live validation: 2026-09-24 20:36 CDMX
name: Soccer Edge Scheduler - Phase 24 Dashboard Validation
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/soccer-edge-scheduler.yml"]
concurrency: {group: soccer-edge-scheduler, cancel-in-progress: false}
permissions: {contents: write, issues: write, id-token: write}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout state branch
        uses: actions/checkout@v4
        with: {ref: soccer-edge-state, fetch-depth: 1}

      - name: API quota circuit breaker
        id: quota_guard
        shell: bash
        run: |
          set -euo pipefail
          SKIP=false
          if [ -f soccer_edge_state/quota_block_until.txt ]; then
            BLOCK_UNTIL=$(cat soccer_edge_state/quota_block_until.txt || echo 0)
            NOW=$(date -u +%s)
            if [ "$NOW" -lt "$BLOCK_UNTIL" ]; then SKIP=true; fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Manual validation marker
        if: github.event_name == 'push'
        run: echo "Phase16 existing-price calibration live validation run"

      - name: Warm Render before OIDC
        if: steps.quota_guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 360 --retry 2 --retry-delay 5 --retry-all-errors \
            https://soccer-edge-api.onrender.com/health >/tmp/soccer_render_health.json || true
          cat /tmp/soccer_render_health.json || true

      - name: Run Soccer Edge tick
        if: steps.quota_guard.outputs.skip != 'true'
        id: tick
        shell: bash
        run: |
          set -euo pipefail

          get_oidc_token() {
            local response token
            response=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
            token=$(echo "$response" | jq -r '.value // empty')
            test -n "$token"
            printf '%s' "$token"
          }

          post_tick() {
            local token="$1"
            curl -sS --max-time 430 -o /tmp/soccer_tick.json -w "%{http_code}" \
              -X POST \
              -H "Authorization: Bearer ${token}" \
              -H "Content-Type: application/json" \
              https://soccer-edge-api.onrender.com/internal/tick
          }

          OIDC_TOKEN=$(get_oidc_token)
          if [ -z "$OIDC_TOKEN" ]; then
            echo "::error::GitHub OIDC token acquisition returned empty output"
            exit 1
          fi
          echo "::add-mask::$OIDC_TOKEN"
          HTTP_CODE=$(post_tick "$OIDC_TOKEN")

          if [ "$HTTP_CODE" = "401" ] && jq -e '(.detail // "") | test("Signature has expired"; "i")' /tmp/soccer_tick.json >/dev/null; then
            echo "::warning::OIDC token expired during Render wake/tick; retrying once with a fresh token"
            OIDC_TOKEN=$(get_oidc_token)
            echo "::add-mask::$OIDC_TOKEN"
            HTTP_CODE=$(post_tick "$OIDC_TOKEN")
          fi

          jq '{service,version,model_version,generated_at_local,event_count,due_fixture_count,fixture_scan_count,api_calls_this_tick,last_daily_remaining,database_persisted,database_error,error,detail}' /tmp/soccer_tick.json || true

          if [ "$HTTP_CODE" -ne 200 ]; then
            mkdir -p soccer_edge_state
            jq --arg http_code "$HTTP_CODE" '{captured_at: now|todateiso8601,http_code:$http_code,response:.}' /tmp/soccer_tick.json > soccer_edge_state/last_error.json
            if jq -e '(.detail // "") | test("request limit for the day"; "i")' /tmp/soccer_tick.json >/dev/null; then
              date -u -d 'tomorrow 00:05:00' +%s > soccer_edge_state/quota_block_until.txt
            fi
            git config user.name soccer-edge-bot
            git config user.email soccer-edge-bot@users.noreply.github.com
            git add -f soccer_edge_state/last_error.json
            if [ -f soccer_edge_state/quota_block_until.txt ]; then git add -f soccer_edge_state/quota_block_until.txt; fi
            if ! git diff --cached --quiet; then
              git commit -m "Soccer Edge scheduler error"
              for attempt in 1 2 3; do
                git fetch origin soccer-edge-state
                git rebase origin/soccer-edge-state
                if git push origin HEAD:soccer-edge-state; then exit 1; fi
                sleep $((attempt * 2))
              done
            fi
            exit 1
          fi

          echo "event_count=$(jq -r '.event_count // 0' /tmp/soccer_tick.json)" >> "$GITHUB_OUTPUT"
          echo "run_date=$(jq -r '.generated_at_local[0:10]' /tmp/soccer_tick.json)" >> "$GITHUB_OUTPUT"

      - name: Persist scheduler state
        if: steps.quota_guard.outputs.skip != 'true'
        shell: bash
        env: {RUN_DATE: "${{ steps.tick.outputs.run_date }}"}
        run: |
          set -euo pipefail
          mkdir -p soccer_edge_state/history

          jq '{
            status:"ok",
            service,
            version,
            model_version,
            generated_at_utc,
            generated_at_local,
            timezone,
            fixture_scan_count,
            due_fixture_count,
            event_count,
            actionable_refresh_count,
            bet_candidate_count,
            api_calls_this_tick,
            last_daily_remaining,
            daily_budget_mode,
            database_persisted,
            database_error
          }' /tmp/soccer_tick.json > soccer_edge_state/health.json

          # latest.json is intentionally compact. The full tick is already durable in
          # Postgres/history; keeping a multi-MB duplicate here makes GitHub content
          # retrieval appear empty/truncated and bloats the state branch.
          jq '{
            schema_version:"4.0.0",
            status:"ok",
            service,
            version,
            model_version,
            generated_at_utc,
            generated_at_local,
            timezone,
            fixture_scan_count,
            due_fixture_count,
            event_count,
            actionable_refresh_count,
            bet_candidate_count,
            api_calls_this_tick,
            max_api_calls_per_tick,
            effective_max_api_calls_per_tick,
            last_daily_remaining,
            daily_budget_mode,
            database_persisted,
            database_error,
            deep_dive_processed_count,
            deferred_due_to_budget,
            deferred_due_to_priority,
            research_visible_count,
            match_table_rows:(.match_table_rows // []),
            research_visibility:(.research_visibility // {}),
            decision_separation:(.decision_separation // {}),
            price_resolution_v4:(.price_resolution_v4 // {}),
            price_resolution_checkpoint:(.price_resolution_checkpoint // {}),
            v4_005_score_matrix_observability:(.v4_005_score_matrix_observability // {}),
            elastic_deep_dive_cap,
            elastic_deep_dive_cap_reason,
            elastic_request_cap,
            elastic_request_cap_reason,
            elastic_quota_remaining_basis,
            fair_scheduler:(.fair_scheduler // {}),
            v4_006_fair_scheduler:(.v4_006_fair_scheduler // {}),
            fair_scheduler_seed_imported,
            v4_007_feature_snapshot_schema:(.v4_007_feature_snapshot_schema // {}),
            v4_008_reproducible_training_dataset:(.v4_008_reproducible_training_dataset // {}),
            v4_009_dixon_coles_baseline:(.v4_009_dixon_coles_baseline // {}),
            v4_010_bivariate_poisson_baseline:(.v4_010_bivariate_poisson_baseline // {}),
            v4_011_lightgbm_goals_challenger:(.v4_011_lightgbm_goals_challenger // {}),
            v4_012_ensemble_v1:(.v4_012_ensemble_v1 // {}),
            v4_013_calibration_engine_v1:(.v4_013_calibration_engine_v1 // {}),
            v4_014_model_disagreement_engine:(.v4_014_model_disagreement_engine // {}),
            v4_015_confidence_engine_v1:(.v4_015_confidence_engine_v1 // {}),
            v4_016_ft_totals_production_validation:(.v4_016_ft_totals_production_validation // {}),
            v4_017_1x2_calibration_validation:(.v4_017_1x2_calibration_validation // {}),
            v4_018_btts_calibration_validation:(.v4_018_btts_calibration_validation // {}),
            v4_019_team_totals_oos_validation:(.v4_019_team_totals_oos_validation // {}),
            v4_020_1h_oos_validation:(.v4_020_1h_oos_validation // {}),
            v4_021_2h_oos_validation:(.v4_021_2h_oos_validation // {}),
            v4_022_corners_oos_validation:(.v4_022_corners_oos_validation // {}),
            phase14_cards_referee_validation:(.phase14_cards_referee_validation // {}),
            phase15_player_props_validation:(.phase15_player_props_validation // {}),
            phase16_market_mismatch_finder:(.phase16_market_mismatch_finder // {}),
            phase17_clv_engine:(.phase17_clv_engine // {}),
            phase18_oos_backtest_framework:(.phase18_oos_backtest_framework // {}),
            phase19_promotion_framework:(.phase19_promotion_framework // {}),
            phase20_bankroll_risk_engine:(.phase20_bankroll_risk_engine // {}),
            phase21_alert_engine:(.phase21_alert_engine // {}),
            phase22_live_inplay_engine:(.phase22_live_inplay_engine // {}),
            phase23_mlops_model_registry:(.phase23_mlops_model_registry // {}),
            phase24_final_product_experience:(.phase24_final_product_experience // {}),
            dashboard_views:(.dashboard_views // {}),
            phase21_alert_audit_rows:(.phase21_alert_audit_rows // []),
            market_mismatch_rows:(.market_mismatch_rows // []),
            market_mismatch_correlated_suppressed:(.market_mismatch_correlated_suppressed // []),
            latest_payload_policy:"COMPACT_OPERATIONAL_VIEW_FULL_TICK_IN_POSTGRES_COMPACT_HISTORY_IN_GIT"
          }' /tmp/soccer_tick.json > soccer_edge_state/latest.json
          jq -e '.generated_at_utc and (.fixture_scan_count != null) and (.database_persisted != null) and (.v4_005_score_matrix_observability | type == "object") and (.v4_006_fair_scheduler | type == "object") and (.v4_007_feature_snapshot_schema | type == "object") and (.v4_008_reproducible_training_dataset | type == "object") and (.v4_009_dixon_coles_baseline | type == "object") and (.v4_010_bivariate_poisson_baseline | type == "object") and (.v4_011_lightgbm_goals_challenger | type == "object") and (.v4_012_ensemble_v1 | type == "object") and (.v4_013_calibration_engine_v1 | type == "object") and (.v4_014_model_disagreement_engine | type == "object") and (.v4_015_confidence_engine_v1 | type == "object") and (.v4_016_ft_totals_production_validation | type == "object") and (.v4_017_1x2_calibration_validation | type == "object") and (.v4_018_btts_calibration_validation | type == "object") and (.v4_019_team_totals_oos_validation | type == "object") and (.v4_020_1h_oos_validation | type == "object") and (.v4_021_2h_oos_validation | type == "object") and (.v4_022_corners_oos_validation | type == "object") and (.phase14_cards_referee_validation | type == "object") and (.phase15_player_props_validation | type == "object") and (.phase16_market_mismatch_finder | type == "object") and (.phase17_clv_engine | type == "object") and (.phase18_oos_backtest_framework | type == "object") and (.phase19_promotion_framework | type == "object") and (.phase20_bankroll_risk_engine | type == "object") and (.phase21_alert_engine | type == "object") and (.phase22_live_inplay_engine | type == "object") and (.phase23_mlops_model_registry | type == "object") and (.phase24_final_product_experience | type == "object") and (.dashboard_views | type == "object") and (.phase21_alert_audit_rows | type == "array") and (.market_mismatch_rows | type == "array") and (.price_resolution_v4 | type == "object")' soccer_edge_state/latest.json >/dev/null
          test -s soccer_edge_state/latest.json
          # Git history is an operational audit trail, not the canonical full-tick store.
          # Full payloads are durable in Postgres. Keep one compact record per tick so a
          # busy slate cannot hit GitHub's 100 MB single-file limit.
          HISTORY_FILE="soccer_edge_state/history/${RUN_DATE}.jsonl"
          if [ -f "$HISTORY_FILE" ] && [ "$(wc -c < "$HISTORY_FILE")" -gt 90000000 ]; then
            mv "$HISTORY_FILE" "${HISTORY_FILE%.jsonl}-legacy-overflow.jsonl"
          fi
          jq -c '{schema_version:"2.1.0",generated_at_utc,generated_at_local,version,model_version,fixture_scan_count,due_fixture_count,event_count,actionable_refresh_count,bet_candidate_count,api_calls_this_tick,max_api_calls_per_tick,last_daily_remaining,daily_budget_mode,database_persisted,deep_dive_processed_count,deferred_due_to_budget,deferred_due_to_priority,elastic_deep_dive_cap,elastic_deep_dive_cap_reason,elastic_request_cap,elastic_request_cap_reason,elastic_quota_remaining_basis,fair_scheduler:(.fair_scheduler // {}),v4_006_fair_scheduler:(.v4_006_fair_scheduler // {}),v4_007_feature_snapshot_schema:(.v4_007_feature_snapshot_schema // {}),v4_008_reproducible_training_dataset:(.v4_008_reproducible_training_dataset // {}),v4_009_dixon_coles_baseline:(.v4_009_dixon_coles_baseline // {}),v4_010_bivariate_poisson_baseline:(.v4_010_bivariate_poisson_baseline // {}),v4_011_lightgbm_goals_challenger:(.v4_011_lightgbm_goals_challenger // {}),v4_012_ensemble_v1:(.v4_012_ensemble_v1 // {}),v4_013_calibration_engine_v1:(.v4_013_calibration_engine_v1 // {}),v4_014_model_disagreement_engine:(.v4_014_model_disagreement_engine // {}),v4_015_confidence_engine_v1:(.v4_015_confidence_engine_v1 // {}),v4_016_ft_totals_production_validation:(.v4_016_ft_totals_production_validation // {}),v4_017_1x2_calibration_validation:(.v4_017_1x2_calibration_validation // {}),v4_018_btts_calibration_validation:(.v4_018_btts_calibration_validation // {}),v4_019_team_totals_oos_validation:(.v4_019_team_totals_oos_validation // {}),v4_020_1h_oos_validation:(.v4_020_1h_oos_validation // {}),v4_021_2h_oos_validation:(.v4_021_2h_oos_validation // {}),v4_022_corners_oos_validation:(.v4_022_corners_oos_validation // {}),phase14_cards_referee_validation:(.phase14_cards_referee_validation // {}),phase15_player_props_validation:(.phase15_player_props_validation // {}),phase16_market_mismatch_finder:(.phase16_market_mismatch_finder // {}),phase17_clv_engine:(.phase17_clv_engine // {}),phase18_oos_backtest_framework:(.phase18_oos_backtest_framework // {}),phase19_promotion_framework:(.phase19_promotion_framework // {}),phase20_bankroll_risk_engine:(.phase20_bankroll_risk_engine // {}),phase21_alert_engine:(.phase21_alert_engine // {}),phase22_live_inplay_engine:(.phase22_live_inplay_engine // {}),phase23_mlops_model_registry:(.phase23_mlops_model_registry // {}),phase24_final_product_experience:(.phase24_final_product_experience // {}),dashboard_views:(.dashboard_views // {}),price_resolution_v4:(.price_resolution_v4 // {}),price_resolution_checkpoint:(.price_resolution_checkpoint // {}),phase21_alert_audit_rows:(.phase21_alert_audit_rows // []),market_mismatch_rows:(.market_mismatch_rows // []),market_mismatch_correlated_suppressed:(.market_mismatch_correlated_suppressed // []),v4_005_score_matrix_observability:(.v4_005_score_matrix_observability // {})}' /tmp/soccer_tick.json >> "$HISTORY_FILE"
          jq '.shortlist_state // {}' /tmp/soccer_tick.json > soccer_edge_state/shortlist_state.json
          jq '.scheduler_fairness_state // {}' /tmp/soccer_tick.json > soccer_edge_state/scheduler_fairness_state.json
          rm -f soccer_edge_state/last_error.json soccer_edge_state/quota_block_until.txt

          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/scheduler_fairness_state.json
          git add -A soccer_edge_state
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Soccer Edge tick ${RUN_DATE}"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            echo "Concurrent soccer-edge-state update detected; retrying push (attempt $attempt/3)"
            sleep $((attempt * 2))
          done
          echo "Failed to persist scheduler state after 3 retries"
          exit 1

      - name: Deliver compact live alerts
        if: steps.quota_guard.outputs.skip != 'true' && steps.tick.outputs.event_count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOCCER_ALERT_WEBHOOK_URL: ${{ secrets.SOCCER_ALERT_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          tick = json.load(open('/tmp/soccer_tick.json', encoding='utf-8'))
          rows = tick.get('match_table_rows') or []
          actionable = [r for r in rows if str(r.get('classification') or '').upper() in {'BET','LEAN','WATCH'}]
          selected = actionable[:8] if actionable else rows[:8]
          alert_mode = 'ACTIONABLE' if actionable else 'NO_BET_RESEARCH_DIGEST'

          Path('/tmp/soccer_alert_count').write_text(str(len(selected)))
          if not selected:
              raise SystemExit(0)

          lines = [
              '@Baahl11',
              '',
              f"### ⚽ Soccer Edge {tick.get('generated_at_local')} — {tick.get('version')} — {alert_mode}",
              '',
          ]
          if not actionable:
              lines += [
                  'No hubo BET/LEAN/WATCH en este tick. Te dejo los partidos analizados para que el sistema no se quede mudo.',
                  f"Scan: {tick.get('fixture_scan_count', 0)} | Due: {tick.get('due_fixture_count', 0)} | Events: {tick.get('event_count', 0)} | API calls: {tick.get('api_calls_this_tick', 0)}",
                  '',
              ]

          for row in selected:
              home = row.get('home') or '?'
              away = row.get('away') or '?'
              market = row.get('market') or 'N/V'
              selection = row.get('selection') or 'N/V'
              line = row.get('line')
              price = row.get('price') or 'N/V'
              cls = row.get('classification') or 'N/V'
              reason = row.get('reason') or 'N/V'
              data_tier = row.get('data_tier') or 'N/V'
              model_signal = row.get('model_signal') or 'N/V'
              execution_status = row.get('execution_status') or 'N/V'
              blockers = row.get('blockers') or []
              blocker_text = ','.join(str(x) for x in blockers) if blockers else 'none'
              scores = []
              for label, key in [('side', 'side_score'), ('goals', 'goals_score'), ('two_way', 'two_way_score')]:
                  value = row.get(key)
                  if value is not None:
                      scores.append(f"{label}:{value}")
              score_text = ' | '.join(scores) or 'scores N/V'
              market_text = f"{market} — {selection}"
              if line is not None:
                  market_text += f" {line}"
              lines += [
                  f"- **{cls}** {home} vs {away} | {row.get('kickoff','N/V')} | tier {data_tier} | MODEL {model_signal} | EXEC {execution_status} | blockers {blocker_text} | {score_text} | {market_text} | price {price} | {reason}"
              ]

          body = '\n'.join(lines) + '\n'
          Path('/tmp/soccer_alert_body.md').write_text(body, encoding='utf-8')
          Path('/tmp/soccer_alert_webhook.json').write_text(json.dumps({
              'source': 'soccer-edge-scheduler',
              'generated_at_local': tick.get('generated_at_local'),
              'alert_mode': alert_mode,
              'alert_count': len(selected),
              'actionable_count': len(actionable),
              'message': body,
              'rows': selected,
          }, ensure_ascii=False), encoding='utf-8')
          PY

          ALERT_COUNT=$(cat /tmp/soccer_alert_count)
          if [ "$ALERT_COUNT" = "0" ]; then exit 0; fi

          ISSUE_NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Soccer Edge Live Alerts" in:title' --json number,title --jq '.[] | select(.title=="⚽ Soccer Edge Live Alerts") | .number' | head -n1)
          if [ -z "$ISSUE_NUMBER" ]; then
            ISSUE_URL=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "⚽ Soccer Edge Live Alerts" --body "Canal automático de alertas del Soccer Edge Scheduler.")
            ISSUE_NUMBER="${ISSUE_URL##*/}"
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/soccer_alert_body.md

          if [ -n "${SOCCER_ALERT_WEBHOOK_URL:-}" ]; then
            curl -fsS -X POST -H "Content-Type: application/json" --data-binary @/tmp/soccer_alert_webhook.json "$SOCCER_ALERT_WEBHOOK_URL" || echo "::warning::Optional alert webhook delivery failed"
          fi
