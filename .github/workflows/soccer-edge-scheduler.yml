name: Soccer Edge Scheduler

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/soccer-edge-scheduler.yml"

concurrency:
  group: soccer-edge-scheduler
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          fetch-depth: 0

      - name: API quota circuit breaker
        id: quota_guard
        shell: bash
        run: |
          set -euo pipefail
          SKIP=false
          if [ -f soccer_edge_state/quota_block_until.txt ]; then
            BLOCK_UNTIL=$(cat soccer_edge_state/quota_block_until.txt || echo 0)
            NOW=$(date -u +%s)
            if [ "$NOW" -lt "$BLOCK_UNTIL" ]; then
              SKIP=true
              echo "API-Football daily quota circuit breaker active until $(date -u -d @$BLOCK_UNTIL +%FT%TZ)."
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Obtain GitHub OIDC token
        if: steps.quota_guard.outputs.skip != 'true'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          TOKEN=$(echo "$RESPONSE" | jq -r '.value')
          test -n "$TOKEN" && test "$TOKEN" != "null"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run Soccer Edge tick
        if: steps.quota_guard.outputs.skip != 'true'
        id: tick
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /tmp/soccer_tick.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            https://soccer-edge-api.onrender.com/internal/tick)
          cat /tmp/soccer_tick.json | jq '{service,version,model_version,generated_at_local,fixture_scan_count,due_fixture_count,event_count,actionable_refresh_count,bet_candidate_count,api_calls_this_tick,max_api_calls_per_tick,effective_max_api_calls_per_tick,last_daily_remaining,daily_budget_mode,deferred_due_to_budget,deferred_due_to_priority,deep_dive_processed_count,shortlist_event_count,screened_out_low_data_count,market_requests_avoided_by_sport_screen,shortlist_state_count,shortlist_seed_imported,urgent_late_shortlist_due,urgent_late_shortlist_processed,period_market_model,automated_market_scope,quota,error,detail,database_persisted,database_error}'
          if [ "$HTTP_CODE" -ne 200 ]; then
            mkdir -p soccer_edge_state
            jq --arg http_code "$HTTP_CODE" '{captured_at: now|todateiso8601, http_code: $http_code, response: .}' /tmp/soccer_tick.json > soccer_edge_state/last_error.json
            if jq -e '(.detail // "") | test("request limit for the day"; "i")' /tmp/soccer_tick.json >/dev/null; then
              RESET=$(date -u -d 'tomorrow 00:05:00' +%s)
              echo "$RESET" > soccer_edge_state/quota_block_until.txt
              echo "Daily quota exhausted; circuit breaker set through $(date -u -d @$RESET +%FT%TZ)."
            fi
            git config user.name "soccer-edge-bot"
            git config user.email "soccer-edge-bot@users.noreply.github.com"
            git add -f soccer_edge_state/last_error.json soccer_edge_state/quota_block_until.txt 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m "Soccer Edge scheduler error"
              git push origin HEAD:soccer-edge-state
            fi
            echo "Scheduler endpoint failed with HTTP $HTTP_CODE"
            exit 1
          fi
          EVENT_COUNT=$(jq -r '.event_count // 0' /tmp/soccer_tick.json)
          echo "event_count=$EVENT_COUNT" >> "$GITHUB_OUTPUT"
          echo "run_date=$(jq -r '.generated_at_local[0:10]' /tmp/soccer_tick.json)" >> "$GITHUB_OUTPUT"

      - name: Build compact notification state
        if: steps.quota_guard.outputs.skip != 'true' && steps.tick.outputs.event_count != '0'
        shell: bash
        run: |
          set -euo pipefail
          jq '{
            service,
            version,
            model_version,
            generated_at_utc,
            generated_at_local,
            timezone,
            fixture_scan_count,
            due_fixture_count,
            event_count,
            actionable_refresh_count,
            bet_candidate_count,
            api_calls_this_tick,
            max_api_calls_per_tick,
            effective_max_api_calls_per_tick,
            last_daily_remaining,
            daily_budget_mode,
            deferred_due_to_budget,
            deferred_due_to_priority,
            deep_dive_processed_count,
            shortlist_event_count,
            screened_out_low_data_count,
            market_requests_avoided_by_sport_screen,
            max_deep_dive_fixtures_per_tick,
            priority_queue,
            urgent_late_shortlist_due,
            urgent_late_shortlist_processed,
            request_pacing_seconds,
            rate_limit_max_retries,
            first_half_market_model,
            period_market_model,
            automated_market_scope,
            shortlist_persistence,
            shortlist_state_count,
            shortlist_seed_imported,
            quota,
            database_persisted,
            events: [
              .events[] | {
                event_type,
                stage,
                classification,
                tier,
                stake_units,
                bet_eligible,
                availability_confidence,
                fixture,
                coverage: (if (.coverage|type) == "object" then {data_tier: .coverage.data_tier} else .coverage end),
                sporting_shortlist,
                sporting_screen_initial,
                sporting_screen_refined,
                lineups: (if (.lineups|type) == "object" then {
                  lineup_state: .lineups.lineup_state,
                  both_xi_confirmed: .lineups.both_xi_confirmed,
                  both_goalkeepers_confirmed: .lineups.both_goalkeepers_confirmed,
                  teams: [.lineups.teams[]? | {team_id,team,formation,goalkeepers}]
                } else .lineups end),
                raw_projection: (if (.raw_projection|type) == "object" then {
                  status: .raw_projection.status,
                  projection_model: .raw_projection.projection_model,
                  advanced_metrics: .raw_projection.advanced_metrics,
                  raw_home_goal_rate: .raw_projection.raw_home_goal_rate,
                  raw_away_goal_rate: .raw_projection.raw_away_goal_rate,
                  raw_total_goals: .raw_projection.raw_total_goals,
                  raw_home_win_prob: .raw_projection.raw_home_win_prob,
                  raw_draw_prob: .raw_projection.raw_draw_prob,
                  raw_away_win_prob: .raw_projection.raw_away_win_prob,
                  raw_btts_yes_prob: .raw_projection.raw_btts_yes_prob,
                  raw_over_2_5_prob: .raw_projection.raw_over_2_5_prob,
                  scoring_path: .raw_projection.scoring_path,
                  screen_scores: .raw_projection.screen_scores
                } else .raw_projection end),
                market_decision: (if (.market_decision|type) == "object" then {
                  status: .market_decision.status,
                  reason: .market_decision.reason,
                  first_half_markets_ignored: .market_decision.first_half_markets_ignored,
                  first_half_reason: .market_decision.first_half_reason,
                  period_markets_ignored: .market_decision.period_markets_ignored,
                  period_market_reason: .market_decision.period_market_reason
                } else .market_decision end),
                best_market,
                notes,
                result,
                error
              }
            ]
          }' /tmp/soccer_tick.json > /tmp/soccer_compact.json
          jq -e . /tmp/soccer_compact.json >/dev/null

      - name: Persist scheduler state
        if: steps.quota_guard.outputs.skip != 'true' && steps.tick.outputs.event_count != '0'
        shell: bash
        env:
          RUN_DATE: ${{ steps.tick.outputs.run_date }}
        run: |
          set -euo pipefail
          mkdir -p soccer_edge_state/history
          cp /tmp/soccer_compact.json soccer_edge_state/latest.json
          jq -c '.' /tmp/soccer_compact.json >> "soccer_edge_state/history/${RUN_DATE}.jsonl"
          jq '.shortlist_state // {}' /tmp/soccer_tick.json > soccer_edge_state/shortlist_state.json
          rm -f soccer_edge_state/last_error.json soccer_edge_state/quota_block_until.txt

          git config user.name "soccer-edge-bot"
          git config user.email "soccer-edge-bot@users.noreply.github.com"
          git add -A soccer_edge_state
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Soccer Edge tick ${RUN_DATE}"
          git push origin HEAD:soccer-edge-state
