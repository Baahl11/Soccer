# v234 live validate 3:1 primary-derivative CLV maturation fairness
# v232.1 validate starved-primary-CLV revisit priority within existing cap
# v230 manual post-fix live proof: recent CLV window + zero-call 1X2/BTTS reuse 2026-10-04
# v223.1 manual provider-update provenance validation 2026-10-04
# v223 manual primary CLV 180m validation 2026-10-04
# v222.1 manual primary CLV validation after telemetry fix 2026-10-04
# v222 manual primary CLV 90m validation 2026-10-04
# v171 post-live Team Totals + final telemetry validation
# v168 Control Tower v2 + Team Totals close-window validation
# v165 post-deploy coverage catch-up validation
# v164 post-live reserve validation
