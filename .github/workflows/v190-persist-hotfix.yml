name: v190 Persist Hotfix

on:
  push:
    branches: [main]
    paths: [".github/workflows/v190-persist-hotfix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch v190 checkout and sparse persist
        shell: bash
        run: |
          set -euo pipefail
          F=.github/workflows/v190-btts-aligned-ranking-audit.yml
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/v190-btts-aligned-ranking-audit.yml')
          s = p.read_text()
          s = s.replace('          fetch-depth: 0\n', '          fetch-depth: 50\n', 1)
          s = s.replace('          git add -f soccer_edge_state/analysis/btts_aligned_ranking_audit_v4.json\n', '          git add --sparse -f soccer_edge_state/analysis/btts_aligned_ranking_audit_v4.json\n', 1)
          p.write_text(s)
          PY
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add "$F"
          git commit -m "Fix v190 sparse persistence and shallow runtime history"
          git push origin HEAD:main
