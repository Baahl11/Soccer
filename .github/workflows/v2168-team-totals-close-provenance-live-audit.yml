name: v216.8 Team Totals Close Provenance Live Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v2168-team-totals-close-provenance-live-audit.yml"

permissions:
  contents: read
  id-token: write

jobs:
  audit-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_COMMIT: d418160a2846af5bf2bfa6b8f91202f4305f1992
      BASE_URL: https://soccer-edge-api.onrender.com
    steps:
      - name: Wait for v216.8 runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl -fsS --max-time 20 "$BASE_URL/health" -o /tmp/health.json; then
              LIVE_COMMIT=$(jq -r '.render_git_commit // empty' /tmp/health.json)
              echo "attempt=$attempt live_commit=$LIVE_COMMIT"
              if [ "$LIVE_COMMIT" = "$EXPECTED_COMMIT" ]; then
                jq '{status,service,version,render_git_commit,database_persistence_configured}' /tmp/health.json
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Render did not reach expected commit $EXPECTED_COMMIT"
          cat /tmp/health.json || true
          exit 1

      - name: Run one Team Totals provenance tick
        shell: bash
        run: |
          set -euo pipefail
          OIDC_RESPONSE=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.value // empty')
          test -n "$OIDC_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"

          HTTP_CODE=$(curl -sS --max-time 430 \
            -o /tmp/tick.json \
            -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            "$BASE_URL/internal/tick")

          echo "http_code=$HTTP_CODE"
          test "$HTTP_CODE" = "200"
          jq -e 'type == "object"' /tmp/tick.json >/dev/null

          jq '{
            service,
            version,
            model_version,
            generated_at_utc,
            fixture_scan_count,
            due_fixture_count,
            event_count,
            api_calls_this_tick,
            effective_max_api_calls_per_tick,
            last_daily_remaining,
            database_persisted,
            database_error,
            generic_team_totals_maturation: {
              source: .price_resolution_v4.research_spillover_maturation_source,
              candidates: .price_resolution_v4.research_spillover_maturation_candidates,
              max_calls_per_tick: .price_resolution_v4.research_spillover_maturation_max_calls_per_tick,
              api_calls_added: .price_resolution_v4.research_spillover_maturation_api_calls_added,
              later_real_quote_refreshes: .price_resolution_v4.research_spillover_maturation_later_real_quote_refreshes,
              cache_replays_ignored: .price_resolution_v4.research_spillover_maturation_cache_replays_ignored,
              unchanged_provider_updates: .price_resolution_v4.research_spillover_maturation_unchanged_provider_updates,
              budget_exhausted: .price_resolution_v4.research_spillover_maturation_budget_exhausted
            },
            exact_close_provenance: .v216_8_team_totals_close_provenance_audit
          }' /tmp/tick.json | tee /tmp/v2168-audit.json

          jq -e '.version == "4.38.5-team-totals-close-provenance-audit"' /tmp/tick.json >/dev/null
          jq -e '.database_persisted == true' /tmp/tick.json >/dev/null
          jq -e '.v216_8_team_totals_close_provenance_audit.status == "OBSERVABILITY_ONLY"' /tmp/tick.json >/dev/null
          jq -e '.v216_8_team_totals_close_provenance_audit.provider_requests_added == 0' /tmp/tick.json >/dev/null
          jq -e '.v216_8_team_totals_close_provenance_audit.selection_logic_changed == false' /tmp/tick.json >/dev/null
          jq -e '.v216_8_team_totals_close_provenance_audit.strict_close_semantics_changed == false' /tmp/tick.json >/dev/null
