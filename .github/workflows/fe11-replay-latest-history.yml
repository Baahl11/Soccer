name: FE11 Reimport verified historical paper profiles (no new provider requests)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fe11-replay-latest-history.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: soccer-fe11-profile-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Retrieve latest completed one-shot scanner artifact
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import io,json,os,urllib.request,zipfile
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          repo=os.environ["GH_REPO"]
          headers={"Accept":"application/vnd.github+json",
                   "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                   "X-GitHub-Api-Version":"2022-11-28"}
          def api(uri):
              with urllib.request.urlopen(
                  urllib.request.Request("https://api.github.com"+uri,headers=headers),
                  timeout=30) as response:
                  return json.load(response)
          items=api("/repos/"+repo+
            "/actions/workflows/sports-edge-scanner-v05-paper.yml/runs?"+
            "branch=main&event=push&status=completed&per_page=15").get("workflow_runs",[])
          artifact=None
          for run in items:
              if run.get("conclusion")!="success":
                  continue
              files=api("/repos/"+repo+"/actions/runs/"+
                        str(run["id"])+"/artifacts?per_page=20").get("artifacts",[])
              artifact=next((f for f in files
                             if f.get("name")=="soccer-paper-research"
                             and f.get("expired") is False),None)
              if artifact:break
          if artifact is None:
              raise SystemExit("NO_COMPLETED_SCANNER_ARTIFACT_AVAILABLE")
          url="https://api.github.com/repos/"+repo+"/actions/artifacts/"+str(artifact["id"])+"/zip"
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),
                                      timeout=60) as response:
              archive=response.read()
          if len(archive)>25_000_000:
              raise SystemExit("SCANNER_ARTIFACT_TOO_LARGE")
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              matching=[i for i in z.infolist()
                        if i.filename.rsplit("/",1)[-1].startswith("fe11_multimarket_transport_")
                        and i.filename.endswith(".json") and i.file_size<=400_000]
              if len(matching)!=1:
                  raise SystemExit("FE11_TRANSPORT_ARTIFACT_MISSING_OR_AMBIGUOUS")
              payload=json.loads(z.read(matching[0]).decode("utf-8"))
          if payload.get("source")!="SPORTS_EDGE_SCANNER_V15_HISTORICAL_CONTEXT":
              raise SystemExit("UNTRUSTED_SCANNER_SOURCE")
          reports=payload.get("reports")
          if not isinstance(reports,list) or not 1<=len(reports)<=3:
              raise SystemExit("NO_VERIFIED_HISTORICAL_REPORTS_TO_REPLAY")
          stamp=datetime.fromisoformat(payload["generated_at_utc"].replace("Z","+00:00"))
          age=datetime.now(timezone.utc)-stamp.astimezone(timezone.utc)
          if not timedelta(0)<=age<=timedelta(hours=48):
              raise SystemExit("REPLAY_TRANSPORT_EXPIRED")
          Path("/tmp/fe11_replay.json").write_text(json.dumps(payload,separators=(",",":")))
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("available=true\n")
          print("Verified cached scanner reports:",len(reports), "No API-Football requests.")
          PY
      - name: Reimport with authenticated GitHub main OIDC
        if: steps.locate.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TOKEN_JSON=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=soccer-edge-render")
          ID_TOKEN=$(echo "$TOKEN_JSON" | python -c "import sys,json;print(json.load(sys.stdin)['value'])")
          test -n "$ID_TOKEN"
          echo "::add-mask::$ID_TOKEN"
          STATUS=$(curl -sS --max-time 75 --request POST \
            -H "Authorization: Bearer $ID_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/fe11_replay.json \
            -o /tmp/fe11_receipt.json -w "%{http_code}" \
            https://soccer-edge-api.onrender.com/internal/fe11-multimarket-history-import-v1)
          echo "HTTP $STATUS"
          test "$STATUS" = "200"
          python - <<'PY'
          import json
          r=json.load(open("/tmp/fe11_receipt.json"))
          assert r.get("status")=="SPORT_FIRST_HISTORY_IMPORTED"
          assert r.get("bet_eligible") is False
          assert r.get("provider_requests_added")==0
          print(json.dumps({
            "validated_reports":r.get("validated_reports"),
            "newly_persisted":r.get("newly_persisted"),
            "not_persisted_by_registry_reason":r.get("not_persisted_by_registry_reason"),
            "bet_eligible":r.get("bet_eligible"),
          },indent=2))
          PY
