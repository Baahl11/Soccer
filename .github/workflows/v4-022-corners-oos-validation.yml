name: V4-022 Corners OOS Validation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Soccer Edge Formation Intelligence"]
    types: [completed]
  push:
    branches: [main]
    paths: [".github/workflows/v4-022-corners-oos-validation.yml"]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1
          sparse-checkout: |
            soccer_edge_state/analysis/corners_baseline.json
            soccer_edge_state/analysis/team_corners_validation.json
            soccer_edge_state/analysis/clv_v4_postgres_tracking.jsonl
            soccer_edge_state/analysis/v4_022_corners_oos_validation.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run V4-022 unit tests
        working-directory: runtime
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          PYTHONPATH=. pytest -q tests/test_v4_022_corners_oos.py

      - name: Build current Corners OOS validation report
        working-directory: runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m mcp_gateway.corners_oos_v4             --baseline ../state/soccer_edge_state/analysis/corners_baseline.json             --team-validation ../state/soccer_edge_state/analysis/team_corners_validation.json             --true-clv-tracking ../state/soccer_edge_state/analysis/clv_v4_postgres_tracking.jsonl             --output ../state/soccer_edge_state/analysis/v4_022_corners_oos_validation.json

      - name: Validate safety gates
        run: |
          set -euo pipefail
          jq -e '.ticket == "V4-022"' state/soccer_edge_state/analysis/v4_022_corners_oos_validation.json >/dev/null
          jq -e '.model_version == "SOCCER_CORNERS_OOS_VALIDATION_V4_1.3.0"' state/soccer_edge_state/analysis/v4_022_corners_oos_validation.json >/dev/null
          jq -e '.production_promotion_allowed == false' state/soccer_edge_state/analysis/v4_022_corners_oos_validation.json >/dev/null
          jq -e '.family_views.FT_CORNERS.true_clv.family_specific == true' state/soccer_edge_state/analysis/v4_022_corners_oos_validation.json >/dev/null
          jq -e '.family_views.TEAM_CORNERS.true_clv.family_specific == true' state/soccer_edge_state/analysis/v4_022_corners_oos_validation.json >/dev/null
          jq -e '(.ft_corners.formation_lift_by_league | type) == "object"' state/soccer_edge_state/analysis/v4_022_corners_oos_validation.json >/dev/null
          jq -e '(.family_views.FT_CORNERS.blockers | type) == "array"' state/soccer_edge_state/analysis/v4_022_corners_oos_validation.json >/dev/null
          jq -e '(.family_views.TEAM_CORNERS.blockers | type) == "array"' state/soccer_edge_state/analysis/v4_022_corners_oos_validation.json >/dev/null
          jq -e '(.family_views.FT_CORNERS.blockers | index("SOURCE_FT_CORNERS_PROMOTION_GATE_DISABLED")) == null' state/soccer_edge_state/analysis/v4_022_corners_oos_validation.json >/dev/null
          jq -e '(.family_views.TEAM_CORNERS.blockers | index("SOURCE_TEAM_CORNERS_PROMOTION_GATE_DISABLED")) == null' state/soccer_edge_state/analysis/v4_022_corners_oos_validation.json >/dev/null

      - name: Persist validation report to state branch
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/v4_022_corners_oos_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update V4-022 Corners OOS validation report"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
