name: Match Family Postgres Read-Only Replay
on:
  pull_request:
    branches: [soccer-edge-mcp-v1]
    paths:
      - '.github/workflows/match-family-replay-v1.yml'
      - 'mcp_gateway/match_family_replay_v1.py'
      - 'mcp_gateway/server*.py'
      - 'tests/test_match_family_replay_v1.py'
      - 'tests/test_oos_canonical_pair_inventory_v1.py'
      - 'mcp_gateway/oos_canonical_pair_inventory_v1.py'
  push:
    branches: [soccer-edge-mcp-v1]
    paths:
      - '.github/workflows/match-family-replay-v1.yml'
  workflow_dispatch:
    inputs:
      before_event_id:
        description: 'Optional next_before_event_id from prior audit'
        type: string
        required: false
permissions: {}
concurrency:
  group: match-family-postgres-replay
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r mcp_gateway/requirements.txt pytest
      - run: python -m py_compile mcp_gateway/server.py mcp_gateway/server_base.py mcp_gateway/match_family_replay_v1.py
      - run: python -m pytest -q tests/test_match_family_replay_v1.py tests/test_oos_canonical_pair_inventory_v1.py
  replay:
    needs: validate
    if: github.ref == 'refs/heads/soccer-edge-mcp-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      id-token: write
    steps:
      - name: Run pinned aggregate replay on Render
        env:
          BEFORE_EVENT_ID: ${{ inputs.before_event_id || '' }}
          BASE_URL: https://soccer-edge-api.onrender.com
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.parse, urllib.request
          base = os.environ["BASE_URL"]
          route = base + "/internal/match-family-replay-v1"
          # A redirect must not forward the OIDC bearer token to another host.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          token_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          token_url += "&" + urllib.parse.urlencode({"audience": "soccer-edge-render"})
          for attempt in range(9):
              req = urllib.request.Request(token_url, headers={
                  "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
              with opener.open(req, timeout=12) as response:
                  token = json.load(response)["value"]
              try:
                  req = urllib.request.Request(route, method="POST", data=b"",
                                               headers={"Authorization": "Bearer " + token,
                                                        "X-Audit-Before-Event-ID": os.environ.get("BEFORE_EVENT_ID", "")})
                  with opener.open(req, timeout=75) as response:
                      report = json.load(response)
                  if report.get("audit_version") != 10:
                      if attempt == 8:
                          raise SystemExit("Discovery deployment not live")
                      time.sleep(20)
                      continue
                  break
              except urllib.error.HTTPError as exc:
                  if exc.code == 503:
                      try:
                          reason = json.loads(exc.read(512)).get("reason")
                      except (ValueError, AttributeError):
                          reason = None
                      if reason in {"QUERY_TIMEOUT", "LOCK_TIMEOUT", "DISCOVERY_ERROR"}:
                          raise SystemExit(f"Discovery failed: {reason}") from None
                      if attempt < 8:
                          time.sleep(20)
                          continue
                  if exc.code not in {404, 405, 502, 504} or attempt == 8:
                      raise SystemExit(f"Replay failed: HTTP {exc.code}") from None
                  time.sleep(20)
          from datetime import datetime
          assert report["scope"] == "POSTGRES_VALIDATOR_REPLAY_NOT_OWNER_HTTP_OR_BROWSER"
          assert report["fresh_capture_after_utc"] == "2026-11-16T19:52:31.554902+00:00"
          d = report["discovery"]
          assert d["lookback_days"] == 30 and d["event_scan_limit"] == 96
          assert type(d["scan_complete"]) is bool
          assert type(d["events_scanned"]) is int and 0 <= d["events_scanned"] <= 96
          cursor = d["next_before_event_id"]
          assert cursor is None or (type(cursor) is int and cursor > 0)
          reasons = {"QUERY_TIMEOUT", "LOCK_TIMEOUT", "DISCOVERY_ERROR"}
          failure = d["scan_failure"]
          if failure:
              assert failure["phase"] in {"EVENT_METADATA", "EVENT_PAYLOAD_KEYS"} and failure["reason"] in reasons
              failure = {key: failure[key] for key in ("phase", "reason")}
          safe = {"audit_at_utc": datetime.fromisoformat(report["audit_at_utc"]).isoformat(),
                  "fresh_capture_after_utc": report["fresh_capture_after_utc"],
                  "events_scanned": d["events_scanned"], "scan_complete": d["scan_complete"],
                  "next_before_event_id": cursor, "scan_failure": failure, "fixture_failures": [],
                  "discovery": {"lookback_days": 30, "event_scan_limit": 96, "families": {}}}
          for row in d["fixture_failures"]:
              assert type(row["fixture_id"]) is int and row["fixture_id"] > 0 and row["reason"] in reasons
              safe["fixture_failures"].append({key: row[key] for key in ("fixture_id", "reason")})
          families = ("GOLES_EQUIPO", "CORNERS_FT", "AMARILLAS_FT", "AMARILLAS_EQUIPO", "ROJA_SI_NO", "SHOTS", "SOT")
          for family in families:
              row = d["families"][family]
              keys = ("candidatos_en_corte", "revisados", "no_concluyentes")
              assert all(type(row[k]) is int and 0 <= row[k] <= 8 for k in keys)
              assert type(row["hay_mas_candidatos"]) is bool
              positive = row["positivo"]
              if positive is not None:
                  assert type(positive["fixture_id"]) is int and positive["fixture_id"] > 0
                  assert positive["estado"] in {"ACEPTADO_EN_REPLAY_DE_FICHA", "ACEPTADO_FUERA_DE_ULTIMOS_12"}
                  positive = {k: positive[k] for k in ("fixture_id", "estado")}
              historical = row["historical_positive_fixture_id"]
              assert historical is None or (family in {"SHOTS", "SOT"} and type(historical) is int and historical > 0)
              allowed = ["XI_NOT_CONFIRMED","OTHER_PRODUCER_STATE","MODEL_OUTPUT_EVENTS","NO_MODELED_PLAYERS","NO_MATCHED_PREGAME_PLAYER_SNAPSHOT","ACCEPTED_EVENTS","OTHER_VALIDATOR_REASON","SNAPSHOT_NOT_OBJECT","NOT_VERIFIED_ASOF_FIXTURE","MODEL_FIXTURE_MISMATCH","MODEL_PLAYER_LIST_MISSING","MODEL_PLAYER_ID_XI_NOT_VERIFIED","PLAYER_REGISTRY_ASOF_NOT_VERIFIED", "PLAYER_REGISTRY_TIMESTAMP_MISSING", "PLAYER_REGISTRY_TIMESTAMP_INVALID", "PLAYER_REGISTRY_TIMESTAMP_AFTER_CAPTURE","HISTORICAL_PLAYER_SAMPLE_INSUFFICIENT","HISTORICAL_PLAYER_MINUTES_INSUFFICIENT","RAW_SHOTS_RATE_NOT_VERIFIED","EXPECTED_MINUTES_NOT_VERIFIED","OPPONENT_CONTEXT_NOT_VERIFIED","MODEL_LINE_DISTRIBUTION_NOT_VERIFIED"]
              diagnostics = row["diagnostics"]
              assert isinstance(diagnostics, dict)
              assert not diagnostics or family in {"SHOTS", "SOT"}
              assert all(k in allowed and type(v) is int and 0 <= v <= 1000000 for k, v in diagnostics.items())
              safe["discovery"]["families"][family] = {
                  "diagnostics": diagnostics,
                  "historical_positive_fixture_id": historical,
                  **{k: row[k] for k in keys}, "hay_mas_candidatos": row["hay_mas_candidatos"],
                  "positivo": positive}
          safe["panel_controls"] = {}
          control_failed = False
          for fixture in ("1647367", "1545887"):
              row = report["panel_controls"][fixture]
              state = row["state"]
              assert state in reasons | {"REPLAYED", "IDENTIDAD_CANONICA_NO_VERIFICADA"}
              control_failed |= state in reasons
              item = {"state": state}
              if state == "REPLAYED":
                  assert type(row["window_events"]) is int and 0 <= row["window_events"] <= 12
                  assert type(row["archive_truncated"]) is bool
                  item.update(window_events=row["window_events"], archive_truncated=row["archive_truncated"], families={})
                  for family in families:
                      value = row["families"][family]["estado"]
                      assert value in {"ACEPTADO_EN_REPLAY_DE_FICHA", "ACEPTADO_FUERA_DE_ULTIMOS_12",
                                       "PERSISTIDO_PREPARTIDO_NO_ACEPTADO", "SIN_CAMPO_PREPARTIDO_EN_REFRESH_EVENTS",
                                       "ARCHIVO_TRUNCADO_NO_CONCLUYENTE"}
                      item["families"][family] = value
              safe["panel_controls"][fixture] = item
              try:
                  with opener.open(base + "/app/api/v2/match/" + fixture, timeout=15) as response:
                      raise SystemExit("Anonymous fixture access was not denied")
              except urllib.error.HTTPError as exc:
                  assert exc.code == 403
                  body = json.loads(exc.read(4096))
                  assert body.get("error") == "PRO_REQUIRED"
                  assert not any(key.startswith("private_") for key in body)
                  item["anonymous_http"] = 403
          evidence = report["corners_evidence"]
          assert isinstance(evidence, list) and len(evidence) <= 8
          safe["corners_evidence"] = []
          for row in evidence:
              keys = ("paired", "formation_only", "official_ft_only", "neither")
              assert all(type(row[k]) is int and 0 <= row[k] <= 128 for k in ("sampled", *keys))
              assert sum(row[k] for k in keys) == row["sampled"]
              assert type(row["truncated"]) is bool
              recovered = ("recovered_observation_truth", "recovered_observation_pairs")
              assert all(type(row[k]) is int and 0 <= row[k] <= row["sampled"] for k in recovered)
              assert row["recovered_observation_pairs"] <= min(row["paired"], row["recovered_observation_truth"])
              safe["corners_evidence"].append({
                  **{k: datetime.fromisoformat(row[k]).isoformat() for k in ("start_utc", "end_utc")},
                  **{k: row[k] for k in ("sampled", "truncated", *keys, *recovered)}})
          evidence_error = report["corners_evidence_error"]
          assert evidence_error is None or evidence_error in reasons
          safe["corners_evidence_error"] = evidence_error
          pair_error = report["canonical_pair_error"]
          assert pair_error is None or pair_error in reasons
          safe["canonical_pair_error"] = pair_error
          if pair_error is None:
              pairs = report["canonical_pair_coverage"]
              n = pairs["sampled"]
              assert type(n) is int and 0 <= n <= 32
              assert type(pairs["sample_truncated"]) is bool
              assert type(pairs["observation_truncated"]) is int and 0 <= pairs["observation_truncated"] <= n
              safe_pairs = {k: pairs[k] for k in ("sampled", "sample_truncated", "observation_truncated")}
              safe_pairs["families"] = {}
              for family in ("FT_CORNERS", "TEAM_CORNERS", "FT_YELLOWS", "TEAM_YELLOWS", "ANY_RED"):
                  counts = {k: pairs["families"][family][k] for k in ("both", "prediction_only", "outcome_only", "neither")}
                  assert all(type(v) is int and 0 <= v <= n for v in counts.values()) and sum(counts.values()) == n
                  safe_pairs["families"][family] = counts
              safe["canonical_pair_coverage"] = safe_pairs
          print(json.dumps(safe, indent=2))
          if pair_error:
              raise SystemExit("Canonical pair coverage inconclusive")
          if evidence_error:
              raise SystemExit("Corners inventory inconclusive")
          if control_failed:
              raise SystemExit("At least one pinned control is inconclusive")
          if failure or safe['fixture_failures']:
              raise SystemExit('Partial discovery: inspect stage and retained results')
          PY
