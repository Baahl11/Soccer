name: Soccer Refined SPORT ONLY - Private OIDC Research Capture (Manual)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/soccer_isolated_refined_oidc_bridge_v1.py'
      - '.github/workflows/soccer-isolated-sport-refined-pg-v1.yml'
  # One-time main merge trigger, guarded by exact commit-title prefix;
  # removed immediately after the first private research proof.
  push:
    branches: [main]
    paths:
      - '.github/workflows/soccer-isolated-sport-refined-pg-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soccer-refined-sport-private-research-manual
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source fingerprint, redaction and manual-only contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/soccer_isolated_refined_oidc_bridge_v1.py
          python .github/scripts/soccer_isolated_refined_oidc_bridge_v1.py --self-test
          python .github/scripts/soccer_isolated_sport_only_v1.py --self-test
          python - <<'PY'
          from pathlib import Path
          s = Path(".github/scripts/soccer_isolated_refined_oidc_bridge_v1.py").read_text()
          w = Path(".github/workflows/soccer-isolated-sport-refined-pg-v1.yml").read_text()
          assert "github.event_name == 'workflow_dispatch'" in w
          assert "github.ref == 'refs/heads/main'" in w
          assert "id-token: write" in w
          assert "DATABASE_URL: ''" in w
          assert "SOCCER_EDGE_MAX_API_CALLS_PER_TICK: '40'" in w
          assert not any(line.lstrip().startswith("- cron:") for line in w.splitlines())
          assert "REFINED_RESEARCH_STORE_ACK_NOT_VERIFIED" in s
          assert "MODEL_SOURCE_FEATURE_FINGERPRINT_CONFLICT" in s
          assert "UPSTREAM_PROVIDER" not in s or "upstream_provider_inputs_transmitted" in s
          print("REFINED_SPORT_PRIVATE_OIDC_CAPTURE_CONTRACT_PASS")
          PY

  live-private-research:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' &&
         startsWith(github.event.head_commit.message,
           'ops(soccer): one-shot private refined capture #149'))
      )
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
      id-token: write
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      DATABASE_URL: ''
      SOCCER_EDGE_MAX_API_CALLS_PER_TICK: '40'
      SOCCER_EDGE_CACHE_PATH: /tmp/soccer_refined_live_oidc_research.sqlite3
    steps:
      - uses: actions/checkout@v4
        with:
          path: controls
      - uses: actions/checkout@v4
        with:
          repository: Baahl11/Soccer
          ref: 2c9d073dcca25152ea7c6e890022814672b0bc05
          path: runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check pinning and anti-market tests
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}" || { echo "::error::PROVIDER_SECRET_NOT_CONFIGURED"; exit 1; }
          test "$(git -C runtime rev-parse HEAD)" = 2c9d073dcca25152ea7c6e890022814672b0bc05
          python controls/.github/scripts/soccer_isolated_sport_only_v1.py --self-test
          python controls/.github/scripts/soccer_isolated_refined_oidc_bridge_v1.py --self-test
      - name: Install pinned runtime dependencies
        run: python -m pip install -r runtime/mcp_gateway/requirements.txt
      - name: Capture prospective SPORT ONLY, preserve exact unmodified as-of source locally
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=runtime python controls/.github/scripts/soccer_isolated_sport_only_v1.py \
            --runtime-sha 2c9d073dcca25152ea7c6e890022814672b0bc05 \
            --output /tmp/refined_sport_research_source.json
          jq -e '
            .status == "SPORT_ONLY_RESEARCH_CANARY"
            and .actual_provider_calls <= 40 and .transport_budget_denied == 0
            and .quota_headers_verified > 0 and .last_daily_remaining >= 1000
            and .markets_queried == 0 and .price_resolver_invocations == 0
            and .clv_rows_added == 0 and .db_writes == 0
            and .bet_eligible == false and .production_promotion_allowed == false
          ' /tmp/refined_sport_research_source.json >/dev/null
      - name: Immediately submit only minimized verified forecasts through signed main OIDC
        shell: bash
        run: |
          set -euo pipefail
          python controls/.github/scripts/soccer_isolated_refined_oidc_bridge_v1.py \
            --source /tmp/refined_sport_research_source.json \
            --receipt refined_sport_private_import_receipt.json
          jq -e '
            .status == "REFINED_RESEARCH_LIVE_PRIVATE_IMPORT"
            and .canonical_clv_rows_added == 0 and .canonical_deep_dives_added == 0
            and .market_prices_added == 0
            and .bet_eligible == false and .production_promotion_allowed == false
            and .upstream_provider_inputs_transmitted == false
          ' refined_sport_private_import_receipt.json >/dev/null
      - name: Delete transient upstream source regardless of outcome
        if: always()
        run: rm -f /tmp/refined_sport_research_source.json
      - name: Upload audit receipt without fixture identifiers or provider data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-refined-sport-private-oidc-receipt
          path: refined_sport_private_import_receipt.json
          retention-days: 7
