name: Soccer Subscriber Maturity Proof

on:
  push:
    branches:
      - feat/soccer-subscriber-maturity-proof-v1
    paths:
      - mcp_gateway/__init__.py
      - mcp_gateway/subscriber_contract_v2.py
      - mcp_gateway/subscriber_frontend_v2.py
      - mcp_gateway/subscriber_maturity_v232.py
      - tests/test_subscriber_contract_v2.py
      - tests/test_subscriber_frontend_v2.py
      - .github/workflows/soccer-subscriber-maturity-proof.yml
  pull_request:
    branches:
      - soccer-edge-mcp-v1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install -r mcp_gateway/requirements.txt pytest
      - name: Compile maturity and subscriber gateway
        run: |
          python -m py_compile mcp_gateway/__init__.py mcp_gateway/subscriber_contract_v2.py mcp_gateway/subscriber_frontend_v2.py mcp_gateway/subscriber_maturity_v232.py
      - name: Check route is registered
        run: |
          PYTHONPATH=. python - <<'PY'
          import mcp_gateway
          from mcp.server.fastmcp import FastMCP
          app = FastMCP("maturity-gate-check", stateless_http=True, json_response=True).streamable_http_app()
          paths = {getattr(route, "path", None) for route in app.router.routes}
          assert "/app/api/v2/maturity" in paths
          PY
      - name: Run full v2 API contract tests
        run: |
          PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider tests/test_subscriber_contract_v2.py
      - name: Run new maturity UI regression (legacy unrelated UI assertions tracked separately)
        run: |
          PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider tests/test_subscriber_frontend_v2.py -k maturity
