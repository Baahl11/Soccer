name: Team Totals Comparable Maturation Patch

on:
  push:
    branches:
      - soccer-edge-mcp-v1
    paths:
      - ".github/workflows/team-totals-comparable-maturation-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply patch
        run: python ops/patch_team_totals_clv_matcher.py

      - name: Compile patched module
        run: python -m py_compile mcp_gateway/price_resolver_v4.py

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_gateway/requirements.txt pytest

      - name: Run price resolver regression tests
        run: PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider tests/test_price_resolver_v4.py

      - name: Commit validated patch
        shell: bash
        run: |
          if git diff --quiet -- mcp_gateway/price_resolver_v4.py tests/test_price_resolver_v4.py; then
            echo "No patch changes detected"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp_gateway/price_resolver_v4.py tests/test_price_resolver_v4.py
          git commit -m "fix: require comparable Team Totals CLV quotes"
          git push origin HEAD:soccer-edge-mcp-v1
