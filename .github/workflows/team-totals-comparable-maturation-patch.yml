name: Team Totals Comparable Maturation Patch

on:
  push:
    branches:
      - soccer-edge-mcp-v1
    paths:
      - ".github/workflows/team-totals-comparable-maturation-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply exact Team Totals maturation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("mcp_gateway/price_resolver_v4.py")
          text = target.read_text(encoding="utf-8")
          start_marker = "def _markets_have_provider_update_after("
          end_marker = "def _primary_market_matches_signal("
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          replacement = r'''def _markets_have_provider_update_after(markets: list[dict[str, Any]], signal_generated_at: Any) -> bool:
              if not signal_generated_at:
                  return False
              try:
                  signal_at = (
                      signal_generated_at
                      if isinstance(signal_generated_at, datetime)
                      else datetime.fromisoformat(str(signal_generated_at).replace("Z", "+00:00"))
                  )
              except (TypeError, ValueError):
                  return False
              if signal_at.tzinfo is None:
                  signal_at = signal_at.replace(tzinfo=timezone.utc)
              signal_at = signal_at.astimezone(timezone.utc)
              for market in markets:
                  if not isinstance(market, dict) or not _is_ft_team_total_market(market):
                      continue
                  raw_update = market.get("provider_update")
                  if not raw_update:
                      continue
                  try:
                      update = raw_update if isinstance(raw_update, datetime) else datetime.fromisoformat(str(raw_update).replace("Z", "+00:00"))
                  except (TypeError, ValueError):
                      continue
                  if update.tzinfo is None:
                      update = update.replace(tzinfo=timezone.utc)
                  if update.astimezone(timezone.utc) > signal_at:
                      return True
              return False


          def _team_total_utc_datetime(value: Any) -> datetime | None:
              if value is None:
                  return None
              if isinstance(value, datetime):
                  out = value
              else:
                  try:
                      out = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  except (TypeError, ValueError):
                      return None
              if out.tzinfo is None:
                  out = out.replace(tzinfo=timezone.utc)
              return out.astimezone(timezone.utc)


          def _team_total_selection_side(value: Any) -> str | None:
              text = _norm(value)
              if text.startswith("over"):
                  return "over"
              if text.startswith("under"):
                  return "under"
              return None


          def _team_total_signal_line(row: dict[str, Any]) -> float | None:
              line = _num(row.get("line"))
              if line is not None:
                  return line
              _selection, parsed_line = _parse_value(row.get("selection"))
              return parsed_line


          def _team_total_snapshot_matches_signal(
              market: dict[str, Any],
              signal_row: dict[str, Any],
          ) -> bool:
              """Mirror Phase17 comparability for one persisted Team Total signal row."""
              if not isinstance(market, dict) or not isinstance(signal_row, dict):
                  return False
              if not _is_ft_team_total_market(market):
                  return False
              if _norm(market.get("market")) != _norm(signal_row.get("market")):
                  return False

              target_line = _team_total_signal_line(signal_row)
              target_side = _team_total_selection_side(signal_row.get("selection"))
              if target_line is None or target_side is None:
                  return False

              values = market.get("values")
              if not isinstance(values, list):
                  return False
              normalized = _normalize_market_values(str(market.get("market") or ""), values)
              for value in normalized:
                  if not isinstance(value, dict):
                      continue
                  value_line = _num(value.get("line"))
                  if value_line is None or abs(value_line - target_line) >= 1e-6:
                      continue
                  if _team_total_selection_side(value.get("selection")) != target_side:
                      continue
                  price = _num(value.get("decimal_price"))
                  if price is not None and price > 1.0:
                      return True
              return False


          def _team_totals_have_comparable_provider_quote_after(
              markets: list[dict[str, Any]],
              signal_rows: list[dict[str, Any]],
              signal_generated_at: Any,
              *,
              kickoff: Any = None,
          ) -> bool:
              """True only when a persisted later quote is Phase17-comparable to a Team Total signal."""
              signal_at = _team_total_utc_datetime(signal_generated_at)
              kickoff_at = _team_total_utc_datetime(kickoff)
              if signal_at is None or not isinstance(signal_rows, list):
                  return False

              for market in markets:
                  if not isinstance(market, dict) or not _is_ft_team_total_market(market):
                      continue
                  captured_at = _team_total_utc_datetime(market.get("captured_at"))
                  provider_update = _team_total_utc_datetime(market.get("provider_update"))
                  if captured_at is None or provider_update is None:
                      continue
                  if captured_at <= signal_at or provider_update <= signal_at:
                      continue
                  if kickoff_at is not None and captured_at >= kickoff_at:
                      continue
                  if any(
                      _team_total_snapshot_matches_signal(market, signal_row)
                      for signal_row in signal_rows
                      if isinstance(signal_row, dict)
                  ):
                      return True
              return False


          def _load_team_totals_maturation_backlog(
              *,
              lookback_days: int = TEAM_TOTALS_DIVERSITY_LOOKBACK_DAYS,
              lookahead_minutes: int = TEAM_TOTALS_MATURATION_LOOKAHEAD_MINUTES,
              limit: int = TEAM_TOTALS_MATURATION_BACKLOG_LIMIT,
          ) -> dict[str, Any]:
              """Load strict-captured Team Totals fixtures still missing a comparable later provider quote.

              Provider-call free. A fixture leaves this backlog only after at least one
              persisted modeled Team Total signal has a strictly later pre-kickoff quote
              with the same normalized market, side and line. This mirrors the Phase17
              comparability contract instead of treating any later Team Total update as
              sufficient maturation.
              """
              empty = {
                  "candidate_events": [],
                  "candidate_count": 0,
                  "source": "POSTGRES_NOT_CONFIGURED",
              }
              if not persistence.persistence_configured():
                  return empty

              persistence.ensure_schema()
              now = datetime.now(timezone.utc)
              lookback_cutoff = now - timedelta(days=max(1, int(lookback_days)))
              lookahead_cutoff = now + timedelta(minutes=max(20, int(lookahead_minutes)))
              bounded_limit = max(1, int(limit))
              candidate_pool_limit = max(bounded_limit, bounded_limit * 4)

              with persistence._connect() as conn:
                  with conn.cursor() as cur:
                      cur.execute(
                          """
                          WITH strict_capture AS (
                              SELECT DISTINCT e.fixture_id
                              FROM soccer_refresh_events e
                              JOIN soccer_fixtures f ON f.fixture_id = e.fixture_id
                              WHERE e.generated_at >= %s
                                AND e.generated_at < f.kickoff
                                AND COALESCE(
                                      e.payload -> 'team_totals_diversity_capture' ->> 'qualifies',
                                      'false'
                                    ) = 'true'
                          ),
                          modeled_signal AS (
                              SELECT DISTINCT ON (e.fixture_id)
                                  e.fixture_id,
                                  e.generated_at AS signal_generated_at,
                                  COALESCE(
                                      e.payload -> 'team_totals_intelligence' -> 'observed_exact_market_rows',
                                      '[]'::jsonb
                                  ) AS signal_rows
                              FROM soccer_refresh_events e
                              JOIN soccer_fixtures f ON f.fixture_id = e.fixture_id
                              WHERE e.generated_at >= %s
                                AND e.generated_at < f.kickoff
                                AND (
                                      CASE
                                          WHEN jsonb_typeof(
                                              COALESCE(
                                                  e.payload -> 'team_totals_intelligence' -> 'observed_exact_market_rows',
                                                  '[]'::jsonb
                                              )
                                          ) = 'array'
                                          THEN jsonb_array_length(
                                              COALESCE(
                                                  e.payload -> 'team_totals_intelligence' -> 'observed_exact_market_rows',
                                                  '[]'::jsonb
                                              )
                                          )
                                          ELSE 0
                                      END
                                    ) > 0
                              ORDER BY e.fixture_id, e.generated_at DESC
                          )
                          SELECT
                              f.fixture_id,
                              f.league_id,
                              f.league,
                              f.country,
                              f.season,
                              f.round,
                              f.kickoff,
                              f.status,
                              f.status_long,
                              f.home_team_id,
                              f.home_team,
                              f.away_team_id,
                              f.away_team,
                              f.venue,
                              f.city,
                              ms.signal_generated_at,
                              ms.signal_rows
                          FROM strict_capture sc
                          JOIN modeled_signal ms ON ms.fixture_id = sc.fixture_id
                          JOIN soccer_fixtures f ON f.fixture_id = sc.fixture_id
                          WHERE f.kickoff > %s
                            AND f.kickoff <= %s
                            AND COALESCE(f.status, 'NS') NOT IN ('FT','AET','PEN','CANC','PST','ABD','AWD','WO')
                          ORDER BY f.kickoff ASC, ms.signal_generated_at ASC
                          LIMIT %s
                          """,
                          (
                              lookback_cutoff,
                              lookback_cutoff,
                              now,
                              lookahead_cutoff,
                              candidate_pool_limit,
                          ),
                      )
                      rows = cur.fetchall()
                      columns = [desc.name for desc in cur.description]

              candidates = [dict(zip(columns, raw_row)) for raw_row in rows]
              snapshots_by_fixture: dict[int, list[dict[str, Any]]] = defaultdict(list)
              fixture_ids = sorted({
                  int(row["fixture_id"])
                  for row in candidates
                  if row.get("fixture_id") is not None
              })
              if fixture_ids:
                  with persistence._connect() as conn:
                      with conn.cursor() as cur:
                          cur.execute(
                              """
                              SELECT
                                  m.fixture_id,
                                  m.captured_at,
                                  m.bookmaker_id,
                                  m.bookmaker,
                                  m.market_id,
                                  m.market,
                                  m.values,
                                  m.provider_update
                              FROM soccer_market_snapshots m
                              JOIN soccer_fixtures f ON f.fixture_id = m.fixture_id
                              WHERE m.fixture_id = ANY(%s)
                                AND m.provider_update IS NOT NULL
                                AND m.captured_at < f.kickoff
                                AND (
                                      m.market_id IN (16, 17)
                                      OR LOWER(TRIM(COALESCE(m.market, ''))) IN (
                                          'total - home',
                                          'total home',
                                          'total - away',
                                          'total away',
                                          'home team total goals',
                                          'away team total goals',
                                          'home team goals over/under',
                                          'away team goals over/under'
                                      )
                                    )
                              ORDER BY m.fixture_id, m.captured_at ASC
                              """,
                              (fixture_ids,),
                          )
                          snapshot_columns = [desc.name for desc in cur.description]
                          for raw_snapshot in cur.fetchall():
                              snapshot = dict(zip(snapshot_columns, raw_snapshot))
                              if snapshot.get("fixture_id") is not None:
                                  snapshots_by_fixture[int(snapshot["fixture_id"])].append(snapshot)

              candidate_events: list[dict[str, Any]] = []
              for row in candidates:
                  fixture_id = int(row["fixture_id"])
                  kickoff = row.get("kickoff")
                  signal_at = row.get("signal_generated_at")
                  signal_rows = row.get("signal_rows")
                  if isinstance(signal_rows, str):
                      try:
                          signal_rows = json.loads(signal_rows)
                      except json.JSONDecodeError:
                          signal_rows = []
                  if not isinstance(signal_rows, list):
                      signal_rows = []

                  if _team_totals_have_comparable_provider_quote_after(
                      snapshots_by_fixture.get(fixture_id, []),
                      signal_rows,
                      signal_at,
                      kickoff=kickoff,
                  ):
                      continue

                  fixture = {
                      "fixture_id": row.get("fixture_id"),
                      "league_id": row.get("league_id"),
                      "league": row.get("league"),
                      "country": row.get("country"),
                      "season": row.get("season"),
                      "round": row.get("round"),
                      "kickoff": kickoff.isoformat() if isinstance(kickoff, datetime) else kickoff,
                      "status": row.get("status"),
                      "status_long": row.get("status_long"),
                      "home_team_id": row.get("home_team_id"),
                      "home_team": row.get("home_team"),
                      "away_team_id": row.get("away_team_id"),
                      "away_team": row.get("away_team"),
                      "venue": row.get("venue"),
                      "city": row.get("city"),
                  }
                  candidate_events.append({
                      "event_type": TEAM_TOTALS_SPILLOVER_EVENT_TYPE,
                      "stage": _maturation_stage(kickoff, now),
                      "fixture": fixture,
                      "classification": "RESEARCH_ONLY",
                      "bet_eligible": False,
                      "research_only": True,
                      "decision_weight": 0.0,
                      "team_totals_clv_maturation": {
                          "candidate_source": "POSTGRES_STRICT_CAPTURE_MODELED_NO_LATER_COMPARABLE_QUOTE",
                          "signal_generated_at": signal_at.isoformat() if isinstance(signal_at, datetime) else signal_at,
                          "provider_requests_before_price_resolver": 0,
                          "primary_markets_preempted": False,
                          "requires_provider_update_after_signal": True,
                          "requires_phase17_comparable_market_side_line": True,
                      },
                  })
                  if len(candidate_events) >= bounded_limit:
                      break

              return {
                  "candidate_events": candidate_events,
                  "candidate_count": len(candidate_events),
                  "source": "POSTGRES_TEAM_TOTALS_CLV_MATURATION_BACKLOG",
              }


          '''

          text = text[:start] + replacement + text[end:]
          target.write_text(text, encoding="utf-8")

          tests = Path("tests/test_price_resolver_v4.py")
          test_text = tests.read_text(encoding="utf-8")
          sentinel = "def test_team_totals_comparable_maturation_rejects_other_team_market():"
          if sentinel not in test_text:
              test_text += r'''


def _comparable_tt_snapshot(*, market, values, captured_at="2026-09-25T05:45:00+00:00", provider_update="2026-09-25T05:44:00+00:00", bookmaker="Book B"):
    return {
        "fixture_id": 9901,
        "market_id": 16 if "home" in market.lower() else 17,
        "market": market,
        "bookmaker": bookmaker,
        "captured_at": captured_at,
        "provider_update": provider_update,
        "values": values,
    }


def test_team_totals_comparable_maturation_rejects_other_team_market():
    signal_at = "2026-09-25T05:20:00+00:00"
    signals = [{"market": "Total - Home", "selection": "Over", "line": 1.5}]
    snapshots = [_comparable_tt_snapshot(
        market="Total - Away",
        values=[
            {"selection": "Over", "line": 1.5, "decimal_price": 1.90},
            {"selection": "Under", "line": 1.5, "decimal_price": 1.90},
        ],
    )]
    assert not v._team_totals_have_comparable_provider_quote_after(
        snapshots, signals, signal_at, kickoff="2026-09-25T06:00:00+00:00"
    )


def test_team_totals_comparable_maturation_rejects_different_line():
    signal_at = "2026-09-25T05:20:00+00:00"
    signals = [{"market": "Total - Home", "selection": "Over", "line": 1.5}]
    snapshots = [_comparable_tt_snapshot(
        market="Total - Home",
        values=[
            {"selection": "Over", "line": 2.5, "decimal_price": 1.95},
            {"selection": "Under", "line": 2.5, "decimal_price": 1.85},
        ],
    )]
    assert not v._team_totals_have_comparable_provider_quote_after(
        snapshots, signals, signal_at, kickoff="2026-09-25T06:00:00+00:00"
    )


def test_team_totals_comparable_maturation_rejects_missing_target_side():
    signal_at = "2026-09-25T05:20:00+00:00"
    signals = [{"market": "Total - Home", "selection": "Over", "line": 1.5}]
    snapshots = [_comparable_tt_snapshot(
        market="Total - Home",
        values=[{"selection": "Under", "line": 1.5, "decimal_price": 1.90}],
    )]
    assert not v._team_totals_have_comparable_provider_quote_after(
        snapshots, signals, signal_at, kickoff="2026-09-25T06:00:00+00:00"
    )


def test_team_totals_comparable_maturation_accepts_exact_market_side_line_other_book():
    signal_at = "2026-09-25T05:20:00+00:00"
    signals = [{
        "market": "Total - Home",
        "selection": "Over",
        "line": 1.5,
        "bookmaker": "Book A",
    }]
    snapshots = [_comparable_tt_snapshot(
        market="Total - Home",
        bookmaker="Book B",
        values=[
            {"selection": "Over", "line": 1.5, "decimal_price": 2.02},
            {"selection": "Under", "line": 1.5, "decimal_price": 1.80},
        ],
    )]
    assert v._team_totals_have_comparable_provider_quote_after(
        snapshots, signals, signal_at, kickoff="2026-09-25T06:00:00+00:00"
    )
'''
              tests.write_text(test_text, encoding="utf-8")
          PY

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_gateway/requirements.txt pytest

      - name: Validate syntax and focused regression suite
        run: |
          python -m py_compile mcp_gateway/price_resolver_v4.py
          PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider tests/test_price_resolver_v4.py

      - name: Commit validated patch
        run: |
          if git diff --quiet -- mcp_gateway/price_resolver_v4.py tests/test_price_resolver_v4.py; then
            echo "Patch already applied; nothing to commit."
            exit 0
          fi
          git config user.name "soccer-edge-automation"
          git config user.email "actions@users.noreply.github.com"
          git add mcp_gateway/price_resolver_v4.py tests/test_price_resolver_v4.py
          git commit -m "phase17: require comparable Team Totals maturation quote"
          git push origin HEAD:soccer-edge-mcp-v1
