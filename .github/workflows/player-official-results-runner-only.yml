name: Soccer Official Player Results - Isolated Bounded Capture

# Bounded official outcome collection: no Render worker, 3 fixtures/run by default.
# Offline QA on PRs; live collection on UTC daily schedule or manual dispatch.
on:
  # Verified live capture 2026-11-09: 2 calls, daily remaining 7443.
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
    inputs:
      fixture_date:
        description: "Completed match date in America/Mexico_City (blank = yesterday, max 7d back)"
        required: false
        type: string
      max_fixtures:
        description: "Maximum finalized fixtures to capture (1..5)"
        required: true
        default: "3"
        type: choice
        options: ["1", "2", "3", "4", "5"]
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/player_official_results_runner.py"
      - ".github/workflows/player-official-results-runner-only.yml"

permissions:
  contents: read

concurrency:
  group: player-stats-runner-only-registry
  cancel-in-progress: false

jobs:
  offline-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No-network offline correctness and security gates
        run: |
          set -euo pipefail
          python .github/scripts/player_official_results_runner.py --self-test
          python - <<'PY'
          from pathlib import Path
          script = Path(".github/scripts/player_official_results_runner.py").read_text()
          workflow = Path(".github/workflows/player-official-results-runner-only.yml").read_text()
          assert "MAX_FIXTURES_PER_RUN = 5" in script
          assert "MIN_DAILY_REMAINING = 1000" in script
          assert "production_promotion_allowed" in script
          assert "eligible_for_historical_oos_reconstruction" in script
          import re
          assert "soccer-edge-api.onrender.com" not in script
          assert "/internal/" not in script
          assert not re.search(r"^\s*id-token:\s*write\s*$", workflow, flags=re.M)
          assert "  schedule:" in workflow
          assert 'cron: "23 9 * * *"' in workflow
          assert ('API_FOOTBALL_KEY: ' + chr(36) + '{{ secrets.API_FOOTBALL_KEY }}') in workflow
          assert ('FIXTURE_DATE_INPUT: ' + chr(36) + '{{ inputs.fixture_date }}') in workflow
          assert ('FIXTURE_CAP_INPUT: ' + chr(36) + '{{ inputs.max_fixtures }}') in workflow
          print("OFFLINE_SECURITY_GATES_PASS: QUOTA_GUARDED_DAILY, NO_RENDER, RESEARCH_ONLY")
          PY

  capture:
    if: github.event_name != 'pull_request'
    needs: offline-gates
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: controls
          fetch-depth: 1
      - uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture bounded final-time player statistics in runner memory only
        shell: bash
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FIXTURE_DATE_INPUT: ${{ inputs.fixture_date }}
          FIXTURE_CAP_INPUT: ${{ inputs.max_fixtures }}
        run: |
          set -euo pipefail
          if [[ -z "${API_FOOTBALL_KEY:-}" ]]; then
            echo "REQUIRED_SECRET_NOT_CONFIGURED: API_FOOTBALL_KEY" >&2
            exit 1
          fi
          args=(--registry state/soccer_edge_state/analysis/player_trend_registry_backfill.json --max-fixtures "${FIXTURE_CAP_INPUT:-3}")
          if [[ -n "${FIXTURE_DATE_INPUT:-}" ]]; then
            args+=(--date "$FIXTURE_DATE_INPUT")
          fi
          python controls/.github/scripts/player_official_results_runner.py "${args[@]}" | tee /tmp/player_official_runner_summary.json
          jq -e '
            .production_promotion_allowed == false
            and .provider_requests_added <= 6
            and (.status == "RESEARCH_ONLY_POSTGAME_CAPTURE")
            and (.errors | length == 0)
            and (.daily_remaining_reported >= 1000)
          ' /tmp/player_official_runner_summary.json >/dev/null

      - name: Commit only future-registry research observations
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/player_trend_registry_backfill.json
          if git diff --cached --quiet; then
            echo "No new verified observations; no state write"
            exit 0
          fi
          git commit -m "Collect bounded official postgame player outcomes for future-only registry"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
