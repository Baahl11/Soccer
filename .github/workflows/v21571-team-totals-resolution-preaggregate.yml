name: v215.7.1 Team Totals Resolution Preaggregate

on:
  push:
    paths:
      - '.github/workflows/v21571-team-totals-resolution-preaggregate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Team Totals resolution query
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('mcp_gateway/team_totals_clv_anchor_v4.py')
          text = path.read_text()
          text = text.replace(
              'MODEL_VERSION = "SOCCER_TEAM_TOTALS_CLV_ANCHOR_V4_1.0.0"',
              'MODEL_VERSION = "SOCCER_TEAM_TOTALS_CLV_ANCHOR_V4_1.0.1"',
          )
          start = text.index('    query = """')
          end = text.index('\n\n    with price.persistence._connect()', start)
          query = '''    query = """
        WITH bounds AS (
            SELECT
                %s::timestamptz AS cutoff,
                %s::timestamptz AS now_utc,
                %s::timestamptz AS lookahead
        ),
        upcoming_fixtures AS MATERIALIZED (
            SELECT f.*
            FROM soccer_fixtures f
            CROSS JOIN bounds b
            WHERE f.kickoff > b.now_utc
              AND f.kickoff <= b.lookahead
              AND COALESCE(f.status, 'NS') NOT IN ('FT','AET','PEN','CANC','PST','ABD','AWD','WO')
        ),
        base_events AS MATERIALIZED (
            SELECT
                e.fixture_id,
                e.generated_at,
                e.payload,
                f.league_id,
                f.league,
                f.country,
                f.season,
                f.round,
                f.kickoff,
                f.status,
                f.status_long,
                f.home_team_id,
                f.home_team,
                f.away_team_id,
                f.away_team,
                f.venue,
                f.city
            FROM soccer_refresh_events e
            JOIN upcoming_fixtures f ON f.fixture_id = e.fixture_id
            CROSS JOIN bounds b
            WHERE e.generated_at >= b.cutoff
              AND e.generated_at < f.kickoff
        ),
        strict_capture AS MATERIALIZED (
            SELECT DISTINCT be.fixture_id
            FROM base_events be
            WHERE COALESCE(
                      be.payload -> 'team_totals_diversity_capture' ->> 'qualifies',
                      'false'
                  ) = 'true'
        ),
        candidate_signal AS MATERIALIZED (
            SELECT
                be.fixture_id,
                sig.row ->> 'market' AS market,
                LOWER(TRIM(COALESCE(sig.row ->> 'market', ''))) AS market_norm,
                sig.row ->> 'selection' AS selection,
                CASE
                    WHEN LOWER(TRIM(COALESCE(sig.row ->> 'selection', ''))) LIKE 'over%%' THEN 'over'
                    WHEN LOWER(TRIM(COALESCE(sig.row ->> 'selection', ''))) LIKE 'under%%' THEN 'under'
                    ELSE LOWER(TRIM(COALESCE(sig.row ->> 'selection', '')))
                END AS selection_norm,
                sig.row ->> 'line' AS line,
                (sig.row ->> 'line')::NUMERIC AS line_num,
                be.generated_at AS signal_generated_at,
                be.league_id,
                be.league,
                be.country,
                be.season,
                be.round,
                be.kickoff,
                be.status,
                be.status_long,
                be.home_team_id,
                be.home_team,
                be.away_team_id,
                be.away_team,
                be.venue,
                be.city
            FROM base_events be
            JOIN strict_capture sc ON sc.fixture_id = be.fixture_id
            CROSS JOIN LATERAL jsonb_array_elements(
                CASE
                    WHEN jsonb_typeof(
                        COALESCE(
                            be.payload -> 'team_totals_intelligence' -> 'observed_exact_market_rows',
                            '[]'::jsonb
                        )
                    ) = 'array'
                    THEN COALESCE(
                        be.payload -> 'team_totals_intelligence' -> 'observed_exact_market_rows',
                        '[]'::jsonb
                    )
                    ELSE '[]'::jsonb
                END
            ) AS sig(row)
            WHERE NULLIF(sig.row ->> 'market', '') IS NOT NULL
              AND NULLIF(sig.row ->> 'selection', '') IS NOT NULL
              AND COALESCE(sig.row ->> 'line', '') ~ '^[0-9]+([.][0-9]+)?$'
              AND COALESCE(sig.row ->> 'decimal_price', sig.row ->> 'price', '') ~ '^[0-9]+([.][0-9]+)?$'
              AND COALESCE(sig.row ->> 'decimal_price', sig.row ->> 'price')::DOUBLE PRECISION > 1.0
        ),
        exact_snapshot_resolution AS MATERIALIZED (
            SELECT
                m.fixture_id,
                LOWER(TRIM(COALESCE(m.market, ''))) AS market_norm,
                CASE
                    WHEN LOWER(TRIM(COALESCE(q.value ->> 'selection', ''))) LIKE 'over%%' THEN 'over'
                    WHEN LOWER(TRIM(COALESCE(q.value ->> 'selection', ''))) LIKE 'under%%' THEN 'under'
                    ELSE LOWER(TRIM(COALESCE(q.value ->> 'selection', '')))
                END AS selection_norm,
                (q.value ->> 'line')::NUMERIC AS line_num,
                MAX(LEAST(m.captured_at, m.provider_update)) AS latest_resolution_at
            FROM soccer_market_snapshots m
            JOIN upcoming_fixtures f ON f.fixture_id = m.fixture_id
            CROSS JOIN LATERAL jsonb_array_elements(
                CASE
                    WHEN jsonb_typeof(COALESCE(m.values, '[]'::jsonb)) = 'array'
                    THEN COALESCE(m.values, '[]'::jsonb)
                    ELSE '[]'::jsonb
                END
            ) AS q(value)
            WHERE m.captured_at < f.kickoff
              AND m.provider_update IS NOT NULL
              AND COALESCE(q.value ->> 'line', '') ~ '^[0-9]+([.][0-9]+)?$'
            GROUP BY
                m.fixture_id,
                LOWER(TRIM(COALESCE(m.market, ''))),
                CASE
                    WHEN LOWER(TRIM(COALESCE(q.value ->> 'selection', ''))) LIKE 'over%%' THEN 'over'
                    WHEN LOWER(TRIM(COALESCE(q.value ->> 'selection', ''))) LIKE 'under%%' THEN 'under'
                    ELSE LOWER(TRIM(COALESCE(q.value ->> 'selection', '')))
                END,
                (q.value ->> 'line')::NUMERIC
        ),
        oldest_unresolved_signal AS (
            SELECT DISTINCT ON (
                cs.fixture_id,
                cs.market_norm,
                cs.selection_norm,
                cs.line_num
            )
                cs.fixture_id,
                cs.market,
                cs.selection,
                cs.line,
                cs.signal_generated_at,
                cs.league_id,
                cs.league,
                cs.country,
                cs.season,
                cs.round,
                cs.kickoff,
                cs.status,
                cs.status_long,
                cs.home_team_id,
                cs.home_team,
                cs.away_team_id,
                cs.away_team,
                cs.venue,
                cs.city
            FROM candidate_signal cs
            LEFT JOIN exact_snapshot_resolution resolution
              ON resolution.fixture_id = cs.fixture_id
             AND resolution.market_norm = cs.market_norm
             AND resolution.selection_norm = cs.selection_norm
             AND ABS(resolution.line_num - cs.line_num) < 0.000001
            WHERE resolution.latest_resolution_at IS NULL
               OR resolution.latest_resolution_at <= cs.signal_generated_at
            ORDER BY
                cs.fixture_id,
                cs.market_norm,
                cs.selection_norm,
                cs.line_num,
                cs.signal_generated_at ASC
        )
        SELECT ous.*
        FROM oldest_unresolved_signal ous
        ORDER BY
            ous.kickoff ASC,
            ous.fixture_id ASC,
            ous.signal_generated_at ASC,
            ous.market ASC,
            ous.selection ASC,
            (ous.line)::NUMERIC ASC
        LIMIT %s
    """'''
          path.write_text(text[:start] + query + text[end:])

          test_path = Path('tests/test_team_totals_clv_anchor_v4.py')
          tests = test_path.read_text()
          tests = tests.replace(
              '    assert "m.captured_at > cs.signal_generated_at" in normalized\n'
              '    assert "m.provider_update > cs.signal_generated_at" in normalized\n'
              '    assert "(q.value ->> \'line\')::NUMERIC - (cs.line)::NUMERIC" in normalized\n',
              '    assert "exact_snapshot_resolution AS MATERIALIZED" in normalized\n'
              '    assert "MAX(LEAST(m.captured_at, m.provider_update))" in normalized\n'
              '    assert "LEFT JOIN exact_snapshot_resolution resolution" in normalized\n'
              '    assert "resolution.latest_resolution_at <= cs.signal_generated_at" in normalized\n'
              '    assert "ABS(resolution.line_num - cs.line_num) < 0.000001" in normalized\n',
          )
          tests = tests.replace(
              'assert payload["version"] == "4.38.3-team-totals-clv-anchor-repair"',
              'assert payload["version"] == "4.38.4-team-totals-clv-anchor-scan-optimization"',
          )
          test_path.write_text(tests)

          auto_path = Path('mcp_gateway/automation_v129.py')
          auto = auto_path.read_text()
          auto = auto.replace(
              'AUTOMATION_VERSION = "4.38.3-team-totals-clv-anchor-repair"',
              'AUTOMATION_VERSION = "4.38.4-team-totals-clv-anchor-scan-optimization"',
          )
          auto = auto.replace(
              '        "schema_version": "1.0.0",\n        "status": "ACTIVE_OLDEST_UNRESOLVED_EXACT_TEAM_TOTAL_SIGNAL",',
              '        "schema_version": "1.0.1",\n        "status": "ACTIVE_OLDEST_UNRESOLVED_EXACT_TEAM_TOTAL_SIGNAL",\n        "query_strategy": "PREAGGREGATED_EXACT_SNAPSHOT_RESOLUTION",',
          )
          auto_path.write_text(auto)
          PY
      - name: Validate hotfix
        shell: bash
        run: |
          python -m py_compile mcp_gateway/team_totals_clv_anchor_v4.py mcp_gateway/automation_v129.py
          python -m pip install -q pytest
          pytest -q tests/test_team_totals_clv_anchor_v4.py tests/test_derivative_clv_anchor_v4.py tests/test_primary_clv_anchor_v4.py
      - name: Commit validated runtime hotfix
        shell: bash
        run: |
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add mcp_gateway/team_totals_clv_anchor_v4.py mcp_gateway/automation_v129.py tests/test_team_totals_clv_anchor_v4.py
          git diff --cached --quiet && exit 0
          git commit -m "v215.7.1 preaggregate Team Totals quote resolution"
          git push origin HEAD:soccer-edge-mcp-v1
