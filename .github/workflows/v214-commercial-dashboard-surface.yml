name: v214 Commercial Dashboard Surface

on:
  workflow_dispatch:
  push:
    branches:
      - v214-commercial-dashboard-surface
    paths:
      - mcp_gateway/product_dashboard_v4.py
      - tests/test_v214_commercial_dashboard_surface.py
      - tests/test_phase24_product_dashboard_v4.py
      - .github/workflows/v214-commercial-dashboard-surface.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Compile dashboard renderer
        run: python -m py_compile mcp_gateway/product_dashboard_v4.py
      - name: Run subscriber and operator regressions
        run: |
          PYTHONPATH=. pytest -q tests/test_v214_commercial_dashboard_surface.py tests/test_phase24_product_dashboard_v4.py
