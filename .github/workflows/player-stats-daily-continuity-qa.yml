name: Soccer Player Stats Daily Continuity - Static QA
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/player-props-postgame-backfill.yml"
      - ".github/workflows/player-trend-registry-backfill.yml"
      - ".github/workflows/player-props-oos-validation.yml"
      - ".github/workflows/v2-price-bridge-verification.yml"
      - ".github/workflows/player-stats-daily-continuity-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schedule-and-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert independently verified postgame/registry cron chain
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path(".github/workflows")
          back=(root/"player-props-postgame-backfill.yml").read_text()
          reg=(root/"player-trend-registry-backfill.yml").read_text()
          oos=(root/"player-props-oos-validation.yml").read_text()
          # Production 512MiB OOM proved daily heavy backfill unsafe.
          # Manual OIDC and future-only guards remain available.
          assert back.count("- cron:") == 0
          assert reg.count("- cron:") == 0
          assert "Automatic Render backfill DISABLED" in back
          assert "Automatic Render backfill DISABLED" in reg
          assert 'id-token: write' in back and 'id-token: write' in reg
          assert '"max_fixtures":5' in back
          assert '"max_fixtures":16' in reg
          assert "future_registry_use_only == true" in reg
          assert "retroactive_pregame_signal_created == false" in reg
          assert "eligible_for_historical_oos_reconstruction == false" in reg
          assert "production_promotion_allowed == false" in back
          assert "production_promotion_allowed == false" in oos
          assert '"Player Props Postgame Backfill"' in oos
          assert "workflows:" in oos and "workflow_run:" in oos
          assert "soccer-edge-db-heavy-runtime" in oos
          audit=(root/"v2-price-bridge-verification.yml").read_text()
          assert "FE11_PLAYER_SPORT_FIRST_OFFER_BRIDGE_v1.0" in audit
          assert ".player_sport_readiness.prices_used_to_select == false" in audit
          assert ".player_sport_readiness.provider_requests_added == 0" in audit
          assert "player_sport_model_readiness" in audit
          print("Blocked unsafe player backfill cron; OIDC and source/OOS contracts intact PASS")
          PY
