# v216.11 live-runtime Player Props CLV refresh 2026-10-02
name: Player Props True CLV Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "40 9 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/player-props-clv-validation.yml"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: player-props-true-clv-validation-v21611-live-runtime
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect live Player Props close diagnostics
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 60 https://soccer-edge-api.onrender.com/health >/tmp/health.json
          jq -e '.status == "ok" and .database_persistence_configured == true and ((.render_git_commit // "") | length) > 0' /tmp/health.json >/dev/null
          echo "LIVE_RENDER_COMMIT=$(jq -r '.render_git_commit' /tmp/health.json)"

          response=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          TOKEN=$(echo "$response" | jq -r '.value // empty')
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          HTTP_CODE=$(curl -sS --max-time 180 -o /tmp/player_props_clv.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"lookback_days":180,"max_rows":2000}' \
            https://soccer-edge-api.onrender.com/internal/player-props-clv-v4/build)

          echo "HTTP_CODE=$HTTP_CODE"
          jq '{
            status,
            event_rows_loaded,
            signal_rows,
            snapshot_rows,
            true_clv_rows,
            unique_fixtures,
            skip_reasons,
            close_diagnostics,
            families,
            signal_family_summary: (
              .signal_diagnostics.families
              | with_entries(.value |= {
                  intelligence_event_rows,
                  market_overlap_event_rows,
                  market_rows,
                  raw_market_values,
                  aligned_market_values,
                  priced_overlap_values,
                  model_probability_values,
                  signal_rows,
                  sidecar_capture_status,
                  probability_failure_reasons
                })
            ),
            provider_requests_added,
            production_promotion_allowed
          }' /tmp/player_props_clv.json

          test "$HTTP_CODE" = "200"
          jq -e '.provider_requests_added == 0 and .production_promotion_allowed == false and (.rows | type == "array")' /tmp/player_props_clv.json >/dev/null
