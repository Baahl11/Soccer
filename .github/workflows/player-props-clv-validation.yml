# v238 live validate fair snapshot coverage and oldest prop anchors
# v236.4 bound Player Props CLV to 500 rows on 512MB Render
# v236.2 rerun after bounded Cards Props evidence materialization
# v236.2 bounded Player Props CLV diagnostic to 500 rows on 512MB Render
# v236 serialize DB-heavy runtime workflows to prevent Render 502 contention
# v234 continuous completion refresh 2026-10-05
# v217 expose SHOTS anchor diagnostics 2026-10-02
# v217 canonical SHOTS validation trigger 2026-10-02
# v217.1 canonical SHOTS validation trigger 2026-10-02
# v217.2 canonical SHOTS diagnostics trigger 2026-10-02
name: Player Props True CLV Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "40 9 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/player-props-clv-validation.yml"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: soccer-edge-db-heavy-runtime
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical state for durable Player Props reports
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 0
          sparse-checkout: |
            soccer_edge_state/analysis/player_props_clv_v4_report.json
            soccer_edge_state/analysis/player_props_clv_v4_tracking.jsonl
          sparse-checkout-cone-mode: false

      - name: Inspect live Player Props close diagnostics
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 60 https://soccer-edge-api.onrender.com/health >/tmp/health.json
          jq -e '.status == "ok" and .database_persistence_configured == true and ((.render_git_commit // "") | length) > 0' /tmp/health.json >/dev/null
          echo "LIVE_RENDER_COMMIT=$(jq -r '.render_git_commit' /tmp/health.json)"

          response=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          TOKEN=$(echo "$response" | jq -r '.value // empty')
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          HTTP_CODE=$(curl -sS --max-time 180 -o /tmp/player_props_clv.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"lookback_days":180,"max_rows":500}' \
            https://soccer-edge-api.onrender.com/internal/player-props-clv-v4/build)

          echo "HTTP_CODE=$HTTP_CODE"
          jq '{
            status,
            event_rows_loaded,
            signal_rows,
            snapshot_rows,
            true_clv_rows,
            unique_fixtures,
            skip_reasons,
            close_diagnostics,
            v217_shots_anchor_patch: .signal_diagnostics.v217_shots_anchor_patch,
            families,
            signal_family_summary: (
              .signal_diagnostics.families
              | with_entries(.value |= {
                  intelligence_event_rows,
                  market_overlap_event_rows,
                  market_rows,
                  raw_market_values,
                  aligned_market_values,
                  priced_overlap_values,
                  model_probability_values,
                  signal_rows,
                  sidecar_capture_status,
                  probability_failure_reasons
                })
            ),
            provider_requests_added,
            production_promotion_allowed
          }' /tmp/player_props_clv.json

          test "$HTTP_CODE" = "200"
          jq -e '.provider_requests_added == 0 and .production_promotion_allowed == false and (.rows | type == "array")' /tmp/player_props_clv.json >/dev/null

      - name: Validate and materialize bounded strict Player Props evidence
        shell: bash
        run: |
          set -euo pipefail
          REPORT=state/soccer_edge_state/analysis/player_props_clv_v4_report.json
          TRACK=state/soccer_edge_state/analysis/player_props_clv_v4_tracking.jsonl
          GENERATED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -e '
            .production_promotion_allowed == false
            and .provider_requests_added == 0
            and (.true_clv_rows | type) == "number"
            and (.rows | type) == "array"
            and .true_clv_rows == (.rows | length)
          ' /tmp/player_props_clv.json >/dev/null
          jq --arg generated "$GENERATED_AT_UTC" \
            '. + {research_report_generated_at_utc: $generated} | del(.rows)' \
            /tmp/player_props_clv.json > "$REPORT"
          jq -c '.rows[]' /tmp/player_props_clv.json > "$TRACK"
          # Zero is an honest absence of comparable strict closes, never an invented quote.
          jq -e '.true_clv_rows >= 0 and .production_promotion_allowed == false' "$REPORT" >/dev/null
          echo "Strict Player Props comparable rows: $(jq -r .true_clv_rows "$REPORT")"
          echo "Current tracked rows: $(wc -l < "$TRACK")"

      - name: Persist read-only Player Props CLV audit
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/player_props_clv_v4_report.json \
            soccer_edge_state/analysis/player_props_clv_v4_tracking.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist daily strict Player Props CLV research report"
          for attempt in 1 2 3 4 5; do
            git fetch origin soccer-edge-state
            if git rebase --autostash origin/soccer-edge-state \
              && git push origin HEAD:soccer-edge-state; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 3))
          done
          echo "::error::Unable to persist canonical Player Props CLV research"
          exit 1
