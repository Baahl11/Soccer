# v201.8 stage-trace 100-row diagnostic 2026-09-28
name: Player Props True CLV Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "40 9 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/player-props-clv-validation.yml"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: player-props-true-clv-validation-v2018-probe100
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe live isolated worker with 100 rows
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --max-time 60 https://soccer-edge-api.onrender.com/health >/tmp/health.json
          cat /tmp/health.json
          jq -e '.status == "ok" and .render_git_commit == "1700864c07857b5e36769d3c920a4e3b7dde8774" and .database_persistence_configured == true' /tmp/health.json >/dev/null

          response=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          TOKEN=$(echo "$response" | jq -r '.value // empty')
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          HTTP_CODE=$(curl -sS --max-time 180 -o /tmp/player_props_clv.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"lookback_days":180,"max_rows":100}' \
            https://soccer-edge-api.onrender.com/internal/player-props-clv-v4/build)
          echo "HTTP_CODE=$HTTP_CODE"
          head -c 2000 /tmp/player_props_clv.json || true
          echo
          test "$HTTP_CODE" = "200"
          jq -e '.provider_requests_added == 0 and .production_promotion_allowed == false and (.rows | type == "array")' /tmp/player_props_clv.json >/dev/null
