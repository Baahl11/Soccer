name: FE V2 Maturation Regression

on:
  push:
    branches:
      - feat/frontend-maturation-visibility-20261009
    paths:
      - mcp_gateway/subscriber_contract_v2.py
      - mcp_gateway/subscriber_frontend_v2.py
      - mcp_gateway/__init__.py
      - tests/test_subscriber_maturity_v2.py
      - .github/workflows/fe-v2-maturation-regression.yml
  pull_request:
    branches:
      - soccer-edge-mcp-v1
    paths:
      - mcp_gateway/subscriber_contract_v2.py
      - mcp_gateway/subscriber_frontend_v2.py
      - mcp_gateway/__init__.py
      - tests/test_subscriber_maturity_v2.py
      - .github/workflows/fe-v2-maturation-regression.yml

permissions:
  contents: read

jobs:
  maturation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_gateway/requirements.txt pytest
      - name: Compile updated modules
        run: |
          python -m py_compile mcp_gateway/subscriber_contract_v2.py mcp_gateway/subscriber_frontend_v2.py mcp_gateway/__init__.py
      - name: Run maturity/contract regression tests
        run: |
          PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider \
            tests/test_subscriber_maturity_v2.py \
            tests/test_subscriber_frontend_v2.py
