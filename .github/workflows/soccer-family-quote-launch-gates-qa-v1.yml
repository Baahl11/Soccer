name: Soccer Family-First Models, Quote Integrity and Launch Safety QA
on:
  pull_request:
    branches: [soccer-edge-mcp-v1]
    paths:
      - 'mcp_gateway/soccer_family_research_v1.py'
      - 'mcp_gateway/soccer_quote_research_v1.py'
      - 'mcp_gateway/soccer_oos_family_validation_v1.py'
      - 'mcp_gateway/soccer_launch_safety_v1.py'
      - 'mcp_gateway/soccer_model.py'
      - 'mcp_gateway/subscriber_billing_v2.py'
      - 'mcp_gateway/subscriber_contract_v2.py'
      - 'mcp_gateway/subscriber_frontend_v2.py'
      - 'tests/test_subscriber_contract_v2.py'
      - 'tests/test_subscriber_frontend_v2.py'
      - 'tests/test_soccer_family_quote_launch_gates_v1.py'
      - '.github/workflows/soccer-family-quote-launch-gates-qa-v1.yml'

permissions:
  contents: read

jobs:
  family-independent-sport-and-market:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded runtime and QA dependencies
        run: python -m pip install -r mcp_gateway/requirements.txt pytest
      # The legacy V220 assertions expect the removed old page title and ASGI
      # .router attr; they fail on the unchanged base branch. Test current
      # entitlement and regional billing code without masking live failures.
      - name: Independent twelve-market scoring, quote and billing anti-promotion tests
        run: |
          set -euo pipefail
          python -m compileall -q mcp_gateway/soccer_family_research_v1.py mcp_gateway/soccer_quote_research_v1.py mcp_gateway/soccer_oos_family_validation_v1.py mcp_gateway/soccer_launch_safety_v1.py mcp_gateway/soccer_model.py mcp_gateway/subscriber_billing_v2.py
          python -m pytest -q -c /dev/null --rootdir=. -p no:cacheprovider             tests/test_soccer_family_quote_launch_gates_v1.py             tests/test_v219_subscription_entitlements.py             tests/test_v226_regional_billing_live.py             tests/test_subscriber_contract_v2.py             tests/test_subscriber_frontend_v2.py
          python - <<'PY'
          from pathlib import Path
          files={p:Path('mcp_gateway/'+p).read_text() for p in (
            'soccer_family_research_v1.py','soccer_quote_research_v1.py',
            'soccer_oos_family_validation_v1.py','soccer_launch_safety_v1.py',
            'soccer_model.py','subscriber_billing_v2.py')}
          assert 'DIRECT_EXECUTABLE_BOOKMAKER_QUOTE_NOT_VERIFIED' in files['soccer_model.py']
          assert 'commercial_bet_eligible": False' in files['soccer_model.py']
          assert 'source_updated_at_utc' in files['soccer_family_research_v1.py']
          assert 'COMPARE' not in files['soccer_family_research_v1.py']
          assert 'true_clv":None' in files['soccer_quote_research_v1.py']
          assert 'SOCCER_PUBLIC_BILLING_ENABLED' in files['soccer_launch_safety_v1.py']
          assert 'soccer_launch_safety_v1.audit_launch_gates()' in files['subscriber_billing_v2.py']
          assert 'research_market_family_catalog' in files['soccer_family_research_v1.py']
          print('SOCCER_FAMILY_MODELS_EXECUTABLE_QUOTES_AND_BILLING_GATES_PASS')
          PY
