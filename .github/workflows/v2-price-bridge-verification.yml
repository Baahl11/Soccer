# FE11 live aggregate-only persisted history audit after Render 5cac30ed.
# SGP snapshot ingestion verification after bounded capture run on 2026-11-07T00:00Z.
# Verify after ASGI dispatch fix and Render deploy fb950fd.
# Re-run after secure bridge + runtime cap deployed.
name: Soccer V2 Private Price Bridge - OIDC Live Verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v2-price-bridge-verification.yml'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  read-only-bridge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate live Render / Supabase bridge without any research credentials
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          TOKEN=$(echo "$OIDC_JSON" | jq -r '.value // empty')
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          curl -fsS --max-time 60 -o /tmp/bridge.json -w "HTTP %{http_code}\n"             -H "Authorization: Bearer $TOKEN"             https://soccer-edge-api.onrender.com/internal/research-price-bridge-check
          jq -e '.status == "CONNECTED_RESEARCH_ONLY" and .source == "SUPABASE_PRIVATE_BRIDGE" and .bet_eligible == false and .tokens_exposed == false and (.fresh_research_rows | type == "number")' /tmp/bridge.json
          jq -e '(.sgp_direct_combo_quotes | type=="number") and (.sgp_player_component_quotes | type=="number") and .bet_eligible == false' /tmp/bridge.json
          jq -e '.render_cache_status == "READ_OK" and (.render_cached_sgp_rows | type == "number") and (.render_cached_sgp_fresh_rows | type == "number")' /tmp/bridge.json
          jq -e '.fe11_history_inventory.status == "VERIFIED_READ" and (.fe11_history_inventory.research_rows_persisted | type == "number") and (.fe11_history_inventory.current_pregame_profiles | type == "number") and .fe11_history_inventory.production_bets_authorized == false' /tmp/bridge.json
          jq '{fe11_history_inventory}' /tmp/bridge.json
          jq '{status,fresh_research_rows,sgp_direct_combo_quotes,sgp_recent_combo_quotes,sgp_player_component_quotes,sgp_raw_positive_research,render_cached_sgp_rows,render_cached_sgp_fresh_rows,render_cache_status,source,bet_eligible,tokens_exposed}' /tmp/bridge.json

      - name: Publish FE11 aggregate-only audit receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path("/tmp/bridge.json").read_text())
          inventory=src["fe11_history_inventory"]
          assert inventory.get("status")=="VERIFIED_READ"
          assert inventory.get("production_bets_authorized") is False
          safe={
              "audit":"FE11_PRIVATE_RENDER_HISTORICAL_SPORT_READINESS",
              "status":inventory["status"],
              "research_rows_persisted":inventory["research_rows_persisted"],
              "unique_fixtures":inventory["unique_fixtures"],
              "current_pregame_profiles":inventory["current_pregame_profiles"],
              "last_source_generated_at_utc":inventory.get("last_source_generated_at_utc"),
              "bookmaker_prices_exposed":False,
              "production_bets_authorized":False,
          }
          Path("/tmp/fe11_inventory.json").write_text(json.dumps(safe,indent=2)+"\n")
          print("FE11 retained rows:",safe["research_rows_persisted"],
                "current fixtures:",safe["current_pregame_profiles"])
          PY
          URL="https://api.github.com/repos/$GH_REPO/contents/fe11_inventory.json"
          SHA=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$URL?ref=frontend-audit-artifacts" | jq -r '.sha // empty')
          CONTENT=$(base64 -w0 /tmp/fe11_inventory.json)
          PAYLOAD=$(python - "$CONTENT" "$SHA" <<'PY'
          import json,sys
          p={"message":"Update FE11 aggregate-only private pipeline audit",
             "branch":"frontend-audit-artifacts","content":sys.argv[1]}
          if sys.argv[2]:p["sha"]=sys.argv[2]
          print(json.dumps(p))
          PY
          )
          curl -fsS --retry 2 --request PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD" "$URL" >/dev/null
