name: V215 Signal Ledger Postgres Materialization

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - soccer-edge-mcp-v1
    paths:
      - ".github/workflows/v215-signal-ledger-postgres-materialization.yml"

permissions:
  contents: write
  id-token: write

concurrency:
  group: v215-signal-ledger-postgres-materialization
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: https://soccer-edge-api.onrender.com
      STATE_BRANCH: soccer-edge-state
      LEDGER_PATH: soccer_edge_state/analysis/signal_ledger.jsonl
      SUMMARY_PATH: soccer_edge_state/analysis/signal_ledger_summary.json
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install materialization dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r runtime/mcp_gateway/requirements.txt

      - name: Materialize Postgres delta and rebuild summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          PAGE_SIZE = 100
          MAX_PAGES = 500
          RETRIES = 4

          def fresh_oidc_token() -> str:
              base = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
              sep = '&' if '?' in base else '?'
              url = base + sep + urllib.parse.urlencode({'audience': 'soccer-edge-render'})
              req = urllib.request.Request(
                  url,
                  headers={'Authorization': f"bearer {os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"},
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  payload = json.loads(resp.read().decode('utf-8'))
              token = str(payload.get('value') or '').strip()
              if not token:
                  raise RuntimeError('GitHub OIDC token was empty')
              return token

          def fetch_page(url: str, since: str, after_event_id: int) -> dict:
              last_error = None
              for attempt in range(1, RETRIES + 1):
                  token = fresh_oidc_token()
                  body = json.dumps({
                      'since': since,
                      'after_event_id': after_event_id,
                      'max_rows': PAGE_SIZE,
                  }).encode('utf-8')
                  req = urllib.request.Request(
                      url,
                      data=body,
                      headers={
                          'Authorization': f'Bearer {token}',
                          'Content-Type': 'application/json',
                      },
                      method='POST',
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=55) as resp:
                          return json.loads(resp.read().decode('utf-8'))
                  except urllib.error.HTTPError as exc:
                      detail = ''
                      try:
                          detail = exc.read().decode('utf-8', errors='replace')[:500]
                      except Exception:
                          pass
                      last_error = RuntimeError(f'HTTP {exc.code}: {detail}')
                      if exc.code not in (502, 503, 504) or attempt == RETRIES:
                          raise last_error
                  except Exception as exc:
                      last_error = exc
                      if attempt == RETRIES:
                          raise
                  time.sleep(3 * attempt)
              raise last_error or RuntimeError('page fetch failed')

          state = pathlib.Path('state')
          ledger_path = state / os.environ['LEDGER_PATH']
          summary_path = state / os.environ['SUMMARY_PATH']
          ledger_path.parent.mkdir(parents=True, exist_ok=True)

          existing = []
          if ledger_path.exists():
              with ledger_path.open('r', encoding='utf-8') as fh:
                  for line in fh:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          row = json.loads(line)
                      except json.JSONDecodeError:
                          continue
                      if isinstance(row, dict):
                          existing.append(row)

          summary = {}
          if summary_path.exists():
              try:
                  summary = json.loads(summary_path.read_text(encoding='utf-8'))
              except Exception:
                  summary = {}

          since = str(
              summary.get('last_materialized_ledger_row_at_utc')
              or summary.get('last_generated_at_utc')
              or '2026-09-01T00:00:00+00:00'
          )
          after_event_id = 0
          endpoint = os.environ['BASE_URL'].rstrip('/') + '/internal/signal-ledger-postgres-v4/build'
          delta_rows = []
          pages = 0

          while True:
              payload = fetch_page(endpoint, since, after_event_id)
              if payload.get('status') != 'OK':
                  raise RuntimeError(f"unexpected v215 status: {payload}")
              page_rows = [r for r in (payload.get('rows') or []) if isinstance(r, dict)]
              delta_rows.extend(page_rows)
              pages += 1
              next_event_id = int(payload.get('next_event_id') or after_event_id)
              print(json.dumps({
                  'page': pages,
                  'raw_refresh_events_loaded': payload.get('raw_refresh_events_loaded'),
                  'ledger_rows': len(page_rows),
                  'next_event_id': next_event_id,
                  'has_more': bool(payload.get('has_more')),
              }), flush=True)
              if not payload.get('has_more'):
                  break
              if next_event_id <= after_event_id:
                  raise RuntimeError('v215 pagination cursor did not advance')
              after_event_id = next_event_id
              if pages >= MAX_PAGES:
                  raise RuntimeError('v215 pagination exceeded safety bound')

          merged = {}
          for row in existing:
              key = str(row.get('event_key') or '').strip()
              if key:
                  merged[key] = row
          for row in delta_rows:
              key = str(row.get('event_key') or '').strip()
              if key:
                  merged[key] = row

          rows = sorted(
              merged.values(),
              key=lambda r: (
                  str(r.get('generated_at_local') or ''),
                  int(r.get('fixture_id') or 0),
                  str(r.get('stage') or ''),
              ),
          )

          sys.path.insert(0, str(pathlib.Path('runtime').resolve()))
          from mcp_gateway import signal_ledger_postgres_v4

          rebuilt = signal_ledger_postgres_v4.summarize_rows(
              rows,
              source=signal_ledger_postgres_v4.SOURCE,
              postgres_rows=sum(1 for r in rows if r.get('ledger_source') == signal_ledger_postgres_v4.SOURCE),
              legacy_rows_loaded=sum(1 for r in rows if r.get('ledger_source') != signal_ledger_postgres_v4.SOURCE),
          )
          rebuilt.update({
              'materialization_mode': 'V215_POSTGRES_DELTA_MERGE',
              'delta_since': since,
              'delta_page_size': PAGE_SIZE,
              'delta_pages': pages,
              'delta_rows_loaded': len(delta_rows),
              'provider_requests_added': 0,
              'historical_probabilities_recomputed': False,
              'historical_rows_recalibrated': False,
              'synthetic_close_rows_added': 0,
              'production_promotion_allowed': False,
          })

          with ledger_path.open('w', encoding='utf-8') as fh:
              for row in rows:
                  fh.write(json.dumps(row, ensure_ascii=False, sort_keys=True) + '\n')
          summary_path.write_text(
              json.dumps(rebuilt, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )

          print(json.dumps({
              'since': since,
              'pages': pages,
              'delta_rows': len(delta_rows),
              'merged_rows': len(rows),
              'last_materialized_ledger_row_at_utc': rebuilt.get('last_materialized_ledger_row_at_utc'),
              'stage_counts': rebuilt.get('stage_counts'),
          }, indent=2), flush=True)
          PY

      - name: Commit refreshed ledger to state branch
        shell: bash
        run: |
          set -euo pipefail
          cd state
          git config user.name "soccer-edge-v215-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$LEDGER_PATH" "$SUMMARY_PATH"
          if git diff --cached --quiet; then
            echo "No signal-ledger changes to persist."
            exit 0
          fi
          git commit -m "state: materialize v215 Postgres signal ledger"
          git push origin HEAD:"$STATE_BRANCH"
