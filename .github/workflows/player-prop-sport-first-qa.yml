name: Soccer Player Props Independent Statistics - Source and OOS QA

on:
  pull_request:
    branches: [soccer-edge-mcp-v1]
    paths:
      - "mcp_gateway/player_prop_sport_first_bridge_v1.py"
      - "mcp_gateway/player_shots_intelligence.py"
      - "mcp_gateway/player_sot_intelligence.py"
      - "mcp_gateway/build_player_trend_model_registry.py"
      - "mcp_gateway/player_props_oos_postgres_v4.py"
      - "mcp_gateway/subscriber_research_desk_v1.py"
      - "mcp_gateway/subscriber_frontend_v2.py"
      - "tests/test_player_prop_sport_first_bridge_v1.py"
      - ".github/workflows/player-prop-sport-first-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-sport-first:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing gateway and offline test deps
        run: python -m pip install -r mcp_gateway/requirements.txt pytest
      - name: Compile model, provenance, owner desk and UI
        run: |
          python -m compileall -q \
            mcp_gateway/player_prop_sport_first_bridge_v1.py \
            mcp_gateway/player_shots_intelligence.py \
            mcp_gateway/player_sot_intelligence.py \
            mcp_gateway/player_props_oos_postgres_v4.py \
            mcp_gateway/build_player_trend_model_registry.py \
            mcp_gateway/subscriber_research_desk_v1.py \
            mcp_gateway/subscriber_frontend_v2.py
      - name: Source, time, identity, sample, price independence and real OOS gates
        run: |
          python -m pytest -c /dev/null -q \
            tests/test_player_prop_sport_first_bridge_v1.py \
            tests/test_fe11_player_stats_first_gate_v1.py \
            tests/test_subscriber_research_desk_v1.py \
            tests/test_sgp_player_plain_language_v1.py
      - name: Check true rendered UI JavaScript and old price conversions
        run: |
          python - <<'PY'
          from pathlib import Path
          from mcp_gateway import subscriber_frontend_v2
          html=subscriber_frontend_v2.render()
          marker='<script id="soccer-edge-v2-app">'
          assert html.count(marker)==1
          start=html.index(marker)+len(marker)
          end=html.index("</script>",start)
          script=html[start:end]
          assert "function playerSportModelCard(" in script
          assert "function renderPlayerSportResearch(" in script
          assert "renderPlayerSportResearch(data.player_sport_research)" in script
          assert "0 jugadores con ventaja estadística verificada" in html
          Path("/tmp/actual_player_sport_app.js").write_text(script,encoding="utf-8")
          print("Rendered JS characters:",len(script))
          PY
          node --check /tmp/actual_player_sport_app.js
          node tests/sgp_player_ui_runtime.js /tmp/actual_player_sport_app.js
