name: Player Stats Runner-Only Registry - Real State CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/player-stat-registry-runner-only.yml"
      - ".github/workflows/player-stat-registry-runner-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-persisted-state-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: engine
          fetch-depth: 1

      - uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove production workflow never contacts Render or provider
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("engine/.github/workflows/player-stat-registry-runner-only.yml").read_text()
          # PR may predate main engine workflow; use source from PR checkout below.
          PY
      - name: No network in actual model build (existing locally retained evidence)
        shell: bash
        env:
          PYTHONPATH: engine
        run: |
          set -euo pipefail
          python engine/mcp_gateway/analyze_player_trends.py \
            --history-dir state/soccer_edge_state/history \
            --registry-backfill state/soccer_edge_state/analysis/player_trend_registry_backfill.json \
            --output state/soccer_edge_state/analysis/player_trends.json
          python engine/mcp_gateway/build_player_role_registry.py \
            --player-trends state/soccer_edge_state/analysis/player_trends.json \
            --output state/soccer_edge_state/analysis/player_role_registry.json
          python engine/mcp_gateway/build_player_trend_model_registry.py \
            --player-trends state/soccer_edge_state/analysis/player_trends.json \
            --player-roles state/soccer_edge_state/analysis/player_role_registry.json \
            --output state/soccer_edge_state/analysis/player_trend_model_registry.json
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          a=Path("state/soccer_edge_state/analysis")
          trends=json.loads((a/"player_trends.json").read_text())
          roles=json.loads((a/"player_role_registry.json").read_text())
          registry=json.loads((a/"player_trend_model_registry.json").read_text())
          assert trends["status"]=="RESEARCH_ONLY_PLAYER_TRENDS"
          assert roles["status"]=="RESEARCH_PLAYER_ROLE_REGISTRY"
          assert registry["status"]=="RESEARCH_PLAYER_TREND_MODEL_REGISTRY"
          assert registry["actionable"] is False
          assert registry["decision_weight"]==0.0
          assert len(registry["profiles"])>0
          assert "shots" in registry["global_priors"]
          assert "shots_on_target" in registry["global_priors"]
          assert registry.get("generated_at_utc")
          print(json.dumps({
            "status":"REAL_OFFICIAL_HISTORY_MODEL_BUILT_ON_GITHUB_RUNNER",
            "historical_unique_fixtures":trends.get("unique_fixtures_captured"),
            "postgame_fixtures":trends.get("postgame_fixtures_captured"),
            "future_only_player_registry_profiles":len(registry["profiles"]),
            "generated_at_utc":registry["generated_at_utc"],
            "api_football_requests":0,
            "render_worker_calls":0,
            "probabilities_calibrated":False,
            "bet_eligible":False,
          }))
          PY
