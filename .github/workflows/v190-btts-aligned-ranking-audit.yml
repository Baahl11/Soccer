name: v190 BTTS Aligned Ranking Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v190-btts-aligned-ranking-audit.yml"

permissions:
  contents: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout state evidence
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1
          sparse-checkout: |
            soccer_edge_state/analysis/oos_prediction_ledger_v4.jsonl
            soccer_edge_state/analysis/oos_stage_diagnostics_v4.json
          sparse-checkout-cone-mode: false

      - name: Export current point-in-time training dataset
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          token=$(echo "$response" | jq -r '.value // empty')
          test -n "$token"
          echo "::add-mask::$token"
          cutoff=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          curl -fsS --max-time 120 \
            -X POST \
            -H "Authorization: Bearer ${token}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg cutoff "$cutoff" '{cutoff:$cutoff,row_limit:20000}')" \
            https://soccer-edge-api.onrender.com/internal/training-dataset/export \
            > /tmp/v190_training_dataset.json
          jq -e '.status == "OK" and (.rows | type == "array")' /tmp/v190_training_dataset.json >/dev/null

      - name: Isolate and classify residual v1.0 rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def parse_dt(v):
              if not v:
                  return None
              x = datetime.fromisoformat(str(v).replace('Z', '+00:00'))
              if x.tzinfo is None:
                  x = x.replace(tzinfo=timezone.utc)
              return x.astimezone(timezone.utc)

          dataset = json.loads(Path('/tmp/v190_training_dataset.json').read_text())
          diag = json.loads(Path('state/soccer_edge_state/analysis/oos_stage_diagnostics_v4.json').read_text())
          current = str(diag.get('current_source_model_version') or '').strip()
          ledger = []
          for line in Path('state/soccer_edge_state/analysis/oos_prediction_ledger_v4.jsonl').read_text(errors='replace').splitlines():
              if not line.strip():
                  continue
              try:
                  r = json.loads(line)
              except Exception:
                  continue
              if not isinstance(r, dict) or r.get('anti_leakage') is not True:
                  continue
              try:
                  r['_fid'] = int(r.get('fixture_id'))
                  r['_kickoff'] = parse_dt(r.get('kickoff'))
                  r['_run'] = parse_dt(r.get('run_timestamp'))
                  r['_outcome'] = int((r.get('outcomes') or {}).get('btts'))
              except Exception:
                  continue
              r['_stage'] = str(r.get('run_type') or '').upper()
              r['_model'] = str(r.get('model_version') or '').strip()
              ledger.append(r)

          residuals = []
          for row in dataset.get('rows') or []:
              model = str(row.get('model_version') or '').strip()
              if model == current:
                  continue
              try:
                  fid = int(row.get('fixture_id'))
                  feature = parse_dt(row.get('feature_captured_at'))
                  kickoff = parse_dt(row.get('kickoff'))
                  outcome = int((row.get('targets') or {}).get('btts'))
              except Exception:
                  continue
              stage = str(row.get('stage') or '').upper()
              candidates = [
                  r for r in ledger
                  if r['_fid'] == fid and r['_kickoff'] == kickoff and r['_outcome'] == outcome and r['_stage'] == stage
              ]
              cmeta = []
              for r in sorted(candidates, key=lambda x: x['_run'] or datetime.min.replace(tzinfo=timezone.utc)):
                  gap = None if feature is None or r['_run'] is None else round((r['_run'] - feature).total_seconds(), 3)
                  cmeta.append({
                      'model_version': r['_model'],
                      'run_timestamp': r.get('run_timestamp'),
                      'gap_seconds_from_feature_capture': gap,
                  })
              exact_same = [c for c in cmeta if c['model_version'] == model and c['gap_seconds_from_feature_capture'] is not None and abs(c['gap_seconds_from_feature_capture']) <= 1.0]
              exact_current = [c for c in cmeta if c['model_version'] == current and c['gap_seconds_from_feature_capture'] is not None and abs(c['gap_seconds_from_feature_capture']) <= 1.0]
              if exact_same and not exact_current:
                  classification = 'HISTORICAL_LINEAGE_CONSISTENT'
              elif exact_current and not exact_same:
                  classification = 'POSSIBLE_STALE_METADATA_REQUIRES_DB_PROOF'
              else:
                  classification = 'AMBIGUOUS_REQUIRES_DB_PROOF'
              residuals.append({
                  'fixture_id': fid,
                  'stage': stage,
                  'feature_captured_at': row.get('feature_captured_at'),
                  'kickoff': row.get('kickoff'),
                  'dataset_model_version': model,
                  'btts_outcome': outcome,
                  'classification': classification,
                  'ledger_candidates_same_fixture_stage_kickoff_outcome': cmeta,
              })

          out = {
              'status': 'OK',
              'current_source_model_version': current,
              'dataset_row_count': int(dataset.get('row_count') or len(dataset.get('rows') or [])),
              'residual_count': len(residuals),
              'residuals': residuals,
          }
          Path('/tmp/v190_residual_lineage.json').write_text(json.dumps(out, indent=2, sort_keys=True))
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

      - name: Upload residual diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: v190-residual-lineage-diagnostic
          path: /tmp/v190_residual_lineage.json
          retention-days: 14
