name: V194 2H Goals Validation

on:
  push:
    branches:
      - tmp-v194-2h-goals

jobs:
  v194-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_gateway/requirements.txt pytest
      - name: Compile MCP gateway
        run: python -m compileall -q mcp_gateway
      - name: Run v194 targeted tests
        run: PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider tests/test_two_h_goals_intelligence_v194.py
      - name: Run exact official V4 runtime test list
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          text = Path('.github/workflows/v4-runtime-tests.yml').read_text(encoding='utf-8')
          section = text.split('- name: Run V4 scheduler regression tests', 1)[1]
          tests = []
          for path in re.findall(r'tests/[A-Za-z0-9_.-]+\.py', section):
              if path not in tests:
                  tests.append(path)
          if not tests:
              raise SystemExit('No official V4 tests discovered')
          env = dict(os.environ)
          env['PYTHONPATH'] = '.'
          subprocess.run(['pytest', '-q', '-c', '/dev/null', '--rootdir=.', '-p', 'no:cacheprovider', *tests], env=env, check=True)
          PY
