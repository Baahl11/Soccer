# Phase16 existing-price calibration validation: 2026-09-24
name: Phase 16 Market Mismatch Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/phase16-market-mismatch-validation.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 16 tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          PYTHONPATH=. pytest -q tests/test_phase16_market_mismatch_v4.py tests/test_price_resolver_v4.py
