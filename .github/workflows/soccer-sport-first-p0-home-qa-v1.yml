name: Soccer Sport-First Today P0 Screening and Browser Syntax QA
on:
  pull_request:
    branches: [soccer-edge-mcp-v1]
    paths:
      - 'mcp_gateway/automation_v5.py'
      - 'mcp_gateway/automation_v7.py'
      - 'mcp_gateway/soccer_p0_sport_preview_v1.py'
      - 'mcp_gateway/soccer_p0_persisted_view_v1.py'
      - 'mcp_gateway/subscriber_contract_v2.py'
      - 'mcp_gateway/soccer_universal_match_v1.py'
      - 'mcp_gateway/soccer_sport_queue_v1.py'
      - 'mcp_gateway/subscriber_match_notes_v1.py'
      - 'mcp_gateway/persistence.py'
      - 'mcp_gateway/schema.sql'
      - 'docs/SOCCER_ANALYST_NOTES_SUPABASE_MIGRATION_v1.sql'
      - 'docs/SOCCER_UNIVERSAL_INTELLIGENCE_TODO_20261111.md'
      - 'mcp_gateway/subscriber_frontend_v2.py'
      - 'tests/test_soccer_p0_sport_first_today_v1.py'
      - 'tests/test_soccer_universal_match_v1.py'
      - 'tests/test_soccer_sport_queue_and_notes_v1.py'
      - 'tests/test_soccer_live_audit_heredoc_syntax_v1.py'
      - '.github/workflows/soccer-live-slate-research-join-readonly.yml'
      - 'tests/test_isolated_sport_frozen_pg_v1.py'
      - '.github/workflows/soccer-sport-first-p0-home-qa-v1.yml'

permissions:
  contents: read

jobs:
  sport-first:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gateway and test dependencies
        run: python -m pip install -r mcp_gateway/requirements.txt pytest
      - name: Run P0 source, timestamp, quota and UI contract tests
        run: |
          set -euo pipefail
          python -m compileall -q mcp_gateway/automation_v5.py mcp_gateway/automation_v7.py mcp_gateway/soccer_p0_sport_preview_v1.py mcp_gateway/soccer_p0_persisted_view_v1.py mcp_gateway/subscriber_frontend_v2.py mcp_gateway/subscriber_contract_v2.py mcp_gateway/soccer_universal_match_v1.py mcp_gateway/soccer_sport_queue_v1.py mcp_gateway/subscriber_match_notes_v1.py mcp_gateway/persistence.py
          python -m pytest -q -c /dev/null --rootdir=. -p no:cacheprovider \
            tests/test_soccer_p0_sport_first_today_v1.py \
            tests/test_isolated_sport_frozen_pg_v1.py \
            tests/test_subscriber_frontend_v2.py \
            tests/test_subscriber_contract_v2.py \
            tests/test_soccer_universal_match_v1.py \
            tests/test_soccer_sport_queue_and_notes_v1.py \
            tests/test_soccer_live_audit_heredoc_syntax_v1.py
      - name: Verify every generated inline JavaScript parses on Node
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from mcp_gateway.subscriber_frontend_v2 import render
          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.on = False
                  self.content = []
                  self.current = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  self.on = tag == "script" and attrs.get("type") != "application/json"
                  if self.on: self.current = []
              def handle_endtag(self, tag):
                  if tag == "script" and self.on:
                      self.content.append("".join(self.current))
                      self.on = False
              def handle_data(self, data):
                  if self.on: self.current.append(data)
          html = render()
          assert 'id="sportFocus"' in html and 'renderSportFocus()' in html
          scripts=Scripts()
          scripts.feed(html)
          assert scripts.content, 'No generated browser JS found'
          for i,script in enumerate(scripts.content):
              Path(f"/tmp/soccer-home-{i}.js").write_text(script)
          print(f"Generated {len(scripts.content)} browser JS scripts")
          PY
          for js in /tmp/soccer-home-*.js; do node --check "$js"; done
          echo SOCCER_P0_SPORT_FIRST_BROWSER_SYNTAX_PASS
