name: Phase 24 Product View Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/phase24-product-views-validation.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 24 product-view tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          PYTHONPATH=. pytest -q tests/test_phase24_product_views_v4.py
