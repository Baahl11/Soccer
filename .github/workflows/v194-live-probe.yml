name: V194 Live Health Probe

on:
  push:
    branches:
      - tmp-v194-2h-goals
    paths:
      - ".github/workflows/v194-live-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live health
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS --max-time 60 -o /tmp/health.json -w "%{http_code}" https://soccer-edge-api.onrender.com/health)
          echo "HEALTH_HTTP=$CODE"
          cat /tmp/health.json
          test "$CODE" = "200"
          jq -e '.status == "ok" and .service == "soccer-edge-api"' /tmp/health.json >/dev/null

      - name: Verify DB-only product telemetry
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(curl -sS --max-time 60 -o /tmp/views.json -w "%{http_code}" 'https://soccer-edge-api.onrender.com/product/views?limit=3')
          echo "PRODUCT_HTTP=$CODE"
          test "$CODE" = "200"
          jq '{status,pipeline_version,generated_at_utc,source,provider_requests_added,view_keys:(.views|keys)}' /tmp/views.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/views.json', encoding='utf-8'))
          views=data.get('views') or {}
          out={
              'second_half': views.get('second_half'),
              'control_tower': views.get('control_tower'),
          }
          print(json.dumps(out, ensure_ascii=False, indent=2)[:12000])
          PY
