# v233 exact-instrument strict-close visit matrix
name: v232 Post-v223 CLV Visit Matrix Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/v232-post-v223-visit-matrix.yml']
  schedule:
    - cron: "37 7,19 * * *"

permissions:
  contents: write
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          sparse-checkout: |
            soccer_edge_state/analysis/post_v223_visit_matrix_v4.json
          sparse-checkout-cone-mode: false
      - name: Build DB-only visit matrix
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          TOKEN=$(echo "$response" | jq -r '.value // empty')
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          curl -fsS --max-time 180 -X POST \
            -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" \
            -d '{"limit":2000}' \
            https://soccer-edge-api.onrender.com/internal/post-v223-visit-matrix-v4/build \
            -o /tmp/v232.json
          jq '{model_version,cohort_start_utc,generated_at_utc,family_summary,provider_requests_added}' /tmp/v232.json
          jq -e '.model_version=="SOCCER_POST_V223_VISIT_MATRIX_V2" and .provider_requests_added==0 and .strict_close_semantics_changed==false and .provider_budget_changed==false' /tmp/v232.json >/dev/null
          mkdir -p soccer_edge_state/analysis
          cp /tmp/v232.json soccer_edge_state/analysis/post_v223_visit_matrix_v4.json
      - name: Persist audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/post_v223_visit_matrix_v4.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Persist post-v223 CLV visit matrix"
          git pull --rebase origin soccer-edge-state
          git push origin HEAD:soccer-edge-state
