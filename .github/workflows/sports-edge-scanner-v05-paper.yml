name: SPORTS EDGE SCANNER v1.3 - Bet365 full-market SPORT FIRST +100

on:
  pull_request:
    paths:
      - 'tools/sports_edge_scanner_v05/**'
      - '.github/workflows/sports-edge-scanner-v05-paper.yml'
  # 07:15 and 14:15 America/Mexico_City (UTC-6).
  schedule:
    - cron: '15 13 * * *'
    - cron: '05 17 * * *'  # 11:05 CDMX pregame discovery
    - cron: '20 19 * * *'  # 13:20 CDMX pregame refresh
  push:
    branches: [main]
    paths:
      - 'tools/sports_edge_scanner_v05/run_requests/once.json'
  workflow_dispatch:
    inputs:
      match_date:
        description: 'Fecha YYYY-MM-DD (CDMX); dejar vacío para hoy'
        required: false
        type: string
      league_ids:
        description: 'IDs de ligas elegibles aprobadas, separados por comas (ejemplo 18,17)'
        required: true
        type: string
      reference_odds_limit:
        description: 'Cuántos candidatos observar: 0-25 (solo WATCH)'
        required: false
        default: '0'
        type: string

permissions:
  contents: read

concurrency:
  group: sports-edge-scanner-paper-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Unit tests - offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/sports_edge_scanner_v05
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all decision-gate, parlay and dashboard tests
        run: python -m unittest discover -s tests -q

  paper-research:
    name: Research only - manual or one-shot, no bets
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'schedule'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/sports_edge_scanner_v05
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      SOCCER_TRUSTED_DECISION_INPUT: ${{ vars.SOCCER_TRUSTED_DECISION_INPUT }}
      SOCCER_DECISION_FEED_HMAC_KEY: ${{ secrets.SOCCER_DECISION_FEED_HMAC_KEY }}
      SOCCER_CANONICAL_STATE_PATH: ${{ github.workspace }}/market_evidence/soccer_edge_state/latest.json
      SOCCER_BOOKMAKER_DIRECTORY_ENABLED: '1'
      SOCCER_PROXY_BOOKMAKER_ID: '8'
      SOCCER_PROXY_BOOKMAKER_NAME: 'Bet365'
      SOCCER_ENGINE_SOURCE_DIR: ${{ github.workspace }}/engine
      SOCCER_ENGINE_COMMIT_SHA: '108c193c50e59f12f19f8693fc05c5cc9c607db4'
      SOCCER_ENABLE_RECENT_HISTORY: '1'
      SOCCER_ENABLE_HISTORICAL_MARKETS: '1'
      SOCCER_ADVANCED_DEEP_DIVES: '3'
      SOCCER_ENABLE_CANONICAL_VIEWS: '1'
      SOCCER_MARKET_EVIDENCE_DIR: ${{ github.workspace }}/market_evidence/soccer_edge_state/analysis
      API_FOOTBALL_RESEARCH_DAILY_CAP: '250'
      API_FOOTBALL_RESEARCH_MONTHLY_CAP: '9300'
      API_FOOTBALL_QUOTA_FILE: data/quota_api_football_paper.json
      API_FOOTBALL_CACHE_DIR: data/api_football_paper_cache
      MATCH_DATE: ${{ inputs.match_date }}
      LEAGUE_IDS: ${{ inputs.league_ids || '2,3,18,17,39,140,135,78,61,262,848' }}
      ODDS_LIMIT: ${{ inputs.reference_odds_limit || '20' }}
    steps:
      - uses: actions/checkout@v4
      - name: Read-only checkout of the ORIGINAL Soccer raw model (pinned)
        uses: actions/checkout@v4
        with:
          ref: '108c193c50e59f12f19f8693fc05c5cc9c607db4'
          path: engine
          persist-credentials: false
      - name: Read-only checkout of canonical market maturity evidence
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: market_evidence
          persist-credentials: false
          sparse-checkout: |
            soccer_edge_state/latest.json
            soccer_edge_state/analysis/v4_016_ft_totals_production_validation.json
            soccer_edge_state/analysis/v4_017_1x2_calibration_validation.json
            soccer_edge_state/analysis/v4_018_btts_calibration_validation.json
            soccer_edge_state/analysis/v4_019_team_totals_oos_validation.json
            soccer_edge_state/analysis/v4_020_1h_oos_validation.json
            soccer_edge_state/analysis/v4_021_2h_oos_validation.json
            soccer_edge_state/analysis/v4_022_corners_oos_validation.json
            soccer_edge_state/analysis/phase14_cards_referee_validation.json
            soccer_edge_state/analysis/phase15_player_props_validation.json
            soccer_edge_state/analysis/formation_matchup_fm4_style_ablation_v1.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Load one-shot request on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          record = json.loads(Path("run_requests/once.json").read_text(encoding="utf-8"))
          date = str(record.get("match_date", ""))
          leagues = str(record.get("league_ids", ""))
          odds = str(record.get("reference_odds_limit", 0))
          if not re.fullmatch(r"20\d{2}-\d{2}-\d{2}", date):
              raise SystemExit("Invalid one-shot date")
          if not re.fullmatch(r"\d+(,\d+)*", leagues) or len(leagues.split(",")) > 14:
              raise SystemExit("Invalid league IDs or excessive league count")
          if not odds.isdigit() or not 0 <= int(odds) <= 20:
              raise SystemExit("Unsafe one-shot odds limit")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name, value in (("MATCH_DATE", date), ("LEAGUE_IDS", leagues), ("ODDS_LIMIT", odds)):
                  output.write(f"{name}={value}\n")
          print("Validated one-shot research request; key not displayed")
          PY
      - name: Validate secrets and user inputs without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SOCCER_ENGINE_SOURCE_DIR/mcp_gateway/soccer_model.py" || { echo '::error::El motor original no está disponible'; exit 2; }
          if [ -z "${API_FOOTBALL_KEY:-}" ]; then
            echo '::error::Falta configurar Actions secret API_FOOTBALL_KEY. No se consultó al proveedor.'
            exit 2
          fi
          if ! [[ "$LEAGUE_IDS" =~ ^[0-9]+(,[0-9]+)*$ ]]; then
            echo '::error::Ligas inválidas. Usa IDs numéricos separados por comas.'
            exit 2
          fi
          if [ -n "$MATCH_DATE" ] && ! [[ "$MATCH_DATE" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo '::error::La fecha debe tener el formato YYYY-MM-DD.'
            exit 2
          fi
          if ! [[ "$ODDS_LIMIT" =~ ^([0-9]|1[0-9]|2[0-5])$ ]]; then
            echo '::error::El límite de momios debe estar entre 0 y 25.'
            exit 2
          fi
      - name: Audit full slate and research all configured eligible games
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$MATCH_DATE" ]; then
            MATCH_DATE=$(python -c 'from datetime import datetime;from zoneinfo import ZoneInfo;print(datetime.now(ZoneInfo("America/Mexico_City")).date().isoformat())')
          fi
          python -m sports_edge pro-soccer-daily \
            --date "$MATCH_DATE" --leagues "$LEAGUE_IDS" \
            --odds-limit "$ODDS_LIMIT" --output-dir "run_data/$MATCH_DATE"
          export MATCH_DATE
          python - <<'PY'
          import json, os
          from pathlib import Path
          date = os.environ["MATCH_DATE"]
          folder = Path("run_data") / date
          summary = json.loads((folder / f"daily_summary_{date}.json").read_text(encoding="utf-8"))
          screen_file = folder / f"sport_first_{date}.json"
          screen = json.loads(screen_file.read_text(encoding="utf-8")) if screen_file.exists() else {}
          names = {row["fixture_id"]: row.get("match", str(row["fixture_id"]))
                   for row in screen.get("screened_fixtures", [])}
          lines = [
              f"# SPORTS EDGE SCANNER — {date}",
              f"**Estado:** {summary.get('status', 'NOT_VERIFIED')}",
              f"**Calendario completo:** {summary.get('source_slate_complete_verified', False)}",
              f"**Partidos elegibles:** {summary.get('eligible_games', 0)}",
              f"**Partidos examinados:** {summary.get('sports_screened', 0)}",
              f"**Proyecciones RAW del motor original:** {summary.get('raw_existing_engine_projections', 0)}",
              f"**Historial multicompetición de ambos equipos:** {summary.get('history_multi_competition_verified', 0)}",
              f"**Análisis profundos históricos (córners, faltas, XI anteriores):** {summary.get('historical_market_deep_dives', 0)}",
              f"**Familias de mercados auditadas:** {summary.get('market_families_audited', 0)}",
              f"**Estado del pipeline canónico:** {summary.get('canonical_market_status', 'NOT_VERIFIED')}",
              f"**Modelo canónico real (mismo fixture/mercado):** {summary.get('canonical_state_matches', 0)}",
              f"**Calibración experimental correctamente atribuida:** {summary.get('canonical_selection_research_models', 0)}",
              f"**Directorío casas API-Football:** {summary.get('bookmaker_catalogue_status', 'NOT_VERIFIED')}",
              f"**Momios de referencia capturados:** {summary.get('odds_snapshots_captured', 0)}",
              f"**Casa proxy única:** {summary.get('proxy_reference_bookmaker', 'NOT_VERIFIED')} (ID {summary.get('proxy_reference_bookmaker_id', 'N/V')})",
              f"**Partidos con precio proxy:** {summary.get('proxy_quote_fixtures', 0)}",
              f"**Cotizaciones proxy:** {summary.get('proxy_quote_count', 0)}",
              f"**Bet365, mercados comparables con modelo RAW:** {summary.get('bet365_quotes_with_exact_or_derived_raw', 0)}",
              f"**Precios con mercado sin vigorish verificable:** {summary.get('bet365_no_vig_market_quotes', 0)}",
              f"**Duplas +100 tras evaluación deportiva RAW preliminar:** {summary.get('bet365_sport_first_review_pairs_plus100', 0)}",
              "**Disponibilidad Caliente/Playdoit:** NO VERIFICADA (Bet365 solo referencia)",
              f"**Duplas WATCH cerca de +100:** {summary.get('parlay_price_pairs_watch', 0)}",
              f"**BET individuales calculados:** {summary.get('actionable_bets', 0)}",
              f"**BET combinadas calculadas:** {summary.get('parlay_actionable_bets', 0)}",
              f"**Feed del evaluador:** {summary.get('decision_feed_status', 'NOT_VERIFIED')}",
              f"**Pregame T-40: {summary.get('pregame_refresh_completed', 0)} de {summary.get('pregame_candidates_in_window', 0)} en ventana**",
              f"**Duplas con al menos una pierna RAW bajo breakeven:** {summary.get('parlay_raw_negative_pairs', 0)}",
              f"**Piernas sin modelo RAW exacto:** {summary.get('parlay_legs_without_exact_raw_model', 0)}",
              "**Ranking por menor riesgo:** NO VERIFICADO (requiere OOS y probabilidad conjunta)",
              "**Parlay EV y probabilidad conjunta:** NOT VERIFIED",
              "**Apuestas realizadas:** 0",
              "**Clasificación:** WATCH — proyección Poisson RAW sin calibración OOS, sin XI confirmado ni precios Caliente/Playdoit verificados.",
              "",
              "## Prioridad preliminar (no picks)",
          ]
          for category, field in (("Dominio", "preliminary_side_shortlist"),
                                  ("Goles", "preliminary_goals_shortlist")):
              ids = summary.get(field, [])[:5]
              lines.append(f"**{category}:** " + (", ".join(names.get(i, str(i)) for i in ids) if ids else "sin candidatos verificados"))
          lines.extend(["", f"**Datos completos:** descarga el artefacto soccer-paper-research; abre `board_{date}.html` y `parlay_radar_{date}.json` y `parlay_leg_evidence_{date}.json` y `bet365_market_matrix_{date}.json`."])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n\n".join(lines) + "\n")
          PY
      - name: Save research reports for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-paper-research
          path: tools/sports_edge_scanner_v05/run_data/
          if-no-files-found: warn
          retention-days: 30