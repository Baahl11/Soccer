name: Phase 20 Bankroll Risk Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/phase20-risk-engine-validation.yml"]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 20 unit tests
        working-directory: runtime
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          PYTHONPATH=. pytest -q tests/test_phase20_risk_engine_v4.py

      - name: Build current risk engine report
        working-directory: runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m mcp_gateway.risk_engine_v4             --promotion-report ../state/soccer_edge_state/analysis/phase19_promotion_framework_report.json             --oos-report ../state/soccer_edge_state/analysis/phase18_oos_backtest_report.json             --output ../state/soccer_edge_state/analysis/phase20_risk_engine_report.json

      - name: Validate safety gates
        run: |
          set -euo pipefail
          jq -e '.phase == "FASE_20_BANKROLL_RISK"' state/soccer_edge_state/analysis/phase20_risk_engine_report.json >/dev/null
          jq -e '.production_execution_enabled == false' state/soccer_edge_state/analysis/phase20_risk_engine_report.json >/dev/null
          jq -e '.hard_principles.no_chase == true' state/soccer_edge_state/analysis/phase20_risk_engine_report.json >/dev/null
          jq -e '.hard_principles.no_martingale == true' state/soccer_edge_state/analysis/phase20_risk_engine_report.json >/dev/null

      - name: Persist report to state branch
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/phase20_risk_engine_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Phase 20 risk engine report"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
