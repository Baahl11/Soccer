name: v213 Maturation Control Tower Completion

on:
  workflow_dispatch:
  push:
    branches:
      - v213-maturation-control-tower-completion
    paths:
      - mcp_gateway/maturity_snapshot_v4.py
      - tests/test_v213_maturation_control_tower_completion.py
      - .github/workflows/v213-maturation-control-tower-completion.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx psycopg[binary]
      - name: Compile observability modules
        run: |
          python -m py_compile mcp_gateway/maturity_snapshot_v4.py
          python -m py_compile mcp_gateway/product_views_v4.py
          python -m py_compile mcp_gateway/product_dashboard_v4.py
      - name: Run focused maturation and dashboard regressions
        run: |
          PYTHONPATH=. pytest -q tests/test_v213_maturation_control_tower_completion.py tests/test_phase24_product_views_v4.py tests/test_phase24_product_dashboard_v4.py
