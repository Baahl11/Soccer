name: v216.8 Preview Single Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v2168-preview-single-bootstrap.yml"
      - "scripts/v2168_preview_patch.py"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          fetch-depth: 0

      - name: Fetch patch script from main
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://raw.githubusercontent.com/Baahl11/Soccer/main/scripts/v2168_preview_patch.py -o /tmp/v2168_preview_patch.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply preview-only patch
        run: python /tmp/v2168_preview_patch.py

      - name: Install focused test dependencies
        run: python -m pip install -q pytest starlette httpx psycopg[binary]

      - name: Compile and run focused preview tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            mcp_gateway/subscriber_preview_live_v231.py \
            mcp_gateway/subscriber_preview_performance_live_v231.py \
            mcp_gateway/subscriber_preview_maturity_live_v232.py
          python -m pytest -q \
            tests/test_v2168_preview_single_bootstrap.py \
            tests/test_v4_023_subscriber_preview_data.py

      - name: Commit runtime fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            mcp_gateway/subscriber_preview_live_v231.py \
            mcp_gateway/subscriber_preview_performance_live_v231.py \
            mcp_gateway/subscriber_preview_maturity_live_v232.py \
            tests/test_v2168_preview_single_bootstrap.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "v216.8: stabilize app preview single bootstrap"
          git push origin HEAD:soccer-edge-mcp-v1
