name: Soccer Canonical Full Sport Engine - Off-Render Bounded Canary
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/soccer_isolated_full_engine_canary.py'
      - '.github/workflows/soccer-isolated-full-engine-canary-v1.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/soccer_isolated_full_engine_canary.py'
      - '.github/workflows/soccer-isolated-full-engine-canary-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: soccer-full-sport-off-render-canary
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify true end-of-computation as-of, no bets, no Postgres
        run: |
          set -euo pipefail
          python .github/scripts/soccer_isolated_full_engine_canary.py --self-test
          python - <<'PY'
          from pathlib import Path
          s=Path(".github/scripts/soccer_isolated_full_engine_canary.py").read_text()
          w=Path(".github/workflows/soccer-isolated-full-engine-canary-v1.yml").read_text()
          assert 'MAX_PROVIDER_REQUESTS=40' in s
          assert 'MAX_FROZEN_EVENTS=20' in s
          assert 'CANARY_MUST_NOT_HAVE_DB_CREDENTIALS' in s
          assert 'model_events_not_safely_pregame' in s
          assert 'canonical_clv_rows_added":0' in s
          assert '"production_promotion_allowed":False' in s
          assert 'timeout=180' in s
          assert 'SOCCER_EDGE_MAX_API_CALLS_PER_TICK: "40"' in w
          assert 'DATABASE_URL: ""' in w
          assert not any(line.lstrip().startswith("- cron:") for line in w.splitlines())
          print("FULL_SPORT_OFF_RENDER_PILOT_OFFLINE_PASS")
          PY

  isolated-real-canary:
    if: github.event_name != 'pull_request'
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      DATABASE_URL: ""
      SOCCER_EDGE_MAX_API_CALLS_PER_TICK: "40"
      SOCCER_EDGE_MAX_RESEARCH_FIXTURES_PER_TICK: "0"
      SOCCER_EDGE_CACHE_PATH: /tmp/isolated_full_sport_canary.sqlite3
    steps:
      - uses: actions/checkout@v4
        with:
          path: controls
      - uses: actions/checkout@v4
        with:
          repository: Baahl11/Soccer
          ref: soccer-edge-mcp-v1
          path: runtime
      - uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1
          sparse-checkout: |
            soccer_edge_state/analysis/isolated_full_sport_canary_v1.json
            soccer_edge_state/analysis/isolated_full_sport_raw_v1.jsonl
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only canonical runtime requirements
        run: python -m pip install -r runtime/mcp_gateway/requirements.txt
      - name: Run actual canonical sporting chain on isolated 7GiB runner
        shell: bash
        run: |
          set -euo pipefail
          test -n "${API_FOOTBALL_KEY:-}" || { echo "::error::API_FOOTBALL_KEY_NOT_CONFIGURED"; exit 1; }
          sha=$(git -C runtime rev-parse HEAD)
          mkdir -p state/soccer_edge_state/analysis
          touch state/soccer_edge_state/analysis/isolated_full_sport_raw_v1.jsonl
          PYTHONPATH=runtime python controls/.github/scripts/soccer_isolated_full_engine_canary.py \
            --runtime-sha "$sha" \
            --report state/soccer_edge_state/analysis/isolated_full_sport_canary_v1.json \
            --frozen state/soccer_edge_state/analysis/isolated_full_sport_raw_v1.jsonl
          jq -e '
            .status == "ISOLATED_FULL_ENGINE_RESEARCH_CANARY_COMPLETED"
            and .production_promotion_allowed == false
            and .bet_eligible == false
            and .no_db_credentials == true
            and .postgres_write_queries == 0
            and .canonical_clv_rows_added == 0
            and (.api_calls_this_run <= 40)
            and (.daily_remaining_reported >= 1000)
          ' state/soccer_edge_state/analysis/isolated_full_sport_canary_v1.json >/dev/null
      - name: Persist actual model evidence only after as-of and provider checks
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/isolated_full_sport_canary_v1.json \
                     soccer_edge_state/analysis/isolated_full_sport_raw_v1.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Observe bounded canonical SPORT FIRST on isolated runner, no prices or bets promoted"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            if git rebase origin/soccer-edge-state && git push origin HEAD:soccer-edge-state; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1
