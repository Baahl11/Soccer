name: v193 Period Market Evidence Patch

on:
  push:
    branches: [soccer-edge-mcp-v1]
    paths:
      - ".github/workflows/v193-period-market-evidence-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          fetch-depth: 0

      - name: Apply exact v193 audit patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('mcp_gateway/research_derivative_postgres_audit.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'SCHEMA_VERSION = "1.4.0"\nMODEL_VERSION = "SOCCER_RESEARCH_DERIVATIVE_MARKET_AUDIT_V4_1.4.0"',
              'SCHEMA_VERSION = "1.5.0"\nMODEL_VERSION = "SOCCER_RESEARCH_DERIVATIVE_MARKET_AUDIT_V4_1.5.0"',
              'version',
          )

          anchor = '''            columns = [desc.name for desc in cur.description]\n            rows = [dict(zip(columns, row)) for row in cur.fetchall()]\n'''
          replacement = anchor + '''\n            # Period-market evidence is intentionally independent from the Cards/Props\n            # taxonomy above. It inventories already-persisted pre-kickoff 1H/2H\n            # markets without making provider calls or creating betting signals.\n            period_filter = """\n                LOWER(COALESCE(m.market, '')) LIKE '%%first half%%'\n                OR LOWER(COALESCE(m.market, '')) LIKE '%%1st half%%'\n                OR LOWER(COALESCE(m.market, '')) LIKE '%%second half%%'\n                OR LOWER(COALESCE(m.market, '')) LIKE '%%2nd half%%'\n            """\n            cur.execute(\n                f"""\n                WITH period_base AS (\n                    SELECT\n                        m.fixture_id,\n                        m.captured_at,\n                        m.bookmaker_id,\n                        m.market,\n                        m.values,\n                        m.provider_update,\n                        CASE\n                            WHEN LOWER(COALESCE(m.market, '')) LIKE '%%second half%%'\n                              OR LOWER(COALESCE(m.market, '')) LIKE '%%2nd half%%' THEN '2H'\n                            WHEN LOWER(COALESCE(m.market, '')) LIKE '%%first half%%'\n                              OR LOWER(COALESCE(m.market, '')) LIKE '%%1st half%%' THEN '1H'\n                            ELSE NULL\n                        END AS period\n                    FROM soccer_market_snapshots m\n                    JOIN soccer_fixtures f ON f.fixture_id = m.fixture_id\n                    WHERE m.captured_at >= NOW() - (%s * INTERVAL '1 day')\n                      AND f.kickoff IS NOT NULL\n                      AND m.captured_at < f.kickoff\n                      AND ({period_filter})\n                )\n                SELECT\n                    period,\n                    COUNT(*)::BIGINT AS snapshot_rows,\n                    COUNT(DISTINCT fixture_id)::BIGINT AS unique_fixtures,\n                    COUNT(DISTINCT bookmaker_id)::BIGINT AS bookmaker_count,\n                    COUNT(DISTINCT provider_update)::BIGINT AS provider_update_count,\n                    SUM(CASE WHEN provider_update IS NOT NULL THEN 1 ELSE 0 END)::BIGINT AS provider_update_rows,\n                    SUM(\n                        CASE\n                            WHEN jsonb_typeof(COALESCE(values, '[]'::jsonb)) = 'array'\n                            THEN jsonb_array_length(COALESCE(values, '[]'::jsonb))\n                            ELSE 0\n                        END\n                    )::BIGINT AS value_rows,\n                    MIN(captured_at) AS first_seen,\n                    MAX(captured_at) AS last_seen\n                FROM period_base\n                WHERE period IS NOT NULL\n                GROUP BY period\n                ORDER BY period\n                """,\n                (lookback_days,),\n            )\n            period_total_columns = [desc.name for desc in cur.description]\n            period_totals = [dict(zip(period_total_columns, row)) for row in cur.fetchall()]\n\n            cur.execute(\n                f"""\n                WITH period_base AS (\n                    SELECT\n                        m.fixture_id,\n                        m.captured_at,\n                        m.bookmaker_id,\n                        m.market,\n                        m.values,\n                        m.provider_update,\n                        CASE\n                            WHEN LOWER(COALESCE(m.market, '')) LIKE '%%second half%%'\n                              OR LOWER(COALESCE(m.market, '')) LIKE '%%2nd half%%' THEN '2H'\n                            WHEN LOWER(COALESCE(m.market, '')) LIKE '%%first half%%'\n                              OR LOWER(COALESCE(m.market, '')) LIKE '%%1st half%%' THEN '1H'\n                            ELSE NULL\n                        END AS period\n                    FROM soccer_market_snapshots m\n                    JOIN soccer_fixtures f ON f.fixture_id = m.fixture_id\n                    WHERE m.captured_at >= NOW() - (%s * INTERVAL '1 day')\n                      AND f.kickoff IS NOT NULL\n                      AND m.captured_at < f.kickoff\n                      AND ({period_filter})\n                )\n                SELECT\n                    period,\n                    market,\n                    COUNT(*)::BIGINT AS snapshot_rows,\n                    COUNT(DISTINCT fixture_id)::BIGINT AS unique_fixtures,\n                    COUNT(DISTINCT bookmaker_id)::BIGINT AS bookmaker_count,\n                    COUNT(DISTINCT provider_update)::BIGINT AS provider_update_count,\n                    SUM(CASE WHEN provider_update IS NOT NULL THEN 1 ELSE 0 END)::BIGINT AS provider_update_rows,\n                    SUM(\n                        CASE\n                            WHEN jsonb_typeof(COALESCE(values, '[]'::jsonb)) = 'array'\n                            THEN jsonb_array_length(COALESCE(values, '[]'::jsonb))\n                            ELSE 0\n                        END\n                    )::BIGINT AS value_rows,\n                    MIN(captured_at) AS first_seen,\n                    MAX(captured_at) AS last_seen\n                FROM period_base\n                WHERE period IS NOT NULL\n                GROUP BY period, market\n                ORDER BY period, unique_fixtures DESC, snapshot_rows DESC, market ASC\n                LIMIT 250\n                """,\n                (lookback_days,),\n            )\n            period_market_columns = [desc.name for desc in cur.description]\n            period_markets = [dict(zip(period_market_columns, row)) for row in cur.fetchall()]\n'''
          replace_once(anchor, replacement, 'period-query-insertion')

          old = '''    report = summarize_rows(rows, lookback_days=lookback_days)\n    report["rows_scanned_from_postgres"] = len(rows)\n    report["max_rows"] = max_rows\n    return report\n'''
          new = '''    report = summarize_rows(rows, lookback_days=lookback_days)\n    for period_row in period_totals + period_markets:\n        for key in ("first_seen", "last_seen"):\n            value = period_row.get(key)\n            if isinstance(value, datetime):\n                period_row[key] = value.astimezone(timezone.utc).isoformat()\n    report["period_market_evidence"] = {\n        "scope": "PERSISTED_PRE_KICKOFF_MARKET_SNAPSHOTS_ONLY",\n        "provider_requests_added": 0,\n        "period_totals": {\n            str(row.get("period")): {key: value for key, value in row.items() if key != "period"}\n            for row in period_totals\n            if row.get("period")\n        },\n        "markets": period_markets,\n    }\n    report["rows_scanned_from_postgres"] = len(rows)\n    report["max_rows"] = max_rows\n    return report\n'''
          replace_once(old, new, 'report-extension')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate v193
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile mcp_gateway/research_derivative_postgres_audit.py
          PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider tests/test_research_derivative_postgres_audit.py
          python - <<'PY'
          from pathlib import Path
          src = Path('mcp_gateway/research_derivative_postgres_audit.py').read_text(encoding='utf-8')
          required = [
              'SOCCER_RESEARCH_DERIVATIVE_MARKET_AUDIT_V4_1.5.0',
              'period_market_evidence',
              "THEN '2H'",
              'PERSISTED_PRE_KICKOFF_MARKET_SNAPSHOTS_ONLY',
              'provider_requests_added": 0',
          ]
          missing = [needle for needle in required if needle not in src]
          if missing:
              raise SystemExit(f'missing invariants: {missing}')
          print('v193 invariants OK')
          PY
          git diff --check

      - name: Commit production patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mcp_gateway/research_derivative_postgres_audit.py
          git commit -m "v193: add persisted period market evidence audit"
          git push origin HEAD:soccer-edge-mcp-v1
