# trigger: runtime pytest import-path validation
name: v216.2 Team Totals CLV Skip Diagnostics

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v2162-team-totals-clv-skip-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 0

      - name: Checkout control scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: control
          sparse-checkout: |
            .github/scripts/v2162_patch_team_totals_clv_diag.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply diagnostic patch
        run: python control/.github/scripts/v2162_patch_team_totals_clv_diag.py runtime

      - name: Validate
        working-directory: runtime
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile mcp_gateway/clv_postgres_v4.py
          python -m pip install -q pytest
          pytest -q tests/test_clv_postgres_v4.py
          grep -q team_totals_skip_fixture_ids mcp_gateway/clv_postgres_v4.py
          grep -q team_totals_skip_fixture_counts mcp_gateway/clv_postgres_v4.py

      - name: Commit runtime diagnostic
        working-directory: runtime
        run: |
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add mcp_gateway/clv_postgres_v4.py
          git diff --cached --quiet && exit 0
          git commit -m 'v216.2 add Team Totals CLV skip fixture diagnostics'
          git push origin HEAD:soccer-edge-mcp-v1
