name: v226 Stripe Live Subscription

on:
  push:
    branches:
      - v226-stripe-live-subscription
    paths:
      - mcp_gateway/subscriber_billing_v226.py
      - mcp_gateway/__init__.py
      - tests/test_v226_stripe_live_subscription.py
      - .github/workflows/v226-stripe-live-subscription.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_gateway/requirements.txt pytest
      - name: Compile V226 layers
        run: |
          python -m py_compile mcp_gateway/subscriber_billing_v226.py
          python -m py_compile mcp_gateway/__init__.py
      - name: Run V226 focused regressions
        run: |
          PYTHONPATH=. pytest -q tests/test_v226_stripe_live_subscription.py tests/test_subscriber_ui_contract_v231.py tests/test_v4_023_subscriber_preview_data.py
