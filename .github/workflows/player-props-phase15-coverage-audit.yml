name: Phase15 Coverage Reconciliation Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"
  push:
    branches: [main]
    paths: [".github/workflows/player-props-phase15-coverage-audit.yml"]
  workflow_run:
    workflows: ["Player Props Postgame Backfill"]
    types: [completed]

permissions:
  contents: write
  id-token: write

concurrency:
  group: phase15-coverage-reconciliation-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1

      - name: Warm Render
        run: |
          curl -sS --max-time 180 --retry 2 --retry-delay 5 --retry-all-errors \
            https://soccer-edge-api.onrender.com/health >/tmp/health.json || true
          cat /tmp/health.json || true

      - name: Run read-only Phase15 coverage audit
        shell: bash
        run: |
          set -euo pipefail

          get_oidc_token() {
            local response token
            response=$(curl -fsS \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
            token=$(echo "$response" | jq -r '.value // empty')
            test -n "$token"
            printf '%s' "$token"
          }

          TOKEN=$(get_oidc_token)
          echo "::add-mask::$TOKEN"

          HTTP_CODE=$(curl -sS --max-time 180 -o /tmp/phase15_coverage.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"lookback_days":180,"max_rows":50000}' \
            https://soccer-edge-api.onrender.com/internal/player-props-phase15-coverage-audit)

          jq '{
            status,
            model_version,
            canonical_pregame_fixtures,
            postgame_overlap_fixtures,
            finalized_result_fixtures,
            families,
            provider_requests_added,
            production_promotion_allowed
          }' /tmp/phase15_coverage.json

          test "$HTTP_CODE" = "200"
          jq -e '
            .model_version == "SOCCER_PHASE15_COVERAGE_AUDIT_V4_1.0.0"
            and .provider_requests_added == 0
            and .production_promotion_allowed == false
            and (.families | type == "object")
            and (.fixtures | type == "array")
          ' /tmp/phase15_coverage.json >/dev/null

      - name: Materialize audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p state/soccer_edge_state/analysis
          jq 'del(.fixtures)' /tmp/phase15_coverage.json \
            > state/soccer_edge_state/analysis/player_props_phase15_coverage_audit.json
          jq -c '.fixtures[]' /tmp/phase15_coverage.json \
            > state/soccer_edge_state/analysis/player_props_phase15_coverage_fixtures.jsonl

      - name: Persist state
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f \
            soccer_edge_state/analysis/player_props_phase15_coverage_audit.json \
            soccer_edge_state/analysis/player_props_phase15_coverage_fixtures.jsonl
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Phase15 coverage reconciliation audit"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
