name: FE2 Premium Shell Preview

on:
  push:
    branches:
      - fe2-premium-shell-preview
      - fe2-live-audit-fixes
      - fe2-mobile-audit-fixes
    paths:
      - mcp_gateway/subscriber_frontend_v2.py
      - mcp_gateway/__init__.py
      - tests/test_subscriber_frontend_v2.py
      - .github/workflows/fe2-premium-shell-preview.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mcp_gateway/requirements.txt pytest
      - name: Compile premium shell
        run: |
          python -W error::SyntaxWarning -m py_compile mcp_gateway/subscriber_frontend_v2.py mcp_gateway/__init__.py

      - name: Validate rendered JavaScript syntax
        run: |
          PYTHONPATH=. python - <<'PY'
          import re
          from pathlib import Path
          from mcp_gateway import subscriber_frontend_v2
          html = subscriber_frontend_v2.render()
          Path("/tmp/app-v2.html").write_text(html, encoding="utf-8")
          match = re.search(r'<script id="soccer-edge-v2-app">(.*?)</script>', html, re.S)
          assert match, "V2 app script not found"
          Path("/tmp/app-v2.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/app-v2.js
      - name: Verify preview route
        run: |
          PYTHONPATH=. python - <<'PY'
          import mcp_gateway
          from mcp.server.fastmcp import FastMCP
          app = FastMCP("fe2-route-check", stateless_http=True, json_response=True).streamable_http_app()
          paths = {getattr(route, "path", None) for route in app.router.routes}
          assert "/app-v2" in paths
          PY
      - name: Run FE2 and active frontend regressions
        run: |
          PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider \
            tests/test_subscriber_frontend_v2.py \
            tests/test_subscriber_contract_v2.py \
            tests/test_fe0_frontend_stabilization.py \
            tests/test_v233_frontend_completion_gate.py \
            tests/test_v234_functional_mockup_completion.py
