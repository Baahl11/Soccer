name: v190 Deploy Sync Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v190-auth-allowlist-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Make v190 wait for matching Render revision
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/v190-btts-aligned-ranking-audit.yml")
          text = path.read_text(encoding="utf-8")
          start_marker = "      - name: Warm Render\n"
          end_marker = "      - name: Export current point-in-time training dataset\n"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("EXPECTED_UNIQUE_V190_WARM_AND_EXPORT_MARKERS")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          new_block = '''      - name: Warm Render and wait for checked-out runtime revision
        shell: bash
        run: |
          set -euo pipefail
          expected_commit=$(git -C runtime rev-parse HEAD)
          echo "v190 expected Render revision: ${expected_commit}"
          for attempt in $(seq 1 36); do
            if curl -sS --max-time 30 --retry 1 --retry-delay 2 --retry-all-errors \\
              https://soccer-edge-api.onrender.com/health >/tmp/health.json; then
              cat /tmp/health.json
              deployed_commit=$(jq -r '.render_git_commit // empty' /tmp/health.json)
              echo "v190 Render revision attempt ${attempt}: ${deployed_commit:-UNKNOWN}"
              if [ "$deployed_commit" = "$expected_commit" ]; then
                echo "v190 Render revision aligned"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Render did not materialize checked-out runtime revision ${expected_commit}"
          exit 1

'''
          path.write_text(text[:start] + new_block + text[end:], encoding="utf-8")
          PY
          git diff --check
          git diff -- .github/workflows/v190-btts-aligned-ranking-audit.yml

      - name: Commit v190 deploy synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add .github/workflows/v190-btts-aligned-ranking-audit.yml
          git diff --cached --quiet && exit 0
          git commit -m "v190 wait for deployed runtime revision"
          git push origin HEAD:main
