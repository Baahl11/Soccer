name: v190 Auth Allowlist Patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v190-auth-allowlist-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          fetch-depth: 1

      - name: Add v190 to exact export allowlist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("mcp_gateway/server.py")
          text = path.read_text(encoding="utf-8")
          v190 = '.github/workflows/v190-btts-aligned-ranking-audit.yml'
          if v190 in text:
              raise SystemExit("V190_ALREADY_PRESENT")

          pattern = re.compile(
              r'(?m)^(?P<indent>[ \t]*)"\.github/workflows/phase19-promotion-framework-validation\.yml",[ \t]*$'
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"EXPECTED_EXACTLY_ONE_PHASE19_EXPORT_ALLOWLIST_ENTRY got={len(matches)}")

          match = matches[0]
          replacement = match.group(0) + "\n" + match.group("indent") + f'"{v190}",'
          updated = text[:match.start()] + replacement + text[match.end():]
          path.write_text(updated, encoding="utf-8")
          PY

          git diff --check
          git diff -- mcp_gateway/server.py

      - name: Commit runtime auth-only change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add mcp_gateway/server.py
          git diff --cached --quiet && exit 0
          git commit -m "Allow v190 aligned BTTS audit dataset export"
          git push origin HEAD:soccer-edge-mcp-v1
