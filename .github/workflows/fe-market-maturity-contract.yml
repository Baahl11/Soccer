name: FE Market Maturity Contract
on:
  pull_request:
    branches:
      - soccer-edge-mcp-v1
    paths:
      - "mcp_gateway/__init__.py"
      - "mcp_gateway/subscriber_maturity_v232.py"
      - "mcp_gateway/subscriber_frontend_v2.py"
      - "web_v3/src/**"
      - "web_v3/package.json"
      - "web_v3/package-lock.json"
      - "tests/test_subscriber_maturity_market_inventory.py"
      - "tests/test_subscriber_maturity_state_artifacts.py"
      - "tests/export_subscriber_maturity_state_fixture.py"
      - "web_v3/scripts/e2e-maturity-smoke.mjs"
      - ".github/workflows/fe-market-maturity-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maturity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Checkout canonical research state (read-only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: soccer-edge-state
          path: state
          sparse-checkout: |
            soccer_edge_state/analysis/clv_v4_postgres_report.json
            soccer_edge_state/analysis/v4_017_1x2_calibration_validation.json
            soccer_edge_state/analysis/v4_018_btts_calibration_validation.json
            soccer_edge_state/analysis/v4_016_ft_totals_production_validation.json
            soccer_edge_state/analysis/v4_019_team_totals_oos_validation.json
            soccer_edge_state/analysis/v4_020_1h_oos_validation.json
            soccer_edge_state/analysis/v4_021_2h_oos_validation.json
            soccer_edge_state/analysis/v4_022_corners_oos_validation.json
            soccer_edge_state/analysis/phase14_cards_referee_validation.json
            soccer_edge_state/analysis/phase15_player_props_validation.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Install Python test dependencies
        run: pip install -r mcp_gateway/requirements.txt pytest
      - name: Compile routes and maturity services
        run: python -W error::SyntaxWarning -m py_compile mcp_gateway/__init__.py mcp_gateway/subscriber_maturity_v232.py mcp_gateway/subscriber_frontend_v2.py
      - name: Verify rendered subscriber JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from mcp_gateway import subscriber_frontend_v2
          html = subscriber_frontend_v2.render()
          match = re.search(r'<script id="soccer-edge-v2-app">(.*?)</script>', html, re.S)
          assert match, "subscriber script missing"
          assert 'data-page="maturity"' in html
          assert "api('/maturity')" in html
          Path('/tmp/soccer-maturity-frontend.js').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/soccer-maturity-frontend.js
      - name: Verify mature authenticated route and regression tests
        run: |
          PYTHONPATH=. python - <<'PY'
          import mcp_gateway
          from mcp.server.fastmcp import FastMCP
          app = FastMCP("maturity-route-check", stateless_http=True, json_response=True).streamable_http_app()
          paths = {getattr(route, "path", None) for route in app.router.routes}
          assert "/app/api/v2/maturity" in paths
          PY
          # Four legacy FE2 copy assertions already fail on the base branch; do not
          # fabricate absent UI text merely to satisfy old strings. Keep the rest
          # of the FE2 suite and every new maturity regression mandatory.
          PYTHONPATH=. pytest -q -c /dev/null --rootdir=. -p no:cacheprovider \
            tests/test_subscriber_maturity_market_inventory.py \
            tests/test_subscriber_maturity_state_artifacts.py \
            tests/test_subscriber_frontend_v2.py \
            -k "not test_fe2_full_slate_exposes_coverage_and_insufficient_data_copy and not test_fe2_every_slate_fixture_is_openable_for_data_review and not test_fe2_match_intelligence_is_sport_first_not_market_first and not test_fe2_visible_sport_input_count_matches_rendered_inputs"
      - name: Verify React build
        working-directory: web_v3
        run: npm ci && npm run build
      - name: Archive compiled React V3 release candidate (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: soccer-market-maturity-react-dist
          path: web_v3/dist/
          if-no-files-found: error

      - name: Export canonical-source browser fixture
        run: PYTHONPATH=. python tests/export_subscriber_maturity_state_fixture.py
      - name: Install Chromium browser QA dependencies
        working-directory: web_v3
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser QA desktop/mobile and error states
        working-directory: web_v3
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/soccer-vite-maturity.log 2>&1 &
          for attempt in $(seq 1 25); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/e2e-maturity-smoke.mjs
      - name: Archive browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-maturity-desktop-mobile-qa
          path: /tmp/soccer-maturity-browser-qa/
          if-no-files-found: ignore

      - name: Read-only live anonymous route probe (no deployment)
        run: |
          set -euo pipefail
          BASE=https://soccer-edge-api.onrender.com
          HEALTH=$(curl -sSL --connect-timeout 10 --max-time 40 -o /tmp/soccer-live-health.json -w '%{http_code}' "$BASE/health" || true)
          echo "Live health HTTP: ${HEALTH:-NOT_VERIFIED}"
          if [ "$HEALTH" = 200 ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          try:
              payload = json.loads(Path("/tmp/soccer-live-health.json").read_text())
              print("Live backend commit:", payload.get("render_git_commit") or "NOT VERIFIED")
              print("Live backend health:", payload.get("status") or "NOT VERIFIED")
          except Exception:
              print("Live backend response shape: NOT VERIFIED")
          PY
          fi
          for path in /app /app-v3-react; do
            CODE=$(curl -sSL --connect-timeout 10 --max-time 40 -o /dev/null -w '%{http_code}' "$BASE$path" || true)
            echo "Live public shell ${path}: ${CODE:-NOT_VERIFIED}"
          done
          CODE=$(curl -sSL --connect-timeout 10 --max-time 40 -o /tmp/soccer-live-anon-maturity.json -w '%{http_code}' "$BASE/app/api/v2/maturity" || true)
          echo "Live ANONYMOUS maturity endpoint: ${CODE:-NOT_VERIFIED}"
          if [ "$CODE" = "200" ]; then
            echo "SECURITY FAILURE: anonymous request returned research payload"
            exit 1
          fi
          if [ "$CODE" = "401" ]; then
            echo "Anonymous authentication guard confirmed in currently deployed service"
          elif [ "$CODE" = "404" ]; then
            echo "Maturity PR is not yet deployed; live auth/role/real UI cannot be verified"
          else
            echo "Live route authorization NOT VERIFIED; no release inferred"
          fi
