name: v181 Signal Ledger Provenance Materialization

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v181-signal-ledger-provenance-materialization.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout state history
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1
          sparse-checkout: |
            soccer_edge_state/history
            soccer_edge_state/analysis/signal_ledger.jsonl
            soccer_edge_state/analysis/signal_ledger_summary.json
          sparse-checkout-cone-mode: false

      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild signal ledger with calibration provenance
        shell: bash
        run: |
          set -euo pipefail
          python runtime/mcp_gateway/build_signal_ledger.py \
            --history-dir state/soccer_edge_state/history \
            --output state/soccer_edge_state/analysis/signal_ledger.jsonl \
            --summary-output state/soccer_edge_state/analysis/signal_ledger_summary.json

          jq '{schema_version,rows,unique_fixtures,rows_with_market,rows_with_phase16_calibration_provenance,rows_phase16_promotion_shadow_eligible,provider_requests_added,canonical_bet_logic_changed,model_weights_changed}' \
            state/soccer_edge_state/analysis/signal_ledger_summary.json

          jq -e '.schema_version == "1.3.0"' state/soccer_edge_state/analysis/signal_ledger_summary.json >/dev/null
          jq -e '.provider_requests_added == 0' state/soccer_edge_state/analysis/signal_ledger_summary.json >/dev/null
          jq -e '.canonical_bet_logic_changed == false' state/soccer_edge_state/analysis/signal_ledger_summary.json >/dev/null
          jq -e '.model_weights_changed == false' state/soccer_edge_state/analysis/signal_ledger_summary.json >/dev/null

      - name: Persist provenance-enriched ledger
        working-directory: state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/signal_ledger.jsonl soccer_edge_state/analysis/signal_ledger_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Materialize v181 signal ledger provenance"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
