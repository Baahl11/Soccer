name: Phase 19 Promotion Framework Validation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["V4 Market Validation Refresh"]
    types: [completed]
  push:
    branches: [main]
    paths: [".github/workflows/phase19-promotion-framework-validation.yml"]

permissions:
  contents: write

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 19 unit tests
        working-directory: runtime
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          PYTHONPATH=. pytest -q tests/test_phase19_promotion_framework_v4.py

      - name: Build current promotion framework report
        working-directory: runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m mcp_gateway.promotion_framework_v4             --analysis-dir ../state/soccer_edge_state/analysis             --market-performance ../state/soccer_edge_state/analysis/market_performance_summary.json             --stability-report ../state/soccer_edge_state/analysis/league_stage_stability_v4.json             --output ../state/soccer_edge_state/analysis/phase19_promotion_framework_report.json

      - name: Validate safety gates
        run: |
          set -euo pipefail
          jq -e '.phase == "FASE_19_PROMOTION_FRAMEWORK"' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '.automatic_promotion_allowed == false' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '.manual_approval_required == true' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '.runtime_state_mutation_enabled == false' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null

      - name: Persist report to state branch
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/phase19_promotion_framework_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Phase 19 promotion framework report"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
