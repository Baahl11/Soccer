# Phase19 Draw challenger live audit retry: 2026-09-24
name: Phase 19 Promotion Framework Validation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["V4 Market Validation Refresh", "Soccer Edge Settlement Review", "V4-022 Corners OOS Validation"]
    types: [completed]
  push:
    branches: [main]
    paths: [".github/workflows/phase19-promotion-framework-validation.yml"]

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1
          sparse-checkout: |
            soccer_edge_state/analysis/market_performance_summary.json
            soccer_edge_state/analysis/league_stage_stability_v4.json
            soccer_edge_state/analysis/shadow_performance_summary_v4.json
            soccer_edge_state/analysis/shadow_selection_diagnostics_v4.json
            soccer_edge_state/analysis/promotion_shadow_postgres_v4.json
            soccer_edge_state/analysis/oos_stage_diagnostics_v4.json
            soccer_edge_state/analysis/phase19_promotion_framework_report.json
            soccer_edge_state/analysis/v4_016_ft_totals_production_validation.json
            soccer_edge_state/analysis/v4_017_1x2_calibration_validation.json
            soccer_edge_state/analysis/v4_018_btts_calibration_validation.json
            soccer_edge_state/analysis/v4_019_team_totals_oos_validation.json
            soccer_edge_state/analysis/v4_020_1h_oos_validation.json
            soccer_edge_state/analysis/v4_021_2h_oos_validation.json
            soccer_edge_state/analysis/v4_022_corners_oos_validation.json
            soccer_edge_state/analysis/phase14_cards_referee_validation.json
            soccer_edge_state/analysis/phase15_player_props_validation.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 19 unit tests
        working-directory: runtime
        run: |
          python -m pip install --upgrade pip
          pip install pytest "lightgbm>=4,<5"
          PYTHONPATH=. pytest -q tests/test_phase19_promotion_framework_v4.py tests/test_promotion_shadow_postgres_v4.py tests/test_draw_challenger_v4.py

      - name: Build promotion-quality shadow from Postgres
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --max-time 180 --retry 2 --retry-delay 5 --retry-all-errors \
            https://soccer-edge-api.onrender.com/health >/tmp/health.json || true

          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          TOKEN=$(echo "$RESPONSE" | jq -r '.value // empty')
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          HTTP_CODE=$(curl -sS --max-time 420 -o /tmp/promotion_shadow_v4.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"lookback_days":180,"max_rows":50000}' \
            https://soccer-edge-api.onrender.com/internal/promotion-shadow-v4/build)

          cat /tmp/promotion_shadow_v4.json | jq '{
            status,
            model_version,
            source_model_version,
            raw_phase16_candidates_loaded,
            phase16_rankable_supported_rows_seen,
            excluded_without_current_calibration_policy,
            promotion_evaluable,
            families,
            provider_requests_added,
            error,
            detail
          }'
          test "$HTTP_CODE" = "200"
          jq -e '
            .schema_version == "1.3.0"
            and .model_version == "SOCCER_PROMOTION_SHADOW_POSTGRES_V4_1.8.0"
            and (.promotion_evaluable | type == "object")
            and (.rows | type == "array")
            and (.provider_requests_added == 0)
          ' /tmp/promotion_shadow_v4.json >/dev/null

          cp /tmp/promotion_shadow_v4.json state/soccer_edge_state/analysis/promotion_shadow_postgres_v4.json

          CUTOFF=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DRAW_HTTP_CODE=$(curl -sS --max-time 420 -o /tmp/phase19_draw_dataset.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg cutoff "$CUTOFF" '{cutoff:$cutoff,row_limit:20000}')" \
            https://soccer-edge-api.onrender.com/internal/training-dataset/export)

          test "$DRAW_HTTP_CODE" = "200"
          jq -e '.status == "OK" and .market_fields_included == false and (.rows | type == "array")' /tmp/phase19_draw_dataset.json >/dev/null

          PYTHONPATH=runtime python -m mcp_gateway.draw_challenger_v4 \
            --dataset /tmp/phase19_draw_dataset.json \
            --output /tmp/draw_challenger_v4.json

          jq '{
            model_version,
            status,
            dataset_row_count,
            eligible_rows,
            walk_forward_evaluated,
            baseline_metrics,
            challenger_metrics,
            comparison,
            research_followup_candidate,
            production_promotion_allowed
          }' /tmp/draw_challenger_v4.json

          jq -e '
            .model_version == "LIGHTGBM_DRAW_V4_CHALLENGER_1.0.0"
            and .market_fields_used == false
            and .post_kickoff_features_used == false
            and .provider_requests_added == 0
            and .production_promotion_allowed == false
            and (.status == "RESEARCH_ONLY" or .status == "INSUFFICIENT_TRAINING_SAMPLE")
          ' /tmp/draw_challenger_v4.json >/dev/null

          cp /tmp/draw_challenger_v4.json state/soccer_edge_state/analysis/draw_challenger_v4.json

      - name: Build current promotion framework report
        working-directory: runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m mcp_gateway.promotion_framework_v4             --analysis-dir ../state/soccer_edge_state/analysis             --market-performance ../state/soccer_edge_state/analysis/market_performance_summary.json             --stability-report ../state/soccer_edge_state/analysis/league_stage_stability_v4.json             --shadow-performance ../state/soccer_edge_state/analysis/shadow_performance_summary_v4.json             --shadow-selection-diagnostics ../state/soccer_edge_state/analysis/shadow_selection_diagnostics_v4.json             --promotion-shadow-report ../state/soccer_edge_state/analysis/promotion_shadow_postgres_v4.json             --oos-stage-diagnostics ../state/soccer_edge_state/analysis/oos_stage_diagnostics_v4.json             --output ../state/soccer_edge_state/analysis/phase19_promotion_framework_report.json

      - name: Validate safety gates
        run: |
          set -euo pipefail
          jq -e '.phase == "FASE_19_PROMOTION_FRAMEWORK"' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '.model_version == "SOCCER_PROMOTION_FRAMEWORK_V4_1.11.0"' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '.automatic_promotion_allowed == false' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '.manual_approval_required == true' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '.runtime_state_mutation_enabled == false' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '.promotion_readiness.status == "PROMOTION_READINESS_VISIBLE"' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '.promotion_readiness.thresholds.directional == 20' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '.promotion_readiness.thresholds.tier_b == 50' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '.promotion_readiness.thresholds.tier_a == 100' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '.promotion_readiness.thresholds.tier_s == 200' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '([.market_family_reviews[] | select(.market_family == "1X2")][0].promotion_shadow_selection_progress | type == "object")' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '([.market_family_reviews[] | select(.market_family == "FT_CORNERS")][0].validation_blockers | index("SOURCE_TEAM_CORNERS_PROMOTION_GATE_DISABLED")) == null' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '([.market_family_reviews[] | select(.market_family == "TEAM_CORNERS")][0].validation_blockers | index("SOURCE_FT_CORNERS_PROMOTION_GATE_DISABLED")) == null' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null

      - name: Persist report to state branch
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/phase19_promotion_framework_report.json
          git add -f soccer_edge_state/analysis/promotion_shadow_postgres_v4.json
          git add -f soccer_edge_state/analysis/draw_challenger_v4.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Phase 19 promotion framework report"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
