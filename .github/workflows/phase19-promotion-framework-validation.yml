name: Phase 19 Promotion Framework Validation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["V4 Market Validation Refresh", "Soccer Edge Settlement Review"]
    types: [completed]
  push:
    branches: [main]
    paths: [".github/workflows/phase19-promotion-framework-validation.yml"]

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-mcp-v1
          path: runtime
          fetch-depth: 1

      - name: Checkout state
        uses: actions/checkout@v4
        with:
          ref: soccer-edge-state
          path: state
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Phase 19 unit tests
        working-directory: runtime
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          PYTHONPATH=. pytest -q tests/test_phase19_promotion_framework_v4.py

      - name: Build promotion-quality shadow from Postgres
        shell: bash
        run: |
          set -euo pipefail

          curl -sS --max-time 180 --retry 2 --retry-delay 5 --retry-all-errors \
            https://soccer-edge-api.onrender.com/health >/tmp/health.json || true

          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=soccer-edge-render")
          TOKEN=$(echo "$RESPONSE" | jq -r '.value // empty')
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          HTTP_CODE=$(curl -sS --max-time 420 -o /tmp/promotion_shadow_v4.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"lookback_days":180,"max_rows":50000}' \
            https://soccer-edge-api.onrender.com/internal/promotion-shadow-v4/build)

          cat /tmp/promotion_shadow_v4.json | jq '{
            status,
            model_version,
            source_model_version,
            raw_match_table_rows_loaded,
            promotion_evaluable,
            provider_requests_added,
            error,
            detail
          }'
          test "$HTTP_CODE" = "200"
          jq -e '
            .schema_version == "1.0.0"
            and .model_version == "SOCCER_PROMOTION_SHADOW_POSTGRES_V4_1.0.0"
            and (.promotion_evaluable | type == "object")
            and (.rows | type == "array")
            and (.provider_requests_added == 0)
          ' /tmp/promotion_shadow_v4.json >/dev/null

          cp /tmp/promotion_shadow_v4.json state/soccer_edge_state/analysis/promotion_shadow_postgres_v4.json

      - name: Build current promotion framework report
        working-directory: runtime
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m mcp_gateway.promotion_framework_v4             --analysis-dir ../state/soccer_edge_state/analysis             --market-performance ../state/soccer_edge_state/analysis/market_performance_summary.json             --stability-report ../state/soccer_edge_state/analysis/league_stage_stability_v4.json             --shadow-performance ../state/soccer_edge_state/analysis/shadow_performance_summary_v4.json             --shadow-selection-diagnostics ../state/soccer_edge_state/analysis/shadow_selection_diagnostics_v4.json             --promotion-shadow-report ../state/soccer_edge_state/analysis/promotion_shadow_postgres_v4.json             --output ../state/soccer_edge_state/analysis/phase19_promotion_framework_report.json

      - name: Validate safety gates
        run: |
          set -euo pipefail
          jq -e '.phase == "FASE_19_PROMOTION_FRAMEWORK"' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '.automatic_promotion_allowed == false' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '.manual_approval_required == true' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null
          jq -e '.runtime_state_mutation_enabled == false' state/soccer_edge_state/analysis/phase19_promotion_framework_report.json >/dev/null

      - name: Persist report to state branch
        working-directory: state
        run: |
          set -euo pipefail
          git config user.name soccer-edge-bot
          git config user.email soccer-edge-bot@users.noreply.github.com
          git add -f soccer_edge_state/analysis/phase19_promotion_framework_report.json
          git add -f soccer_edge_state/analysis/promotion_shadow_postgres_v4.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Phase 19 promotion framework report"
          for attempt in 1 2 3; do
            git fetch origin soccer-edge-state
            git rebase origin/soccer-edge-state
            if git push origin HEAD:soccer-edge-state; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
